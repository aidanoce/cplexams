  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }

function shuffleOpts(q) {
  // Shuffle the A-D options (and the correct answer with them). Questions whose options refer to other options stay as written.
  const refers = q.o.some(x => /\b(all|none|both|neither)\b|\[[a-e]\]|\b[a-e]\)|\bas above\b|\babove\b/i.test(x));
  if (refers || q.o.length < 2) return q;
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

  {t:"Test 1",n:1,q:"The application of carburettor heat when ice has formed in the carburettor will be accompanied by",o:["an increase in cylinder head temperature and an increase in manifold pressure","an immediate drop in manifold pressure followed by an increase in manifold pressure and a richer mixture","a rise in cylinder head temperature due to a leaner mixture","an immediate increase in manifold pressure and a rise in cylinder head temperature"],a:1,e:"Ice takes time to melt, so manifold pressure first drops, then slowly rises, and stays high until the hot air is turned off."},

  {t:"Test 1",n:5,q:"An engine is running with the mixture fully rich. Progressive leaning to peak EGT will produce",o:["best power first, followed by best economy then peak EGT","best economy first, followed by best power then peak EGT","best power at peak EGT","best economy at peak EGT"],a:0,d:1,e:"Leaning from full rich passes best power first, then best economy, and finally peak EGT."},
  {t:"Test 1",n:6,q:"A descent from high altitude where the engines have been leaned to peak EGT is made with no adjustment being made to the mixture. As the descent is continued to sea level",o:["mixture will become too rich due to the increased air density","cylinder head temperature will rise and back firing could occur","the increasing air density will cool the air too rapidly","a leaner mixture will be accompanied by decreasing manifold pressure"],a:1,e:"Denser air leans the mixture further. A lean mixture makes CHT rise and can cause backfiring."},
  {t:"Test 1",n:7,q:"Operating an engine with too low an oil quantity will produce",o:["rising oil temperature and pressure","falling oil temperature and rising oil pressure","falling oil pressure and falling oil temperature","rising oil temperature and dropping oil pressure"],a:3,e:"Too little oil cannot cool the engine, so the oil overheats, thins and loses pressure."},
  {t:"Test 1",n:8,q:"Vaporising of fuel in the fuel lines can be caused by",o:["high engine temperature and high power","excessively lean mixtures","overuse of the boost pump at low engine power","using rich mixtures at high altitudes"],a:0,e:"High power pulls fuel through the lines faster, and hot fuel vaporises more easily, especially at low ambient pressure."},
  {t:"Test 1",n:9,q:"If a heat soaked engine will not start due to fuel vaporisation, an appropriate action would be",o:["crank the engine with mixture lean until it fires","continue cranking the engine with mixture rich and prime pump on","operate the prime pump with the mixture in idle cut off to purge the vapour","wait about 15 minutes then try again with the mixture lean"],a:2,e:"Running the prime pump with the mixture at idle cut-off circulates cool fuel through the system and purges the vapour."},
  {t:"Test 1",n:10,q:"If an engine begins to run roughly due to vaporisation of fuel during flight the appropriate pilot action would be",o:["operate the boost pump","richen the mixture","check the boost pump is turned off and reduce power","place the mixture in the idle cut off and turn the boost pump on"],a:0,e:"The boost pump helps push fuel through the lines and stops it breaking down into vapour."},
  {t:"Test 1",n:11,q:"When increasing power on an engine fitted with a CSU it is good practice to",o:["increase RPM before manifold pressure to prevent overboosting","increase manifold pressure before RPM to prevent overboosting","increase manifold pressure and RPM together","increase manifold pressure only as RPM do not affect power"],a:0,e:"Raising RPM first keeps the charge from becoming excessive, which would otherwise cause overboosting."},
  {t:"Test 1",n:12,q:"Throttle operation during take off with an engine fitted with a supercharger should be",o:["slow opening of the throttle to fully opened position","rapid movement of the throttle to the fully open position","careful operation of the throttle with care not to exceed rated boost","rapid movement to rated boost then slowly to fully open position"],a:2,e:"A supercharger can easily exceed rated boost at low altitude, so the throttle must be opened carefully."},
  {t:"Test 1",n:13,q:"The purpose of a supercharger fitted to an engine is",o:["to increase power by pumping extra fuel into the cylinders","to increase power by increasing the mass air flow","to increase power by producing an increase in RPM","to increase power by allowing richer mixtures to be used"],a:1,e:"A supercharger compresses the intake air, increasing the mass of air entering the engine, so more fuel can be burnt."},
  {t:"Test 1",n:14,q:"If a centre zero ammeter indicates an unusually high charge rate during flight the cause could be",o:["a faulty battery","the alternator has failed","the electrical system is overloaded","the indication would be normal if all electrical loads are turned on"],a:0,e:"A continuously high charge rate means the battery is not accepting its charge, which points to a faulty battery."},
  {t:"Test 1",n:15,q:"Excessive use of the starter motor on an engine which is difficult to start can cause",o:["a burn out of the alternator","will damage the battery","can cause damage to the starter motor solenoid","overheating of the starter motor"],a:3,e:"The starter motor draws an extremely high current, so prolonged use causes rapid heating."},
  {t:"Test 1",n:16,q:"The use of a lower grade of fuel than specified for an engine can",o:["promote detonation at high power","cause lead fouling of the spark plugs","result in an over lean mixture","increase the risk of vapour locking"],a:0,e:"Lower grade fuel resists detonation less, and detonation at high power can cause serious engine damage."},
  {t:"Test 1",n:17,q:"Battery compartments are vented because",o:["heat from the battery can cause pressure build up in the compartment","the battery needs air to help keep it cool","dangerous gases such as hydrogen are released when the battery is charged","vents allow water to drain away from the battery compartment"],a:2,e:"Charging a battery releases hydrogen, a highly flammable gas."},
  {t:"Test 1",n:18,q:"Fuel tank vents should be inspected before flight because",o:["a blockage in the vent can interrupt the fuel supply to the engine","the vent allows excess fuel to escape if the tank is full","a blocked vent increases the risk in the event of fire","the vent must allow dangerous fumes to escape from the tank"],a:0,e:"A blocked vent creates a vacuum as fuel is drawn out, which restricts flow and can cause fuel starvation."},
  {t:"Test 1",n:19,q:"If the gas pressure is too low in a hydraulic accumulator you would expect",o:["a reduction in system pressure","a reduction in emergency pressure and slower operation of some services","an increased risk of air entering the system","difficulty in using the emergency hand pump"],a:1,e:"The accumulator works like a battery in a hydraulic system, giving emergency pressure and helping the pump, so low gas pressure reduces both."},
  {t:"Test 1",n:20,q:"The purpose of a shimmy damper is",o:["to prevent the wheels from locking if too much brake is applied","to stop the wheels from rotating after lift off","to absorb undercarriage shocks on rough strips","to prevent nose wheel vibration during ground operation"],a:3,e:"A shimmy damper stops nose wheel vibration (shimmy) during ground operation."},
  {t:"Test 1",n:21,q:"Unintentional retraction of the undercarriage while on the ground is prevented by",o:["a microswitch on the undercarriage selector","a microswitch on the instrument panel","a microswitch on one of the undercarriage legs","a microswitch on the throttle linkage"],a:2,e:"A microswitch on an undercarriage leg senses weight on the wheels and blocks retraction on the ground."},
  {t:"Test 1",n:22,q:"An aircraft is parked on a strip with the engine stopped. If the elevation of the strip is 2000 ft above mean sea level, what would the manifold pressure gauge be expected to read?",o:["approximately 30 Hg","approximately 28 Hg","approximately 1013 hPa","approximately 25 Hg"],a:1,e:"Pressure drops about 1 inHg per 1000 ft, so at 2000 ft the gauge reads about 28 inHg (the ambient pressure) with the engine stopped."},
  {t:"Test 1",n:23,q:"The effect of a blocked static vent during a long climb would be",o:["the airspeed indicator under reading","the airspeed indicator over reading","the altimeter under reading","the altimeter over reading"],a:0,e:"The trapped static pressure stays high as the aircraft climbs, so the airspeed indicator reads lower than it should."},
  {t:"Test 1",n:24,q:"An altimeter reads the aircraft's vertical displacement from",o:["mean sea level in ISA","mean sea level","the ground","that pressure which is selected on the sub scale of the instrument"],a:3,e:"The altimeter measures ambient pressure and compares it with the subscale setting, showing height as the difference."},
  {t:"Test 1",n:25,q:"Following the toppling of a directional gyro in flight the instrument will",o:["remain serviceable but must be reset to the correct heading","be unserviceable for the rest of the flight","reset itself automatically","require servicing after landing"],a:0,e:"A toppled directional gyro is not damaged. It only needs to be reset to the correct heading."},
  {t:"Test 1",n:26,q:"In the southern hemisphere, an aircraft's actual heading will lag behind the compass indication when the aircraft is turning onto",o:["north","south","east","west"],a:0,e:"In the southern hemisphere the compass runs ahead of the true heading when turning onto north, so the actual heading lags behind it."},
  {t:"Test 1",n:27,q:"If the outside air temperature is +5°C and the relative humidity is 60%, which of the situations described below would be most likely to produce carburettor icing?",o:["cruising at maximum continuous power","climbing at full power","cruising at 65% power","descending at 35% power"],a:3,e:"A partly closed throttle at low power causes a large pressure drop and cooling in the carburettor throat, which makes ice most likely."},
  {t:"Test 1",n:28,q:"During a dive, if power is not reduced, constant speed propellers may move onto the",o:["fine pitch stops and then slow down","fine pitch stops and then overspeed","coarse pitch stops and then slow down","coarse pitch stops and then overspeed"],a:3,e:"The governor moves the blades to coarse pitch, but once the coarse stops are reached the propeller acts as fixed pitch and overspeeds."},
  {t:"Test 1",n:29,q:"Using fuel of a lower octane rating than is recommended for an engine can result in",o:["exhaust valve erosion","afterburning","backfiring","detonation"],a:3,e:"Octane rating measures a fuel's resistance to detonation, so a lower octane fuel in a high compression engine is more likely to detonate."},
  {t:"Test 1",n:30,q:"A shimmy damper is a device designed to control vibration of the",o:["rudder control surface","main wheels during retraction","nose wheel","elevator control surface"],a:2,e:"A shimmy damper controls nose wheel vibration and is common on light training aeroplanes."},
  {t:"Test 1",n:31,q:"On a colour coded ASI, the maximum landing gear operation speed (VLE) is",o:["marked at the end of a green arc","marked at the top of the white arc","not marked","marked by a radial red line"],a:2,e:"VLE is not on the colour coded ASI. It is usually placarded near the landing gear selector."},
  {t:"Test 1",n:32,q:"The engine operating conditions most likely to produce fouling of the spark plugs are",o:["high power and lean mixture","high power and rich mixture","low power and lean mixture","low power and rich mixture"],a:3,e:"Low power gives low combustion temperatures, so oil and rich mixture deposits build up on the plugs without burning off."},
  {t:"Test 1",n:33,q:"With regard to CHT and EGT gauges, which of the following is true",o:["CHT gauges react more quickly to sudden combustion temperature changes","EGT gauges and CHT gauges do not register sudden temperature changes","both gauges register sudden changes in combustion temperature","EGT gauges register sudden changes in combustion temperature more quickly than CHT gauges"],a:3,e:"The cylinder head is a large metal mass and changes temperature slowly, while the EGT probe responds almost instantly."},
  {t:"Test 1",n:34,q:"In the southern hemisphere the heading indicated by a direct reading magnetic compass will lead an aeroplane's actual heading when turning onto",o:["east","south","north","west"],a:2,e:"The compass leads the actual heading when turning onto north in the southern hemisphere."},
  {t:"Test 1",n:35,q:"During a climb a high cylinder head temperature can be reduced by",o:["leaning the mixture","increasing the IAS","closing the cowl flaps","decreasing the IAS"],a:1,e:"Higher IAS means more airflow over the air-cooled engine, which improves cooling."},
  {t:"Test 1",n:36,q:"The function of a pressure relief valve (PRV) in a hydraulic system is to",o:["maintain a constant pressure in the hydraulic accumulator","prevent the system pressure from falling below a pre-set minimum value","prevent a build up of pressure in the system should the pressure regulator fail","regulate the pressure in the system during normal operation"],a:2,e:"The pressure regulator normally controls system pressure. The PRV is a stand-by that stops pressure building up if the regulator fails."},

  // ---------- FINAL TEST 2 ----------
  {t:"Test 2",n:1,q:"If carburettor ice has formed on an engine fitted with a CSU, the application of carburettor heat will cause",o:["a drop in manifold pressure and a drop in RPM","an initial drop, followed by an increase in manifold pressure at constant RPM","a rise in both manifold pressure and RPM","a rise in manifold pressure and a drop in RPM"],a:1,e:"Carb heat causes an initial drop in manifold pressure, then a slow rise as the ice melts, with RPM held constant by the CSU."},
  {t:"Test 2",n:2,q:"During a long descent cylinder head temperature becomes too low. This can be rectified by",o:["opening the cowl flaps","adding power and increasing the rate of descent","adding power and decreasing the rate of descent","reducing the indicated airspeed"],a:2,e:"Adding power adds engine heat, and a lower rate of descent reduces the cooling from the airflow."},
  {t:"Test 2",n:3,q:"During a long climb, the cylinder head temperature becomes too high. This can be rectified by",o:["closing the cowl flaps","reducing the climbing indicated air speed","leaning the mixture to best power","richening the mixture to full rich and increasing the climbing indicated air speed"],a:3,e:"Full rich adds fuel that cools the cylinders most directly, and a higher IAS carries more heat away from the air-cooled engine."},
  {t:"Test 2",n:4,q:"During take off from a strip where the density altitude is extremely high, the best take off performance would be achieved by setting the mixture control for",o:["fully rich","peak EGT","smooth running","best economy"],a:2,e:"At very high density altitude, full rich gives more fuel than needed and can cause rough running, so the mixture is set for smooth running."},
  {t:"Test 2",n:5,q:"The best TAS at a given height and manifold pressure would be achieved with the mixture control set for",o:["full rich","best economy","best power","peak EGT"],a:2,e:"The higher the power, the higher the TAS, so best power gives the highest TAS for a given manifold pressure and height."},
  {t:"Test 2",n:6,q:"If maximum power is applied for take off while the oil temperature is too low",o:["the engine components could suffer stresses due to uneven heating","take off manifold pressure could be lower than normal","cylinder head temperature would become too high during take off","take off power would be severely reduced"],a:0,e:"An air-cooled engine heats quickly, and cold oil is thick, so parts heat and expand unevenly and internal stresses build up."},
  {t:"Test 2",n:7,q:"Vaporisation of fuel would be most likely to occur at high power settings",o:["with hot fuel and low atmospheric pressure","with cold fuel and low atmospheric pressure","with hot fuel and high atmospheric pressure","with cold fuel and high atmospheric pressure"],a:0,e:"Heat and low ambient pressure both make a liquid vaporise more easily."},
  {t:"Test 2",n:8,q:"For a rate one turn to the right from 090°M onto 270°M, the time taken to complete the turn and the appropriate heading on which to commence a roll out would be",o:["the turn would take 2 minutes to complete and roll out should commence at 270°M","the turn would take 1 minute to complete and roll out should commence at 260°M","the turn would take 2 minutes to complete and roll out should commence at 280°M","the turn would take 1 minute to complete and roll out should commence at 270°M"],a:1,e:"A rate one turn takes 2 minutes for 360°, so 1 minute for 180°. Rolling out about 10° early at 260°M gives 270°M."},
  {t:"Test 2",n:9,q:"If the manifold pressure exceeds rated boost in a turbo charged engine",o:["fuel vaporisation would occur","detonation and engine damage could result","the engine would backfire and lose power","cylinder head temperature will rise and power will be less than normal"],a:1,e:"Excess boost forces too much charge into the cylinders, and compression heat can cause detonation and engine damage."},
  {t:"Test 2",n:10,q:"If failure of a CSU locks the propeller blades at one fixed position",o:["the pilot will not be able to change the propeller RPM","the propeller RPM would change with engine power changes","the engine will gradually lose RPM","the propeller will over speed unless power is reduced"],a:1,e:"With the blades fixed, the propeller behaves as a fixed pitch propeller, so RPM changes with engine power."},
  {t:"Test 2",n:11,q:"The propeller pitch control is set to fully fine position during the engine run up. This is done to",o:["allow the propeller RPM to indicate engine power","allow the pilot to check the maximum engine RPM available","allow the engine to reach normal operating temperature","prevent RPM from becoming too low at idle power settings"],a:0,e:"In the fully fine position the propeller acts as fixed pitch, so changes in RPM directly show changes in engine power."},
  {t:"Test 2",n:12,q:"If the oil pressure gauge begins to fluctuate during flight",o:["the oil temperature is too high","the oil pressure gauge is unserviceable","the oil temperature is too low","the oil quantity is very low"],a:3,e:"With very little oil in the sump the pump outlet is uncovered by the aircraft's motion, so pressure drops and rises repeatedly."},
  {t:"Test 2",n:13,q:"The cause of an abnormally high oil pressure indication could be",o:["oil quantity is too low","oil temperature is too low","oil temperature is too high","the oil sump is overfilled"],a:1,e:"Cold oil is more viscous and offers high resistance to the pump, so pressure rises. Most regulators allow higher pressure when the oil is cold."},
  {t:"Test 2",n:14,q:"If the oil level in an operating engine is below the specified minimum",o:["the engine could overheat at high power settings","oil temperature would be lower than normal","engine power will be reduced","there will be a large power loss due to increased engine friction"],a:0,e:"Oil also cools the engine, so with too little oil the remaining oil gets hotter and the engine can overheat at high power."},
  {t:"Test 2",n:15,q:"A centre zero ammeter shows a constant high charge rate when",o:["the alternator has failed","the alternator voltage is low","all electrical loads are on","the battery is faulty"],a:3,e:"A constant high charge rate means the battery is not accepting its charge, so the battery is faulty."},
  {t:"Test 2",n:16,q:"A left hand zero ammeter indicates zero when",o:["the alternator has failed","all electrical loads are off","the battery is fully charged","the battery circuit is switched off"],a:0,e:"Some output should always reach the battery, so a zero reading means the alternator has failed."},
  {t:"Test 2",n:17,q:"In an engine fitted with a constant speed unit the onset of fuel vapour locking would be indicated by",o:["falling manifold pressure","fluctuating RPM","fluctuating fuel pressure","high fuel consumption"],a:2,e:"Vapour in the fuel lines is compressible, so fuel pressure drops and fluctuates as liquid flow is interrupted."},
  {t:"Test 2",n:18,q:"The function of a forward facing fuel tank vent is to",o:["increase the fuel flow at high altitude","provide a positive pressure in the fuel tank","allow fuel to escape if the tank is overfilled","reduce the air pressure in the fuel tank at high speed"],a:1,e:"A forward facing vent picks up total pressure, giving a slight positive pressure in the tank that helps fuel flow."},
  {t:"Test 2",n:19,q:"The continuous use of a higher grade of fuel than recommended can cause",o:["overboosting of the engine","overheating and detonation","an increased risk of vapour locking","corrosion of internal engine components"],a:3,e:"Lead deposits from higher grade fuel, used in an engine designed for lower grade, are corrosive."},
  {t:"Test 2",n:20,q:"After hydraulic flaps are lowered in flight, they slowly return towards the up position of their own accord. A possible reason for this problem is",o:["hydraulic oil is leaking from the system","the level of hydraulic oil is too low","the hydraulic accumulator is leaking","the pressure regulator is set too low"],a:0,e:"If the flaps drift up with the selector up, the actuator must be pushing oil out through a leak in the lines."},
  {t:"Test 2",n:21,q:"If brake pedals feel normal when pressure is applied, but slowly leak down as pressure is maintained",o:["the hydraulic fluid level is low","there is air in the brake lines","the brake pads are badly worn","there is a leak in the system"],a:3,e:"A slow leak down under sustained pressure is the classic symptom of fluid leaking from the lines."},
  {t:"Test 2",n:22,q:"The manifold pressure gauge of a normally aspirated engine at full power at sea level would read",o:["more than the outside atmospheric pressure","the same as the outside atmospheric pressure","slightly less than the outside atmospheric pressure","about 14.7 Hg"],a:2,e:"With the engine running at full power, manifold pressure sits slightly below ambient pressure, which is what draws air into the engine."},
  {t:"Test 2",n:23,q:"The most likely cause of a rapidly fluctuating cylinder head temperature gauge would be",o:["detonation","preignition","high oil temperature","a faulty gauge"],a:3,e:"A large metal block such as an engine cannot change temperature rapidly, so a rapidly fluctuating reading points to a faulty gauge."},
  {t:"Test 2",n:24,q:"If the altimeter reading remains unchanged during a climb the most likely cause would be",o:["the pitot tube has become blocked","the static source has become blocked","the vacuum pump is unserviceable","the case of the altimeter is leaking"],a:1,e:"A blocked static port keeps the pressure in the instrument case constant, so the altimeter does not change during a climb."},
  {t:"Test 2",n:25,q:"The indication shown on the face of a turn co-ordinator when turning while taxiing on level ground is",o:["a skid away from the direction of turn","the ball remains in the centre while ever the wings are level","a slip in the direction of turn","a bank opposite the direction of turn"],a:0,e:"Any turn on level ground is unbalanced, and inertia pushes the ball away from the centre of the turn, which is a skid."},
  {t:"Test 2",n:26,q:"During a turn, the reading of a magnetic compass in the southern hemisphere will",o:["lag behind the aircraft when turning onto north","lead ahead of the aircraft when turning onto south","lead ahead of the aircraft when turning onto north","lag behind the aircraft when turning onto east or west"],a:2,e:"In the southern hemisphere the compass leads ahead of the aircraft when turning onto north and lags when turning onto south."},
  {t:"Test 2",n:27,q:"The engine operating conditions most likely to produce fouled spark plugs are",o:["high power and rich mixture","low power and rich mixture","high power and lean mixture","low power and lean mixture"],a:1,e:"Low power and rich mixture give low combustion temperatures, so oil fouls the plugs without burning off."},
  {t:"Test 2",n:28,q:"In an engine fitted with a carburettor and a constant speed propeller, the absence of carburettor ice may be confirmed by applying carburettor heat and noting an immediate",o:["decrease in manifold pressure with no further change","increase in manifold pressure with a gradual change","increase in manifold pressure with no further change","decrease in manifold pressure with a gradual change"],a:0,e:"Hot air is less dense than cool air, so manifold pressure drops immediately when carb heat is applied and stays there while hot air is selected."},
  {t:"Test 2",n:29,q:"Operating an engine with the oil level below the specified minimum is likely to cause",o:["excessive oil consumption","spark plug fouling","engine overheating","oil foaming"],a:2,e:"Oil carries heat away from the engine through the oil cooler, so a low oil quantity means less heat is removed and the engine overheats."},
  {t:"Test 2",n:30,q:"During flight a centre zero ammeter shows an abnormally high positive reading for an extended period of time. The correct interpretation of this is",o:["electrical instruments will overreact","the alternator has failed and the battery is powering the system","the battery is being overcharged and may boil","no particular meaning"],a:2,e:"A battery that will not accept charge keeps taking high current and heats up. If allowed to continue, it can be severely damaged."},
  {t:"Test 2",n:31,q:"The purpose of a turbocharger is to",o:["provide a constant rate of climb up to the critical altitude","increase the mass of air flow into the engine","increase the temperature and vaporisation of the fuel air mixture before induction","reduce the possibility of detonation"],a:1,e:"The compressor increases manifold pressure and therefore the mass of air flow, so more fuel can be burnt for more power."},
  {t:"Test 2",n:32,q:"What is the difference in appearance between aviation gasoline (avgas) and aviation turbine fuel (avtur)?",o:["avgas is blue or green while avtur is red","avgas is red while turbine fuel is green","avgas is clear while turbine fuel is blue or green","avgas is blue or green while turbine fuel is clear"],a:3,e:"Avgas is dyed blue or green to aid identification, while turbine fuel is clear."},
  {t:"Test 2",n:33,q:"Which instrument indication would suggest that the static vent has become blocked during a climb?",o:["the vertical speed indicator reads zero","all pressure instruments read zero","the altimeter reads zero","the airspeed indicator reads zero"],a:0,e:"A blocked static vent isolates the VSI from changes in ambient pressure, so it reads zero in a climb."},
  {t:"Test 2",n:34,q:"In a climb from level flight the altimeter reading remains unchanged. A likely cause would be a blockage in the",o:["pitot tube","vacuum pump","static vent"],a:2,e:"A blocked static vent stops the altimeter responding to changes in ambient pressure."},
  {t:"Test 2",n:35,q:"What effect does the application of carburettor heat have on mixture and power?",o:["mixture becomes leaner and power is unaffected","mixture becomes richer and power is reduced","mixture becomes leaner and power is reduced","mixture becomes richer and power is unaffected"],a:1,e:"Hot air is less dense, so manifold pressure and power drop, while the carburettor keeps supplying the same fuel. The mixture becomes richer."},
  {t:"Test 2",n:36,q:"If an engine fitted with a fixed waste gate has the throttle fully opened at take-off",o:["the rated boost would be exceeded","the engine would produce 100% of its rated power","the mixture would become too lean","the expected take-off performance would not be achieved"],a:0,e:"A fixed waste gate relies on the pilot monitoring boost. Full throttle at take-off produces too much boost."},

  // ---------- FINAL TEST 3 ----------
  {t:"Test 3",n:1,q:"The application of carburettor heat on an aircraft fitted with a CSU when ice is not present is accompanied by",o:["a drop in RPM followed by a slight increase in manifold pressure","a drop in manifold pressure followed by a slight rise in manifold pressure at constant RPM","a drop in manifold pressure with no further change and constant RPM","a drop in RPM with no further change"],a:2,e:"Hot air is less dense, so manifold pressure drops. The governor moves to a finer pitch to keep RPM constant. There is no ice to melt, so the change stays while hot air is inducted."},
  {t:"Test 3",n:2,q:"To prevent excessive cooling of an engine during a long descent at a fixed throttle setting it is necessary to",o:["decrease indicated air speed and accept a reduced rate of descent","increase indicated air speed and accept a reduced rate of descent","decrease indicated air speed and increase rate of descent","increase indicated air speed and increase rate of descent"],a:0,e:"Lower airflow over the air-cooled engine reduces cooling. A lower IAS at the same power also gives a lower rate of descent."},
  {t:"Test 3",n:3,q:"If oil temperature is rising to near the red line during a long climb a remedy would be",o:["decrease power and indicated air speed","increase power and indicated air speed","decrease power and increase indicated air speed","increase power and decrease indicated air speed"],a:2,e:"Less power means less heat is produced, and a higher IAS gives more airflow to cool the engine."},
  {t:"Test 3",n:4,q:"A high cylinder head temperature during cruise could be due to",o:["manifold pressure too low for the selected RPM","mixture set too rich","cowl flaps left open","detonation or pre-ignition"],a:3,e:"Detonation and pre-ignition both cause irregular combustion that concentrates heat in the cylinder head, raising CHT."},
  {t:"Test 3",n:5,q:"Spark plug fouling would be most likely during",o:["long periods of ground operation at low power","climbs at high power settings","cruising flight in cold weather","operation in conditions where carburettor ice is likely to form"],a:0,e:"Oil deposits on the plugs build up at low power, where there is not enough heat to burn them off."},
  {t:"Test 3",n:6,q:"The EGT setting that would produce the highest indicated air speed would be",o:["fully rich","peak exhaust gas temperature","best power setting","best economy setting"],a:2,e:"At best power the TAS is highest for a given manifold pressure and RPM, and at any cruising level a higher TAS means a higher IAS."},
  {t:"Test 3",n:7,q:"One consequence of operating an engine with excessively high oil temperature is",o:["spark plug fouling","inadequate lubrication of some engine parts","a very high oil pressure","sticking exhaust valves"],a:1,e:"Very hot oil thins out, so the protective film breaks down and metal contacts metal, causing wear and damage."},
  {t:"Test 3",n:8,q:"Fuel vaporisation is most likely to occur during",o:["long periods of ground operation","high engine temperatures and low ambient atmospheric pressure","a long power off descent","cruise with mixture leaned for best economy"],a:1,e:"High power and hot fuel both increase vaporisation, and low ambient pressure makes it worse."},
  {t:"Test 3",n:9,q:"The purpose of a waste gate in a turbo supercharger is to",o:["regulate the speed of the turbine","control the temperature of the exhaust gases","prevent excessive pressure build up in the turbine","control the fuel flow to the engine fuel pump"],a:0,e:"The waste gate lets part of the exhaust bypass the turbine, which controls turbine and compressor speed."},
  {t:"Test 3",n:10,q:"If a leak develops before the waste gate in an engine fitted with a turbo supercharger",o:["fuel consumption would increase","manifold pressure obtained at any given altitude and throttle position decreases","manifold pressure obtained at any given altitude and throttle position increases","less power is available due to increased exhaust back pressure"],a:1,e:"Less exhaust gas reaches the waste gate, so less gas drives the turbine, the compressor slows and manifold pressure falls."},
  {t:"Test 3",n:11,q:"The correct setting for the pitch control during engine run-up of an engine fitted with a CSU is",o:["fully coarse during the magneto check","fully fine during the magneto check","normal cruise position","set to hold 1700 RPM"],a:1,e:"In the fully fine position the propeller acts as fixed pitch, so RPM changes show engine power during the magneto check."},
  {t:"Test 3",n:12,q:"During a descent at high speed and high power the propeller blades of a constant speed propeller will move towards",o:["the fine pitch stops","the coarse pitch stops","the centre of the pitch range","the position of minimum drag"],a:1,e:"Gravity helps the aircraft accelerate, which tends to overspeed the propeller, so the governor moves the blades towards coarse pitch."},
  {t:"Test 3",n:13,q:"A consequence of a low oil level in an engine is",o:["oil temperature and oil pressure will rise","oil temperature and oil pressure will fall","oil temperature will fall and oil pressure will rise","oil temperature will rise and oil pressure will fall"],a:3,e:"Less oil means the remaining oil gets hotter, and hot oil is thinner, which lowers the oil pressure."},
  {t:"Test 3",n:14,q:"A device that controls high current flow in an electrical system is",o:["a voltage regulator","a circuit breaker","a condenser","a rectifier"],a:1,e:"Circuit breakers respond to high current flow, which is measured in amps."},
  {t:"Test 3",n:15,q:"If a centre zero ammeter shows a discharge during flight",o:["the system is operating normally","the battery is flat","the master switch is off","the alternator has failed"],a:3,e:"A discharge reading means the alternator is not charging the battery, so the alternator has failed."},
  {t:"Test 3",n:16,q:"If a fuel pressure gauge shows rapidly fluctuating readings during flight",o:["fuel vaporisation may be occurring","induction icing may be occurring","the fuel may be detonating within the cylinders","the engine driven fuel pump may have failed"],a:0,e:"Vapour in the fuel lines is compressible, so rapidly fluctuating fuel pressure readings point to vaporisation."},
  {t:"Test 3",n:17,q:"The colour of 100/130 octane avgas is",o:["red","blue","green","clear"],a:2,e:"100/130 octane avgas is green."},
  {t:"Test 3",n:18,q:"Comparing a fuel injection system to a carburettor, the fuel injection system is",o:["simpler and less expensive","operated at lower fuel pressure","less prone to induction system icing","less prone to fuel vaporisation"],a:2,e:"Fuel is injected into the inlet port, so there is no evaporative cooling at the throttle. Impact ice can still form in cloud or rain."},
  {t:"Test 3",n:19,q:"If the accumulator gas pressure in a hydraulic system becomes too low",o:["the system will fail","pressure indicated during operation will be lower but will return to normal after operation of the service","pressure indicated during operation will be higher but will return to normal after operation of the service","system pressure will be lower than normal at all times"],a:1,e:"Low gas pressure lowers the indicated pressure during operation, but it returns to normal once the service has finished."},
  {t:"Test 3",n:20,q:"A spongy feel in the pedals of a foot operated brake system would most likely be due to",o:["low hydraulic fluid","a leak in the system","wear in the brake mechanism","air in the system lines"],a:3,e:"A spongy pedal feel is the typical symptom of air in the brake lines."},
  {t:"Test 3",n:21,q:"The undercarriage warning horn in a retractable undercarriage system may be activated by",o:["a squat switch located on the aircraft's nose wheel","the position of the elevator trim","the airspeed indicator","the position of the throttle lever"],a:3,e:"The horn sounds when the throttle is in the low power position with the undercarriage still up. The switch can also be triggered by manifold pressure."},
  {t:"Test 3",n:22,q:"The pitot heat",o:["should not be operated on the ground except for testing","should be turned off whenever sub zero temperatures are encountered","should always be turned on in rain","should not be operated for long periods of time in flight"],a:0,e:"Pitot heat draws a high current and overheats on the ground, so it should only be used on the ground for testing."},
  {t:"Test 3",n:23,q:"Comparing the reading of a CHT gauge to that of an EGT gauge",o:["the CHT reacts more quickly to changes in combustion temperature","the EGT reacts more quickly to changes in combustion temperature","the CHT gives better indications of changes in mixture strength","the EGT displays a larger range of temperatures than the CHT"],a:1,e:"The EGT probe responds almost instantly to combustion temperature changes, while the CHT lags because the cylinder head is a large metal mass."},
  {t:"Test 3",n:24,q:"If an artificial horizon becomes toppled during flight",o:["it will remain unserviceable for the rest of the flight","it will remain serviceable but will take time to re-erect itself","it will require maintenance after landing","it must be manually adjusted before further use"],a:1,e:"The gyro is free to move in pitch and roll. Once toppled it takes time to stabilise, but it stays serviceable."},
  {t:"Test 3",n:25,q:"Which of the following speeds is not shown on a colour coded air speed indicator?",o:["VNE","VNO","VFE","VLE"],a:3,e:"Undercarriage extension speed (VLE) is shown as a placard next to the gear lever, not on the colour coded ASI."},
  {t:"Test 3",n:26,q:"If a visible bubble appears in the glass of a magnetic compass",o:["the compass is unserviceable","this is normal and does not imply any unserviceability","the aircraft may be parked on uneven ground","the compass is serviceable but may take longer to indicate a constant heading after a turn"],a:0,e:"The fluid in the compass bowl damps the needle. A bubble means the fluid is leaking out, so the compass is unserviceable."},
  {t:"Test 3",n:27,q:"During the normal advancement of the throttle on a turbocharged engine, the manifold pressure quickly becomes excessive. This could be caused by",o:["the waste gate being jammed open","the waste gate being jammed shut","an exhaust leak upstream of the waste gate","an exhaust leak downstream of the waste gate"],a:1,e:"If the waste gate is jammed shut, all exhaust gas drives the turbine and manifold pressure rises excessively."},
  {t:"Test 3",n:28,q:"The component which prevents an excessively high current flow in an aircraft's electrical system is a",o:["circuit breaker","capacitor","current rectifier","voltage regulator"],a:0,e:"A circuit breaker protects electrical equipment by breaking the circuit when current is too high."},
  {t:"Test 3",n:29,q:"A negative deflection of the centre zero ammeter means that",o:["the alternator is charging normally","the battery is faulty","the alternator is supplying current to the system","the battery is supplying current to the system"],a:3,e:"A negative deflection means the battery is discharging, supplying current to the system."},
  {t:"Test 3",n:30,q:"The manifold pressure gauge indication on a normally aspirated engine operating at full power should be",o:["slightly below the ambient atmospheric pressure","slightly above the ambient atmospheric pressure","significantly below the ambient atmospheric pressure","significantly above the ambient atmospheric pressure"],a:0,e:"A normally aspirated engine at full power shows manifold pressure just below ambient."},
  {t:"Test 3",n:31,q:"During a climb a high cylinder head temperature can be reduced by",o:["increasing the IAS","increasing the rate of climb","decreasing the IAS","decreasing the rate of climb"],a:0,e:"Higher IAS means more airflow over the air-cooled engine, which improves cooling."},
  {t:"Test 3",n:32,q:"When changing power on an engine fitted with a constant speed unit",o:["RPM should always be changed before manifold pressure","RPM should be changed before manifold pressure when power is increased and manifold pressure should be changed before RPM when power is decreased","RPM should be changed before manifold pressure when power is decreased and manifold pressure should be changed before RPM when power is increased","manifold pressure should always be changed before RPM"],a:1,e:"When increasing power, RPM goes up first to avoid overboosting. When decreasing power, manifold pressure comes down first."},
  {t:"Test 3",n:33,q:"The correct interpretation of a centre zero ammeter is",o:["a positive deflection indicates that the battery is supplying the current","a zero indication shows the alternator is faulty","a negative deflection indicates the alternator is charging the battery","a negative deflection indicates that the battery is supplying the current"],a:3,e:"A negative deflection means the battery is supplying current (discharging)."},
  {t:"Test 3",n:34,q:"For a given power setting which of the statements is true for mixture adjustment?",o:["changing mixture does not affect airspeed","the highest airspeed is obtained with best power setting","the highest airspeed is obtained with mixture fully rich","the highest airspeed is obtained with the mixture set to peak EGT"],a:1,e:"At a given power setting, best power gives the highest TAS and therefore the highest airspeed."},
  {t:"Test 3",n:35,q:"In a hydraulic system with an accumulator, a lower than normal gas pressure in the accumulator may result in",o:["less hydraulic fluid stored in the accumulator","a higher system operating pressure","increased friction and vibration in the system","reduced dampening of pressure surges within the system"],a:3,e:"The gas in the accumulator absorbs pressure surges. With lower gas pressure, it cannot absorb them as well."},
  {t:"Test 3",n:36,q:"With a constant throttle setting maintained, excessive cooling of an engine on descent may be prevented by",o:["increasing the rate of descent","opening the cowl flaps","maintaining the mixture setting for best power","reducing the IAS"],a:3,e:"Less airflow over the air-cooled engine reduces the cooling. Reducing the IAS does this."}
];
const QUESTIONS = [...CHAPTER_QS, ...FINAL_QS];

const DIAGRAMS = {
  1: `<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mixture control positions and power and EGT curves" font-family="system-ui, sans-serif" font-size="13">

    <line x1="60" y1="130" x2="60" y2="270" stroke-width="1.5"/>
    <line x1="60" y1="270" x2="540" y2="270" stroke-width="1.5"/>
    <line x1="210" y1="130" x2="210" y2="270" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="360" y1="130" x2="360" y2="270" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="510" y1="130" x2="510" y2="270" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="300" y="292" text-anchor="middle" style="stroke:none" font-size="12">Mixture leaned from full rich towards peak EGT</text>

  <path d="M60,235 Q150,140 210,135 Q340,130 540,250" fill="none" style="stroke:var(--accent)" stroke-width="3"/>
  <path d="M60,262 Q300,258 510,140 L540,160" fill="none" style="stroke:#f97316" stroke-width="3"/>
  <text x="250" y="130" style="fill:var(--accent);stroke:none" font-weight="600">Power</text>
  <text x="440" y="150" style="fill:#f97316;stroke:none" font-weight="600">EGT</text>
  <text x="210" y="155" text-anchor="middle" style="fill:var(--text);stroke:none" font-size="11">best power</text>
  <text x="510" y="128" text-anchor="middle" style="fill:var(--text);stroke:none" font-size="11">peak EGT</text>
</svg>`
};

const LET = ["a","b","c","d"];
let pool = [], idx = 0, score = 0, wrongList = [], answered = false, selected = null;
const starred = new Set();

const $ = id => document.getElementById(PFX + id);
const show = (id, on) => $(id).classList.toggle("hidden", !on);
const qkey = q => q.t + "|" + q.n;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function listFor(v) {
  if (v === "starred") return QUESTIONS.filter(q => starred.has(qkey(q)));
  if (v === "all") return [...QUESTIONS];
  if (v === "shuffled") return [...QUESTIONS];
  if (v === "chap") return QUESTIONS.filter(q => CHAPTER_QS.includes(q));
  if (v === "finals") return QUESTIONS.filter(q => q.t.startsWith("Test"));
  return QUESTIONS.filter(q => q.t === v);
}

function populateMenu() {
  const sel = $("testSel");
  [["all", "ALL questions (chapters + final tests)"], ["shuffled", "ALL QUESTIONS SHUFFLED"], ["chap", "All chapter topics"], ["Engines & Oil", "Engines & Oil"], ["Propellers & CSU", "Propellers & CSU"], ["Fuel & Carburettors", "Fuel & Carburettors"], ["Electrics, Ignition & Turbos", "Electrics, Ignition & Turbos"], ["Hydraulics, Instruments & Fire", "Hydraulics, Instruments & Fire"], ["finals", "ALL final tests (1, 2 and 3)"], ["Test 1", "Final Test 1"], ["Test 2", "Final Test 2"], ["Test 3", "Final Test 3"], ["starred", "Starred questions"]]
    .forEach(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); });
}

function startQuiz(source) {
  let list, shuffleIt;
  if (source) { list = source; shuffleIt = $("shuffleChk").checked; }
  else { list = listFor($("testSel").value); shuffleIt = $("shuffleChk").checked || $("testSel").value === "shuffled"; }
  if (!list.length) { alert("No questions in this set yet. Star some questions or pick another set."); return; }
  pool = (shuffleIt ? shuffle([...list]) : [...list]).map(shuffleOpts);
  idx = 0; score = 0; wrongList = []; sel = [];
  show("setup", false); show("results", false); show("quiz", true);
  renderQ();
}

function updateStar() {
  const on = starred.has(qkey(pool[idx]));
  $("starBtn").classList.toggle("on", on);
  $("starBtn").textContent = on ? "★" : "☆";
}

function toggleStar() {
  const k = qkey(pool[idx]);
  starred.has(k) ? starred.delete(k) : starred.add(k);
  updateStar();
}

function renderQ() {
  answered = false; selected = null;
  const q = pool[idx];
  updateStar();
  $("counter").textContent = `${q.t} · Q${q.n} · ${idx + 1} of ${pool.length}`;
  $("scoreLive").textContent = `Score: ${score}`;
  $("bar").style.width = (idx / pool.length * 100) + "%";
  $("qtext").textContent = q.q;
  const dg = $("qdiag");
  dg.innerHTML = q.d ? DIAGRAMS[q.d] : ""; show("qdiag", !!q.d && diagOn); setDiagBtn(!!q.d);
  const opts = $("opts");
  opts.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">[${LET[i]}]</span>${text}`;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  if (sel[idx] !== undefined) { selected = sel[idx]; review(); }
  setAction();
}

function choose(i) {
  if (answered) return;
  selected = i;
  ROOT.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("selected", k === i));
  setAction();
}

function submit() {
  if (answered || selected === null) return;
  answered = true;
  const i = selected, q = pool[idx];
  if (sel[idx] === undefined) sel[idx] = i;
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  const fb = $("feedback");
  if (i === q.a) {
    score++;
    fb.className = "feedback good";
    fb.textContent = "Correct!";
  } else {
    btns[i].classList.add("wrong");
    wrongList.push({ ...q, chosen: i });
    fb.className = "feedback bad";
    fb.textContent = `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  }
  $("scoreLive").textContent = `Score: ${score}`;
  const ex = document.createElement("div");
  ex.className = "expl";
  ex.innerHTML = "<strong>Explanation:</strong> " + q.e;
  if (q.e) fb.appendChild(ex);
  setAction();
}

function setDiagBtn(has) {
  let b = document.getElementById("agk-diagBtn");
  if (!b) {
    b = document.createElement("button");
    b.id = "agk-diagBtn"; b.className = "ghost"; b.style.marginBottom = "10px";
    $("qdiag").parentNode.insertBefore(b, $("qdiag"));
    b.onclick = () => { diagOn = !diagOn; show("qdiag", diagOn && !!pool[idx].d); setDiagBtn(!!pool[idx].d); };
  }
  b.style.display = has ? "" : "none";
  b.textContent = diagOn ? "Hide diagram" : "Show diagram";
}

function review() {
  answered = true;
  const i = selected, q = pool[idx];
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  if (i !== q.a) btns[i].classList.add("wrong");
  const fb = $("feedback");
  fb.className = i === q.a ? "feedback good" : "feedback bad";
  fb.textContent = i === q.a ? "Correct!" : `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  if (q.e) { const ex = document.createElement("div"); ex.className = "expl"; ex.innerHTML = "<strong>Explanation:</strong> " + q.e; fb.appendChild(ex); }
}

function prevQ() {
  if (idx > 0) { idx--; renderQ(); }
}

function nextQ() {
  if (idx < pool.length - 1) { idx++; renderQ(); }
  else showResults();
}

function showResults() {
  show("quiz", false); show("results", true);
  const pct = Math.round(score / pool.length * 100);
  $("finalScore").textContent = `${score} / ${pool.length} (${pct}%)`;
  $("finalMsg").textContent = pct >= 80 ? "Great work. Review the misses below." :
                              pct >= 50 ? "Solid start. Retry the missed questions to lock them in." :
                              "Keep going. Work through the misses, then retry them.";
  const ol = $("missedList");
  ol.innerHTML = "";
  if (!wrongList.length) {
    ol.innerHTML = "<li>No misses. Nice.</li>";
    $("retryBtn").disabled = true;
  } else {
    $("retryBtn").disabled = false;
    wrongList.forEach(q => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${q.t} Q${q.n}:</strong> ${q.q}<br>
        <span style="color:var(--bad)">Your answer: [${LET[q.chosen]}] ${q.o[q.chosen]}</span><br>
        <span style="color:var(--good)">Correct: [${LET[q.a]}] ${q.o[q.a]}</span><br>
        <span style="color:var(--muted)">${q.e}</span>`;
      ol.appendChild(li);
    });
  }
}

function setAction() {
  const btn = $("actionBtn");
  if ($("prevBtn")) $("prevBtn").disabled = idx === 0;
  if (answered) {
    btn.textContent = idx === pool.length - 1 ? "See results" : "Next";
    btn.disabled = false;
  } else {
    btn.textContent = "Submit";
    btn.disabled = selected === null;
  }
}

$("startBtn").onclick = () => startQuiz();
$("actionBtn").onclick = () => (answered ? nextQ() : submit());
if ($("prevBtn")) $("prevBtn").onclick = prevQ;
$("quitBtn").onclick = () => { if (confirm("Quit this quiz and see your results so far?")) showResults(); };
$("retryBtn").onclick = () => startQuiz(wrongList.map(({ chosen, ...q }) => q));
$("restartBtn").onclick = () => { show("results", false); show("quiz", false); show("setup", true); };
$("starBtn").onclick = toggleStar;
$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.addEventListener("keydown", e => {
  if (ROOT.classList.contains("hidden")) return;
  if ($("quiz").classList.contains("hidden")) return;
  if (!answered && /^[a-dA-D]$/.test(e.key)) choose(LET.indexOf(e.key.toLowerCase()));
  else if (e.key === "Enter" && !$("actionBtn").disabled) $("actionBtn").click();
});

populateMenu();

  const cnt = document.getElementById("count-agk");
  if (cnt) cnt.textContent = QUESTIONS.length + " questions";
})();



</script>
