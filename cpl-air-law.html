function shuffleOpts(q) {
  // Shuffle the A-D options (and the correct answer with them). Questions whose options refer to other options stay as written.
  const refers = q.o.some(x => /\b(all|none|both|neither)\b|\[[a-e]\]|\b[a-e]\)|\bas above\b|\babove\b/i.test(x));
  if (refers || q.o.length < 2) return q;
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

total distance for the flight is 45 nautical miles but the aircraft will be beyond gliding distance from land over part of the route. Which statement is correct regarding the planning requirements for this flight?", "o": ["a weather forecast is not required providing the pilot studies all available weather information prior to the flight", "a weather forecast is not required", "a weather forecast is required", "a weather forecast is not required if the maximum takeoff weight of the aircraft is less than 2000kg"], "a": 2}, {"t": "Practice Exam 1", "n": 22, "q": "Without specific CASA approval, which of the following documents need not be carried on a VFR flight from Townsville to Hamilton Island?", "o": ["flight manual", "maintenance release", "certificate of registration", "pilot licence and medical certificate"], "a": 2}, {"t": "Practice Exam 1", "n": 23, "q": "One method of using an altimeter to determine the local QNH at an aerodrome is to set", "o": ["the aerodrome elevation and read the subscale", "zero feet and read the subscale", "1013.2mb and apply a pressure and temperature correction", "1013.2mb and apply a temperature correction"], "a": 0}, {"t": "Practice Exam 1", "n": 24, "q": "An air transport flight of 40 miles over water in a single-engine aircraft with a normal cruise speed of 100kt requires the carriage of", "o": ["a first aid kit", "a liferaft", "one lifejacket per occupant", "pyrotechnic distress signals"], "a": 2}, {"t": "Practice Exam 1", "n": 25, "q": "You are approaching the circuit at a non-towered aerodrome. Your inbound track will require you to make a right-hand turn should you wish to enter the downwind leg of the circuit for the intended landing. Assuming that CASA has made no special direction in relation to the direction of turns at this aerodrome, which of the following requirements applies to your circuit joining procedure?", "o": ["you must overfly the aerodrome to avoid making a right-hand turn", "you should join at the base leg position to avoid making a right turn", "you should turn right to join downwind leg providing you join prior to passing the upwind runway end", "you should track at 45 degrees to the downwind leg and join at the midfield position"], "a": 3}, {"t": "Practice Exam 1", "n": 26, "q": "An aircraft without an underwing refuelling capability is to be refuelled. Under which of the following conditions are non-ambulatory passengers permitted to remain on board?", "o": ["when the aircraft is being refuelled with fuel other than avgas", "when the aircraft is being refuelled with aviation turbine fuel that contains an antistatic additive", "when refuelling with any type of fuel", "when passengers are informed that refuelling is to take place, a cabin attendant or responsible person is on board, the aircraft and fuelling equipment are connected to an earth point and other procedures as specified in the company operations manual are observed"], "a": 1}, {"t": "Practice Exam 1", "n": 27, "q": "A horizontal white dumbbell adjacent to the primary windsock means", "o": ["gliding operations are in progress", "all runways are serviceable", "only hard surface runways, taxiways and aprons are to be used", "only the main runway is to be used"], "a": 2}, {"t": "Practice Exam 1", "n": 28, "q": "Your final approach to land to the only into wind runway at an aerodrome passes over a sports ground at which a large crowd is in attendance. What should be your action in regard to your intended landing?", "o": ["you should alter your final approach path to avoid the sports ground", "you should discontinue the approach and land on another runway", "you should maintain at least 500ft AGL until you have passed over the sports ground", "you may continue the approach and land"], "a": 3}, {"t": "Practice Exam 1", "n": 29, "q": "In addition to your pilot's licence and medical certificate, which documents must be carried on board an Australian registered aircraft for a solo flight in the local training area?", "o": ["the aircraft's certificates of registration and airworthiness", "the aircraft's maintenance release and flight manual", "the aircraft's maintenance release and certificate of airworthiness", "the aircraft's certificate of airworthiness and flight manual"], "a": 1}, {"t": "Practice Exam 1", "n": 30, "q": "You are planning to transit a CTAF on a VFR flight below a cloud base of 1000ft AGL. Which of the following conditions apply to this flight?", "o": ["you must request and obtain a special VFR clearance", "flight visibility must be at least 8km", "you must maintain 500ft vertical clearance from cloud", "you must use VHF radio communication on the CTAF"], "a": 3}, {"t": "Practice Exam 1", "n": 31, "q": "One requirement when flying in a lane of entry is that the aircraft shall", "o": ["keep to the left", "maintain an IAS not exceeding 150kt", "request a clearance before entering", "keep to the right"], "a": 3}, {"t": "Practice Exam 1", "n": 32, "q": "Which rule applies to the carriage of cargo in an aircraft?", "o": ["cargo shall never obstruct an emergency exit", "cargo in excess of 4kg shall be loaded in the baggage compartment", "all cargo shall be properly restrained", "seats shall be removed prior to loading cargo in a passenger compartment"], "a": 2}, {"t": "Practice Exam 1", "n": 33, "q": "An aircraft is conducting a straight in approach at a non-towered aerodrome and is established on final approach at 5nm. Another aircraft broadcasts its position as on base leg for the same runway. The potential conflict should be resolved by", "o": ["the aircraft on base leg orbiting to follow the aircraft on straight in approach", "the aircraft on base leg carrying out a missed approach to allow the aircraft on straight in approach right-of-way", "the aircraft on straight in approach executing a missed approach to join the normal circuit pattern", "the aircraft on straight in approach giving priority to the aircraft on base leg"], "a": 3}, {"t": "Practice Exam 1", "n": 34, "q": "Seat belts shall be worn at all times during flight by", "o": ["any person occupying a control seat", "the pilot of a single pilot operation", "the pilot and any passengers below the age of 13", "the pilot and any children sharing a passenger seat"], "a": 1}, {"t": "Practice Exam 1", "n": 35, "q": "The AIP recommends that turns onto final approach at a non-towered aerodrome should", "o": ["permit a straight in approach of at least 500m from the landing runway threshold", "not be commenced below 500ft AGL", "be completed by 500ft AGL", "permit a straight in approach of at least 1000m from the perimeter of the aerodrome"], "a": 2}, {"t": "Practice Exam 1", "n": 36, "q": "If not permanently installed in an aircraft, it is recommended that a survival beacon be used with the aerial aligned", "o": ["along the magnetic meridian", "vertically", "at right angles to the isogonals", "horizontally"], "a": 1}, {"t": "Practice Exam 1", "n": 37, "q": "In a civil control zone a pilot may deviate from the terms of an airways clearance without prior approval if", "o": ["operating on no notification below 5000ft and intending to leave controlled airspace", "the clearance is operationally inconvenient", "the clearance is operationally unacceptable", "VMC cannot be maintained and the radio transmitter has failed"], "a": 3}, {"t": "Practice Exam 1", "n": 38, "q": "In the course of normal operations, the lowest height for flight over a city, town or populous area is", "o": ["1500ft AMSL", "500ft AGL", "1000ft AGL", "1500ft AGL"], "a": 2}, {"t": "Practice Exam 1", "n": 39, "q": "A white cross surrounded by white cone markers each with a red band indicates", "o": ["the aerodrome is totally unserviceable", "there is a partial unserviceability in the area surrounded by the cones", "taxi in the area surrounded by the cones with caution", "the areas surrounded by cones must not be used by aircraft above 5700kg"], "a": 1}, {"t": "Practice Exam 1", "n": 40, "q": "For a VFR passenger carrying air transport flight over water in a single-engine aircraft, the distance between land areas suitable for an emergency landing shall be no greater than", "o": ["30 minutes at normal cruise true airspeed", "25nm", "50nm", "no restriction applies for VFR overwater flight"], "a": 2}, {"t": "Practice Exam 2", "n": 1, "q": "Which statement regarding operations in a danger area OCTA is correct?", "o": ["approval for flights within danger areas OCTA is not required", "all radio equipped aircraft shall report or broadcast aircraft type, position, level and intentions by 10 miles from the lateral boundary", "an airways clearance must be obtained at least 10 minutes before reaching the point of intended entry", "flight is not permitted in any circumstances due to the dangerous operation conditions"], "a": 0}, {"t": "Practice Exam 2", "n": 2, "q": "The pilot of an aircraft receives the following airways clearance: 'Alpha Bravo Charlie track direct Bundy, clearance limit Coolum high-rise, maintain 3500'. The correct response from the pilot is", "o": ["cleared for Bundy, 3500, Alpha Bravo Charlie", "3500, Alpha Bravo Charlie", "track direct Bundy, clearance limit Coolum high-rise, 3500", "track direct Bundy, clearance limit Coolum high-rise, 3500, Alpha Bravo Charlie"], "a": 3}, {"t": "Practice Exam 2", "n": 3, "q": "At a noncontrolled aerodrome, you should not continue a landing approach beyond the runway threshold until a preceding light aircraft using the same runway has", "o": ["landed and is at least 1000m from the landing threshold", "landed and has vacated the runway irrespective of runway length", "taken off and is at least 500ft AGL", "taken off and is at least 600m ahead of you"], "a": 1}, {"t": "Practice Exam 2", "n": 4, "q": "To maintain VMC when flying OCTA at 4500ft AMSL, the minimum horizontal separation from cloud is", "o": ["1500m", "600ft", "600m", "1500ft"], "a": 0}, {"t": "Practice Exam 2", "n": 5, "q": "The overwater segment of a flight in a single-engine aircraft is just beyond gliding distance from land. Which of the following items must be carried on board the aircraft?", "o": ["a survival beacon", "a liferaft capable of accommodating all occupants", "a life jacket for each occupant", "a supply of pyrotechnic distress signals"], "a": 2}, {"t": "Practice Exam 2", "n": 6, "q": "Responsibilities of an ATS unit towards a SARTIME aircraft operating VFR would include the:", "o": ["receipt of position reports", "provision of traffic information", "provision of traffic separation", "receipt of SARTIME cancellation"], "a": 3}, {"t": "Practice Exam 2", "n": 7, "q": "A red flashing light directed at an aircraft in the air indicates", "o": ["land at your own risk", "give way to other aircraft but continue your approach", "the runway you are using is downwind - use another runway", "the aerodrome is unsafe - do not land"], "a": 3}, {"t": "Practice Exam 2", "n": 8, "q": "To maintain VMC when flying OCTA at 2500ft AMSL the minimum vertical separation from cloud is", "o": ["clear of cloud", "a thousand feet above and below cloud", "500ft above and below cloud", "500ft above cloud and 1000ft below cloud"], "a": 0}, {"t": "Practice Exam 2", "n": 9, "q": "To maintain VMC when flying in CTA at 2500ft AMSL the minimum flight visibility is", "o": ["3000m", "1500m", "8 km", "5000m"], "a": 3}, {"t": "Practice Exam 2", "n": 10, "q": "When may a pilot elect to fly at a height lower than 500ft above the highest obstacle or terrain?", "o": ["at any time when flying within a training area", "due to stress of weather", "if uncertain of position", "when flying along a coastline"], "a": 1}, {"t": "Practice Exam 2", "n": 11, "q": "When flying at 4000ft, safety harnesses or seat belts shall be worn at all times by", "o": ["all persons on board the aircraft", "at least one pilot crew member", "children sharing a seat", "all flight crewmembers"], "a": 1}, {"t": "Practice Exam 2", "n": 12, "q": "The AIP recommends that turns onto the final ashing light directed at an aircraft on the ground indicates that the aircraft should:", "o": ["taxi clear of the landing area", "change radio frequency and attempt to establish contact - do not take-off", "return to the parking area along a taxi-way", "stop and hold position"], "a": 0}, {"t": "Practice Exam 2", "n": 18, "q": "Which rule applies to occupancy of a control (co-pilot's) seat by a passenger of a dual controlled aircraft?", "o": ["carriage of a passenger in a control seat is prohibited", "a passenger may not occupy a control seat unless the control column is removable", "a passenger may occupy a control seat if he is briefed not to touch the controls and there is satisfactory communication at all times between the pilot and the passenger", "a passenger may occupy a control seat if he wears a seat belt at all times and there is satisfactory communication between the pilot and passenger"], "a": 2}, {"t": "Practice Exam 2", "n": 19, "q": "While cruising at A065 OCTA you notice that another aircraft is converging on you from the left at the same level. Which of the following actions should you take?", "o": ["immediately take up a new direction to avoid collision", "make radio contact with the other aircraft and advise your position", "descend to keep clear of the other aircraft", "maintain your heading but prepare to take avoiding action"], "a": 3}, {"t": "Practice Exam 2", "n": 20, "q": "You have been cleared by ATC to fly in CTA at 10000ft AMSL. What is the minimum flight visibility required to maintain VMC?", "o": ["3000m", "5000m", "8 km", "10 km"], "a": 2}, {"t": "Practice Exam 2", "n": 21, "q": "Under which (if any) of the following conditions is flight over a city, town or populous area at a height of less than 1000ft AGL permissible?", "o": ["flight at less than 1000ft AGL is not permissible", "if the aircraft is engaged in flight training", "if the aircraft is proceeding to or from an aerodrome and it is not possible to avoid overflying the area", " vember", "16th November", "15th November", "14th November"], "a": 0}, {"t": "Practice Exam 2", "n": 28, "q": "Under normal circumstances, which procedure applies to changes of levels when operating in controlled airspace?", "o": ["changes in level may be made in accordance with levels indicated in an approved flight plan", "level changes must be authorised and should commence within one minute of receiving instructions", "any change in level must be in accordance with the table of cruising levels for operations in CTA", "ATC must be advised of changes in level at least 2 minutes prior to climb or descent"], "a": 1}, {"t": "Practice Exam 2", "n": 29, "q": "You have been directed by ATC to fly in CTA at 10000ft AMSL. What is the minimum horizontal separation from cloud required to maintain VMC?", "o": ["clear of cloud", "2000m", "5000m", "1500m"], "a": 3}, {"t": "Practice Exam 2", "n": 30, "q": "Your VFR flight is operating in a Class D CTR on a special VFR clearance. Which of the following conditions applies to this operation?", "o": ["you must maintain 1500m horizontal clearance from cloud", "you must maintain 5000m horizontal clearance from cloud", "flight visibility must be not less than 3000m", "you must be able to conduct the flight clear of cloud with 1600m visibility"], "a": 3}, {"t": "Practice Exam 2", "n": 31, "q": "A requirement for all dropping operations is that", "o": ["a dispatcher must be provided with a seat", "there is no risk of articles falling outside of the drop site", "continuous sight of ground or water is maintained", "all persons on board remain seated"], "a": 2}, {"t": "Practice Exam 2", "n": 32, "q": "During refuelling operations, the aircraft fuel tank filling points must be separated from other stationery aircraft by at least", "o": ["15m", "3m", "9m", "6m"], "a": 3}, {"t": "Practice Exam 2", "n": 33, "q": "Rules applying to the carriage of passengers define a child as a person who is", "o": ["below 18 years of age", "above 3 and below 15 const LET = ["a","b","c","d","e"];
let pool = [], idx = 0, score = 0, wrongList = [], answered = false, selected = null;
const starred = new Set();

const $ = id => document.getElementById(PFX + id);
const show = (id, on) => $(id).classList.toggle("hidden", !on);
const qkey = q => q.t + "|" + q.n;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function listFor(v) {
  if (v === "starred") return QUESTIONS.filter(q => starred.has(qkey(q)));
  if (v === "all") return [...QUESTIONS];
  if (v === "shuffled") return [...QUESTIONS];
  if (v === "finals") return QUESTIONS.filter(q => ["Practice Exam 1","Practice Exam 2","Fatigue Management"].includes(q.t));
  return QUESTIONS.filter(q => q.t === v);
}

function populateMenu() {
  const sel = $("testSel");
  [["all", "All air law questions"], ["finals", "FINALS (Practice Exams 1 & 2 + Flight Duty Periods)"], ["shuffled", "ALL QUESTIONS SHUFFLED"], ["Fatigue Management", "Fatigue Management"], ["Practice Set 1", "Practice Set 1"], ["Practice Set 2", "Practice Set 2"], ["Practice Exam 1", "Practice Exam 1"], ["Practice Exam 2", "Practice Exam 2"], ["Met Quiz", "Met Quiz (flight planning)"], ["Nav & Comms Set 1", "Navigation & Communications Set 1"], ["Nav & Comms Set 2", "Navigation & Communications Set 2"], ["Chapter 4 Rules of the Air", "Chapter 4 Rules of the Air"], ["starred", "Starred questions"]]
    .forEach(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); });
}

function startQuiz(source) {
  let list, shuffleIt;
  if (source) { list = source; shuffleIt = $("shuffleChk").checked; }
  else { list = listFor($("testSel").value); shuffleIt = $("shuffleChk").checked || $("testSel").value === "shuffled"; }
  if (!list.length) { alert("No questions in this set yet. Star some questions or pick another set."); return; }
  pool = (shuffleIt ? shuffle([...list]) : [...list]).map(shuffleOpts);
  idx = 0; score = 0; wrongList = []; sel = [];
  show("setup", false); show("results", false); show("quiz", true);
  renderQ();
}

function updateStar() {
  const on = starred.has(qkey(pool[idx]));
  $("starBtn").classList.toggle("on", on);
  $("starBtn").textContent = on ? "★" : "☆";
}

function toggleStar() {
  const k = qkey(pool[idx]);
  starred.has(k) ? starred.delete(k) : starred.add(k);
  updateStar();
}

function renderQ() {
  answered = false; selected = null;
  const q = pool[idx];
  updateStar();
  $("counter").textContent = `${q.t} · Q${q.n} · ${idx + 1} of ${pool.length}`;
  $("scoreLive").textContent = `Score: ${score}`;
  $("bar").style.width = (idx / pool.length * 100) + "%";
  $("qtext").textContent = q.q;
  const dg = $("qdiag");
  if (q.img) { dg.innerHTML = '<img src="' + q.img + '" alt="Question figure" style="width:100%;height:auto;border-radius:8px;background:#fff">'; show("qdiag", true); } else { dg.innerHTML = ""; show("qdiag", false); }
  const opts = $("opts");
  opts.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">[${LET[i]}]</span>${text}`;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  if (sel[idx] !== undefined) { selected = sel[idx]; review(); }
  setAction();
}

function choose(i) {
  if (answered) return;
  selected = i;
  ROOT.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("selected", k === i));
  setAction();
}

function submit() {
  if (answered || selected === null) return;
  answered = true;
  const i = selected, q = pool[idx];
  if (sel[idx] === undefined) sel[idx] = i;
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  const fb = $("feedback");
  if (i === q.a) {
    score++;
    fb.className = "feedback good";
    fb.textContent = "Correct!";
  } else {
    btns[i].classList.add("wrong");
    wrongList.push({ ...q, chosen: i });
    fb.className = "feedback bad";
    fb.textContent = `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  }
  $("scoreLive").textContent = `Score: ${score}`;
  const ex = document.createElement("div");
  ex.className = "expl";
  ex.innerHTML = "<strong>Explanation:</strong> " + q.e;
  if (q.e) fb.appendChild(ex);
  if (q.work) { const wk = document.createElement("div"); wk.style.marginTop = "12px"; wk.innerHTML = '<div style="font-weight:600;margin-bottom:6px">Full working</div><img src="' + q.work + '" alt="Working" style="width:100%;height:auto;border-radius:8px;background:#fff">'; fb.appendChild(wk); }
  setAction();
}

function review() {
  answered = true;
  const i = selected, q = pool[idx];
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  if (i !== q.a) btns[i].classList.add("wrong");
  const fb = $("feedback");
  fb.className = i === q.a ? "feedback good" : "feedback bad";
  fb.textContent = i === q.a ? "Correct!" : `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  if (q.e) { const ex = document.createElement("div"); ex.className = "expl"; ex.innerHTML = "<strong>Explanation:</strong> " + q.e; fb.appendChild(ex); }
}

function prevQ() {
  if (idx > 0) { idx--; renderQ(); }
}

function nextQ() {
  if (idx < pool.length - 1) { idx++; renderQ(); }
  else showResults();
}

function showResults() {
  show("quiz", false); show("results", true);
  const pct = Math.round(score / pool.length * 100);
  $("finalScore").textContent = `${score} / ${pool.length} (${pct}%)`;
  $("finalMsg").textContent = pct >= 80 ? "Great work. Review the misses below." :
                              pct >= 50 ? "Solid start. Retry the missed questions to lock them in." :
                              "Keep going. Work through the misses, then retry them.";
  const ol = $("missedList");
  ol.innerHTML = "";
  if (!wrongList.length) {
    ol.innerHTML = "<li>No misses. Nice.</li>";
    $("retryBtn").disabled = true;
  } else {
    $("retryBtn").disabled = false;
    wrongList.forEach(q => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${q.t} Q${q.n}:</strong> ${q.q}<br>
        <span style="color:var(--bad)">Your answer: [${LET[q.chosen]}] ${q.o[q.chosen]}</span><br>
        <span style="color:var(--good)">Correct: [${LET[q.a]}] ${q.o[q.a]}</span><br>
        <span style="color:var(--muted)">${q.e}</span>`;
      ol.appendChild(li);
    });
  }
}

function setAction() {
  const btn = $("actionBtn");
  if ($("prevBtn")) $("prevBtn").disabled = idx === 0;
  if (answered) {
    btn.textContent = idx === pool.length - 1 ? "See results" : "Next";
    btn.disabled = false;
  } else {
    btn.textContent = "Submit";
    btn.disabled = selected === null;
  }
}

$("startBtn").onclick = () => startQuiz();
$("actionBtn").onclick = () => (answered ? nextQ() : submit());
if ($("prevBtn")) $("prevBtn").onclick = prevQ;
$("quitBtn").onclick = () => { if (confirm("Quit this quiz and see your results so far?")) showResults(); };
$("retryBtn").onclick = () => startQuiz(wrongList.map(({ chosen, ...q }) => q));
$("restartBtn").onclick = () => { show("results", false); show("quiz", false); show("setup", true); };
$("starBtn").onclick = toggleStar;
$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.addEventListener("keydown", e => {
  if (ROOT.classList.contains("hidden")) return;
  if ($("quiz").classList.contains("hidden")) return;
  if (!answered && /^[a-eA-E]$/.test(e.key)) choose(LET.indexOf(e.key.toLowerCase()));
  else if (e.key === "Enter" && !$("actionBtn").disabled) $("actionBtn").click();
});

populateMenu();

  const cnt = document.getElementById("count-law");
  if (cnt) cnt.textContent = QUESTIONS.length + " questions";
})();





</script>
