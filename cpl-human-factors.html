CEEzwVEcoQgHclIcFCEEe6Q5QhA+yEIQf/2Q=="}, {"t": "Exercise 9", "n": 20, "q": "Which of the following is not an emotional indicator of stress?", "o": ["apathy and depression", "constant feeling of weariness", "high pulse rate", "changes of mood and shortness of temper"], "a": 2}, {"t": "Exercise 9", "n": 21, "q": "With reference to transmeridian dysynchronism (Jet lag), the worst condition for biorhythm readjustment is", "o": ["flying east (with the body system phases needing to advance)", "flying west (with the body system phases needing to retard)", "flying east (with the body system phases needing to retard)", "flying west (with the body system phases needing to advance)"], "a": 0}, {"t": "Exercise 9", "n": 22, "q": "Human error as a cause of aircraft accidents has become a major focus of safety programs for many airlines. Concerning the link between human error and aircraft safety", "o": ["human error can be eliminated through thorough training", "human error can be eliminated through standard operating procedures (SOP's)", "human error can be eliminated through short duty periods which prevent boredom", "human error can never be eliminated"], "a": 3}, {"t": "Exercise 9", "n": 23, "q": "In human decision making, the term 'Risky Shift' describes the tendency for", "o": ["an individual to be more likely to be prepared to knowingly breach a regulation than a group", "a group to be more likely to be prepared to knowingly breach a regulation than an individual", "a group to be less likely to be prepared to knowingly breach a regulation than an individual", "both groups and individuals to be prepared to knowingly breach a regulation as experience levels rise"], "a": 1}, {"t": "Exercise 9", "n": 24, "q": "A pilot on final approach may say 'gear down' during the pre-landing checks without actually performing the action of lowering the gear. In this case the error is referred to as", "o": ["random", "sporadic", "environmental capture", "systematic"], "a": 2}, {"t": "Exercise 9", "n": 25, "q": "Brief periods of sleep between rest periods, or naps, have been shown to be beneficial in restoring sleep credit and overcoming the effects of jet lag. Studies have shown that in order for a nap to be considered beneficial, the duration needs to be at least", "o": ["10-15 minutes", "25-35 minutes", "45 minutes", "60 minutes"], "a": 0}, {"t": "Exercise 9", "n": 26, "q": "A stress management method which is defined as a cognitive method is", "o": ["alcohol", "rationalisation", "changing jobs", "exercise"], "a": 1}, {"t": "Exercise 9", "n": 27, "q": "When in cruise in an aeroplane with an autopilot engaged, the role of the pilot is primarily one of monitoring systems. The typical length of time for which a pilot will maintain vigilance before boredom reduces performance significantly is", "o": ["10 minutes", "30 minutes", "50 minutes", "90 minutes"], "a": 1}, {"t": "Exercise 9", "n": 28, "q": "Chronic fatigue in an individual is characterised by", "o": ["loss of appetite, insomnia, tenseness and depression", "physical exhaustion alone", "irritability, insomnia but not loss of appetite", "feelings of elation, and increased reliance on caffeine and alcohol"], "a": 0}, {"t": "Exercise 9", "n": 29, "q": "A person who undergoes counselling for stress is using a coping strategy which may be described as", "o": ["cognitive", "reactive", "active", "passive"], "a": 0}, {"t": "Exercise 9", "n": 30, "q": "Conducting an instrument approach in IMC you have a mental picture of what 'you expect to see when you break out of cloud and what you see is different to your mental picture of the approach. In this situation", "o": ["essential details will tend to be overlooked", "it will take time for you to orient yourself", "you will experience strong vertigo", "you will immediately discount the contribution of the mental model"], "a": 0}, {"t": "Exercise 9", "n": 31, "q": "The error-cause-removal approach to reducing the occurrence of human error aims to", "o": ["achieve zero error rate", "reduce errors through high levels of motivation", "encourage pilots to identify potential sources of error to prevent problems in the future", "develop safeguard backups to manage error so that when it occurs, other procedures will check the result to identify any problem"], "a": 2}, {"t": "Exercise 9", "n": 32, "q": "Chronic fatigue is most likely to be initially caused by", "o": ["continued pressure from upper management", "a long period of poor health", "problems at home", "difficult rosters"], "a": 1}, {"t": "Exercise 9", "n": 33, "q": "Concerning the management of human error in relation to enhancement of safety in aviation", "o": ["the only way to achieve safety is through elimination of human error", "the most significant way of controlling human error is by continuously and enthusiastically publicising safety practices", "repetition or overlearning has a significant influence on error reduction while motivation does not", "human error can never be eliminated and to conceal errors is to encourage their repetition"], "a": 3}, {"t": "Exercise 9", "n": 34, "q": "The most beneficial stress management strategy is a threefold approach involving modification or use of", "o": ["attitudes, diet and fitness", "diet, medication and behaviour", "behaviour, attitudes and fitness", "relaxation techniques, medication and exercise"], "a": 2}, {"t": "Exercise 9", "n": 35, "q": "The function of the Eustachian tube in the human body is to", "o": ["detect angular acceleration", "detect motion", "transmit nerve impulses", "equalise air pressure each side of the eardrum"], "a": 3}, {"t": "Exercise 9", "n": 36, "q": "A false hypothesis would be unlikely to be made", "o": ["when expectancy is high", "after a period of intense concentration", "after a series of false alarms", "when preoccupied with another task"], "a": 2}, {"t": "Exercise 9", "n": 37, "q": "Chronic fatigue differs from acute fatigue in that", "o": ["stress is not a factor in acute fatigue, only in chronic fatigue", "chronic fatigue can be overcome by a good night's sleep in most cases", "chronic fatigue is unlikely to develop unless the pilot experiences jet lag", "chronic fatigue can build up insidiously over time but be triggered or worsened by other factors"], "a": 3}, {"t": "Exercise 9", "n": 38, "q": "The highest life change unit score on the Holmes-Rahe scale is associated with", "o": ["marital separation", "marriage", "change in sleeping habits", "death of a close family member"], "a": 3}, {"t": "Exercise 9", "n": 39, "q": "Escapism as stress management mechanism may involve the use of drugs or a physical escape from an intolerable work situation to a new job. Escaping", "o": ["should never be used as a solution", "may sometimes be the only viable option", "is the first option for stress management", "will never solve a persons problems"], "a": 1}, {"t": "Exercise 9", "n": 40, "q": "The circadian rhythm of body temperature, which influences the natural sleep-wake cycle", "o": ["is consistent at exactly 24 hours", "is consistent in isolation at 25 hours, hence the sleep period would begin about an hour later each day", "varies widely between individuals", "is generally about 12 hours in duration"], "a": 1}, {"t": "Exercise 9", "n": 41, "q": "When conducting a procedural approach, a pilot uses a pattern of behaviour which is", "o": ["motor programme based", "rule based", "knowledge based", "skill based"], "a": 1}, {"t": "Exercise 9", "n": 42, "q": "Paradoxical sleep is a term used to describe", "o": ["ROM sleep", "RAM sleep", "stage 2 sleep", "REM sleep"], "a": 3}, {"t": "Exercise 9", "n": 43, "q": "Approximately half of normal sleep is made up of", "o": ["ROM sleep", "RAM sleep", "stage 2 sleep"], "a": 2}, {"t": "Exercise 9", "n": 44, "q": "Events are perceived as stressful when they result in", "o": ["positive or negative life changes", "positive life changes only", "negative life changes only", "headaches and nausea"], "a": 0}, {"t": "Exercise 9", "n": 45, "q": "The minimum required length of a nap to be considered restorative is", "o": ["10 minutes", "20 minutes", "40 minutes", "1 hour"], "a": 0}, {"t": "Exercise 9", "n": 46, "q": "The steps involved in the PILOT model of decision making is", "o": ["pray, initiate action, look for solutions, oversee progress, take stock", "postulate, investigate, litigate, operate, terminate", "probe the facts, identify the problem, look for solutions, operate, take stock", "postpone action, investigate the solution, listen to others, operate, tell someone"], "a": 2}, {"t": "Exercise 10", "n": 1, "q": "Which of the following techniques would contribute most to good team problem solving performance?", "o": ["stand steadfastly by your own aims and opinions and don't be swayed by others", "trust your personal feelings about an issue rather than logic", "always take a vote on final decisions to ensure that everyone on the team is happy", "team members contribute but the team leader makes the final decision"], "a": 3}, {"t": "Exercise 10", "n": 2, "q": "Good leadership in a group is characterised by", "o": ["high personal attention and medium task orientation", "medium personal attention and medium task orientation", "high personal attention and high task orientation", "medium personal attention and high task orientation"], "a": 2}, {"t": "Exercise 10", "n": 3, "q": "Which of the following represents the best order of priorities for tasks during flight", "o": ["aviate, communicate, navigate", "communicate, navigate, aviate", "navigate, aviate, communicate", "aviate, navigate, communicate"], "a": 3}, {"t": "Exercise 10", "n": 4, "q": "An example of the 'push' mode of conversation is", "o": ["asking a question", "making a proposal", "giving your opinion", "requesting an opinion"], "a": 2}, {"t": "Exercise 10", "n": 5, "q": "Which of the following would not be indicative of good leadership?", "o": ["leading by example", "advising your intentions before acting", "not involving the crew in decision making", "offering praise for good performance"], "a": 2}, {"t": "Exercise 10", "n": 6, "q": "Mode awareness has become a concern for the crews of modern generation aircraft. This term refers to", "o": ["crew awareness of the flight mode of the autoflight systems", "first-officer awareness of the mood of the captain", "captain's awareness of the thoughts of the flight crew", "crew awareness of the correct speeds and power settings for various flight stages"], "a": 0}, {"t": "Exercise 10", "n": 7, "q": "One disadvantage of glass cockpit technology in the modern generation of aircraft is that", "o": ["pilots having difficulty in understanding the mass of information presented on the displays", "captains having difficulty in monitoring the actions of the crew", "loss of proficiency in basic instrument flying skills especially in younger pilots", "lack of faith in the indications given by the CRTs"], "a": 2}, {"t": "Exercise 10", "n": 8, "q": "Which of the following is an advantage of a digital display over a circular analogue display?", "o": ["comparison between similar systems is easier", "the exact value of an item is more easily read", "it is easier to observe the direction and rate of change of a parameter", "it is easier to include it in the scan during hands-on instrument flight"], "a": 1}, {"t": "Exercise 10", "n": 9, "q": "Which of the following is true of linear strip display type instruments compared to circular gauge instruments?", "o": ["they provide easier comparison between systems", "it is difficult to detect a discrepancy between two systems", "linear strip displays make it easier to obtain accurate values", "linear strip displays are easier to include in the scan during instrument flight"], "a": 0}, {"t": "Exercise 10", "n": 10, "q": "The captain of a multi-crew aircraft rarely consults other members of the crew and discourages any verbal input from them in the course of a flight. This situation could be described as", "o": ["a shallow authority gradient", "an ideal authority gradient", "a steep authority gradient", "strong leadership"], "a": 2}, {"t": "Exercise 10", "n": 11, "q": "The 'Three Circles' model of good leadership requires that a leader should", "o": ["concentrate on the task and not be influenced by the team or the individual", "always consider the team and the task, but not be concerned with individuals", "consider the task and the team only after all of the needs of the individual have been met", "be prepared to consider the task, the team and the individual in his/her leadership style"], "a": 3}, {"t": "Exercise 10", "n": 12, "q": "A good leader should be prepared to", "o": ["lead by example, motivate, delegate and consult", "lead by example, motivate, delegate but never consult", "lead by example, motivate, consult but never delegate", "lead by example, consult, delegate but never motivate"], "a": 0}, {"t": "Exercise 10", "n": 13, "q": "In December 1978 in Portland, Oregon USA, the crew of a United Airlines DC-8 were dealing with an undercarriage fault as they approached the airport. While attempting to deal with the fault, the captain held for over an hour until the aircraft eventually ran out of fuel. The flight engineer had warned the captain of the low fuel state but the captain, preoccupied with the undercarriage fault, simply said 'OK' then went back to what he was doing. A contributing factor in this accident was the engineer's", "o": ["attitude of resignation", "hesitation", "lack of concern", "lack of assertion"], "a": 3}, {"t": "Exercise 10", "n": 14, "q": "Which of the following is an example of the 'Pull' mode of communication?", "o": ["inviting the other party to negotiate", "giving commands or orders", "expressing an opinion", "presenting your side of a negotiation"], "a": 0}, {"t": "Exercise 10", "n": 15, "q": "An important difference between leadership and authority is that authority is assigned while true leadership is acquired.", "o": ["this statement is true", "this statement is false"], "a": 0}, {"t": "Exercise 10", "n": 16, "q": "In the event of a sudden emergency in flight the most effective communication style is", "o": ["assertive", "resigned", "sympathetic", "abrasive"], "a": 0}, {"t": "Exercise 10", "n": 17, "q": "The two communication rule used by many air crews today requires a response to each statement or comment made on the flight deck. If a response is not made by the flying pilot, then", "o": ["the comment is repeated once more and if there is still no response the non flying pilot takes over", "the comment is repeated twice more with increased volume and if there is still no response the non flying pilot takes over", "the non flying pilot takes over immediately", "the comment is repeated once more and if there is still no response the non flying pilot shakes the other crew member to wake them up"], "a": 0}, {"t": "Exercise 10", "n": 18, "q": "Good cockpit leadership technique may be characterised by", "o": ["high personal attention and medium task orientation", "medium personal attention and medium task orientation", "high personal attention and high task orientation", "medium personal attention and high task orientation"], "a": 2}, {"t": "Exercise 10", "n": 19, "q": "The preferred style of communication on the flight deck is", "o": ["debating", "summarising", "physical touch", "prolonged eye contact"], "a": 1}, {"t": "Exercise 10", "n": 20, "q": "Refer to the diagram below representing a glass cockpit display consisting of an artificial horizon with an airspeed tape on the left and an altitude tape on the right both with high values at the top of the display. On climb with a constant power setting the speed and altitude scales will be moving in opposite directions as airspeed reduces and altitude increases. This may lead to the illusion of", "o": ["climbing", "rolling", "pitching", "yawing"], "a": 1, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pL ge of a gauge type display of engine parameters versus a digital readout is", "o": ["the exact value of the parameter is easy to discern", "trends and rate of change are easily detected", "comparison between engines is made easier", "a glance can tell the pilot if the readings are within the normal range"], "a": 0}, {"t": "Exercise 10", "n": 30, "q": "An example of the 'push' mode of conversation is", "o": ["asking a question", "making a proposal", "giving your diagnosis", "reading back"], "a": 2}, {"t": "Exercise 10", "n": 31, "q": "The Glass Cockpit technology of the modern generation of aircraft has many advantages over the conventional flight deck instruments but there are disadvantages as well. One such disadvantage is", "o": ["pilots having difficulty integrating the mass of information presented on the displays", "an increased monitoring workload", "lack of proficiency of basic instrument flying skills, especially for younger pilots", "older pilots distrust of the systems"], "a": 2}, {"t": "Exercise 10", "n": 32, "q": "Mode awareness has become a cause for concern among crews of modern generation aircraft. This term refers to", "o": ["crew awareness of the flight mode of the autoflight system", "co-pilot awareness of the mode of questioning of the captain", "captain awareness of the thought processes of the first officer", "crew awareness of the transponder mode setting for WAS operation"], "a": 0}, {"t": "Exercise 10", "n": 33, "q": "Linear strip type instrument displays compared to circular gauge instruments provide", "o": ["an easy comparison between systems and show trends clearly", "difficulty in detecting discrepancies between engines", "more accurate values", "no advantages"], "a": 0}, {"t": "Exercise 10", "n": 34, "q": "A characteristic of good leadership would be for a Pilot in Command to", "o": ["propose a solution then consult the First Officer for an opinion", "ask the First Officer's opinion then make a decision", "act autocratically", "act democ const LET = ["a","b","c","d","e"];
let pool = [], idx = 0, score = 0, wrongList = [], answered = false, selected = null;
const starred = new Set();

const $ = id => document.getElementById(PFX + id);
const show = (id, on) => $(id).classList.toggle("hidden", !on);
const qkey = q => q.t + "|" + q.n;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function listFor(v) {
  if (v === "starred") return QUESTIONS.filter(q => starred.has(qkey(q)));
  if (v === "all" || v === "shuffled") return [...QUESTIONS];
  return QUESTIONS.filter(q => q.t === v);
}

function populateMenu() {
  const sel = $("testSel");
  [["all", "ALL human factors questions"], ["shuffled", "ALL QUESTIONS SHUFFLED"], ["Practice Exam One", "Practice Exam One"], ["Practice Exam Two", "Practice Exam Two"], ["Revision Test 1", "Revision Test 1"], ["Revision Test 3", "Revision Test 3"], ["Revision Test 4", "Revision Test 4"], ["Revision Test 5", "Revision Test 5"], ["Revision Test 6", "Revision Test 6"], ["Exercise 7", "Exercise 7"], ["Exercise 8", "Exercise 8"], ["Exercise 9", "Exercise 9"], ["Exercise 10", "Exercise 10"], ["More TEM Questions", "More TEM Questions"], ["starred", "Starred questions"]]
    .forEach(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); });
}

function startQuiz(source) {
  let list, shuffleIt;
  if (source) { list = source; shuffleIt = $("shuffleChk").checked; }
  else { list = listFor($("testSel").value); shuffleIt = $("shuffleChk").checked || $("testSel").value === "shuffled"; }
  if (!list.length) { alert("No questions in this set yet. Star some questions or pick another set."); return; }
  pool = (shuffleIt ? shuffle([...list]) : [...list]).map(shuffleOpts);
  idx = 0; score = 0; wrongList = []; sel = [];
  show("setup", false); show("results", false); show("quiz", true);
  renderQ();
}

function updateStar() {
  const on = starred.has(qkey(pool[idx]));
  $("starBtn").classList.toggle("on", on);
  $("starBtn").textContent = on ? "★" : "☆";
}

function toggleStar() {
  const k = qkey(pool[idx]);
  starred.has(k) ? starred.delete(k) : starred.add(k);
  updateStar();
}

function renderQ() {
  answered = false; selected = null;
  const q = pool[idx];
  updateStar();
  $("counter").textContent = `${q.t} · Q${q.n} · ${idx + 1} of ${pool.length}`;
  $("scoreLive").textContent = `Score: ${score}`;
  $("bar").style.width = (idx / pool.length * 100) + "%";
  $("qtext").textContent = q.q;
  const dg = $("qdiag");
  if (q.img) { dg.innerHTML = '<img src="' + q.img + '" alt="Question figure" style="width:100%;height:auto;border-radius:8px;background:#fff">'; show("qdiag", true); } else { dg.innerHTML = ""; show("qdiag", false); }
  const opts = $("opts");
  opts.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">[${LET[i]}]</span>${text}`;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  if (sel[idx] !== undefined) { selected = sel[idx]; review(); }
  setAction();
}

function choose(i) {
  if (answered) return;
  selected = i;
  ROOT.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("selected", k === i));
  setAction();
}

function submit() {
  if (answered || selected === null) return;
  answered = true;
  const i = selected, q = pool[idx];
  if (sel[idx] === undefined) sel[idx] = i;
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  const fb = $("feedback");
  if (i === q.a) {
    score++;
    fb.className = "feedback good";
    fb.textContent = "Correct!";
  } else {
    btns[i].classList.add("wrong");
    wrongList.push({ ...q, chosen: i });
    fb.className = "feedback bad";
    fb.textContent = `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  }
  $("scoreLive").textContent = `Score: ${score}`;
  const ex = document.createElement("div");
  ex.className = "expl";
  ex.innerHTML = "<strong>Explanation:</strong> " + q.e;
  if (q.e) fb.appendChild(ex);
  if (q.work) { const wk = document.createElement("div"); wk.style.marginTop = "12px"; wk.innerHTML = '<div style="font-weight:600;margin-bottom:6px">Full working</div><img src="' + q.work + '" alt="Working" style="width:100%;height:auto;border-radius:8px;background:#fff">'; fb.appendChild(wk); }
  setAction();
}

function review() {
  answered = true;
  const i = selected, q = pool[idx];
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  if (i !== q.a) btns[i].classList.add("wrong");
  const fb = $("feedback");
  fb.className = i === q.a ? "feedback good" : "feedback bad";
  fb.textContent = i === q.a ? "Correct!" : `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  if (q.e) { const ex = document.createElement("div"); ex.className = "expl"; ex.innerHTML = "<strong>Explanation:</strong> " + q.e; fb.appendChild(ex); }
}

function prevQ() {
  if (idx > 0) { idx--; renderQ(); }
}

function nextQ() {
  if (idx < pool.length - 1) { idx++; renderQ(); }
  else showResults();
}

function showResults() {
  show("quiz", false); show("results", true);
  const pct = Math.round(score / pool.length * 100);
  $("finalScore").textContent = `${score} / ${pool.length} (${pct}%)`;
  $("finalMsg").textContent = pct >= 80 ? "Great work. Review the misses below." :
                              pct >= 50 ? "Solid start. Retry the missed questions to lock them in." :
                              "Keep going. Work through the misses, then retry them.";
  const ol = $("missedList");
  ol.innerHTML = "";
  if (!wrongList.length) {
    ol.innerHTML = "<li>No misses. Nice.</li>";
    $("retryBtn").disabled = true;
  } else {
    $("retryBtn").disabled = false;
    wrongList.forEach(q => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${q.t} Q${q.n}:</strong> ${q.q}<br>
        <span style="color:var(--bad)">Your answer: [${LET[q.chosen]}] ${q.o[q.chosen]}</span><br>
        <span style="color:var(--good)">Correct: [${LET[q.a]}] ${q.o[q.a]}</span><br>
        <span style="color:var(--muted)">${q.e}</span>`;
      ol.appendChild(li);
    });
  }
}

function setAction() {
  const btn = $("actionBtn");
  if ($("prevBtn")) $("prevBtn").disabled = idx === 0;
  if (answered) {
    btn.textContent = idx === pool.length - 1 ? "See results" : "Next";
    btn.disabled = false;
  } else {
    btn.textContent = "Submit";
    btn.disabled = selected === null;
  }
}

$("startBtn").onclick = () => startQuiz();
$("actionBtn").onclick = () => (answered ? nextQ() : submit());
if ($("prevBtn")) $("prevBtn").onclick = prevQ;
$("quitBtn").onclick = () => { if (confirm("Quit this quiz and see your results so far?")) showResults(); };
$("retryBtn").onclick = () => startQuiz(wrongList.map(({ chosen, ...q }) => q));
$("restartBtn").onclick = () => { show("results", false); show("quiz", false); show("setup", true); };
$("starBtn").onclick = toggleStar;
$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.addEventListener("keydown", e => {
  if (ROOT.classList.contains("hidden")) return;
  if ($("quiz").classList.contains("hidden")) return;
  if (!answered && /^[a-eA-E]$/.test(e.key)) choose(LET.indexOf(e.key.toLowerCase()));
  else if (e.key === "Enter" && !$("actionBtn").disabled) $("actionBtn").click();
});

populateMenu();

  const cnt = document.getElementById("count-hf");
  if (cnt) cnt.textContent = QUESTIONS.length + " questions";
})();
