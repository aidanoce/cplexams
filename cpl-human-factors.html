<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPL Human Factors</title>
<style>
  :root {

    --good-bg: #dcfce7; --sky-top: #d6e8fb; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1c2130; --text: #e6e9f0; --muted: #9aa3b5;
      --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --border: #2f3646;
      --good-bg: #163d26; --sky-top: #16203a; --bad-bg: #4a1d1d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1c2130; --text: #e6e9f0; --muted: #9aa3b5;
    --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --border: #2f3646;
    --good-bg: #163d26; --sky-top: #16203a; --bad-bg: #4a1d1d;
  }
  * { box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--sky-top) 0, var(--bg) 420px) var(--bg);
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><g fill='%23708090' transform='rotate(-20 90 90)'><path d='M90 22 C94 22 96 26 96 32 L96 70 L150 96 L150 106 L96 96 L94 136 L110 148 L110 156 L90 150 L70 156 L70 148 L86 136 L84 96 L30 106 L30 96 L84 70 L84 32 C84 26 86 22 90 22 Z'/></g></svg>");
    background-size: 180px 180px; opacity: .10;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 0 40px; position: relative; z-index: 1; }
  h1 { font-size: 1.35rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  select, button {
    font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .progress { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .qtext { font-size: 1.05rem; margin: 6px 0 14px; white-space: pre-line; }
  .qhead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .star { font-size: 1.5rem; background: none; border: none; color: var(--muted); padding: 0 4px; line-height: 1; }
  .star.on { color: #f5b301; }
  .topic { font-size: .8rem; color: var(--accent); margin: -6px 0 10px; }
  .expl { margin-top: 8px; color: var(--text); font-size: .93rem; }
  .qimg { max-width: 100%; display: block; margin: 6px 0 12px; background: #fff; border-radius: 8px; padding: 6px; }
  .qnote { font-size: .8rem; color: var(--muted); font-style: italic; margin-top: -8px; margin-bottom: 12px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .98rem; width: 100%;
  }
  .opt .letter { display: inline-block; width: 26px; font-weight: 600; color: var(--muted); }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .score-big { font-size: 2.2rem; font-weight: 700; margin: 6px 0; }
  .missed { margin-top: 12px; }
  .missed li { margin-bottom: 10px; }
  .hidden { display: none !important; }
  .toggle { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 6px; }
  .theme-btn { margin-left: auto; }
  .footer-note { color: var(--muted); font-size: .8rem; margin-top: 16px; }

  .qdiag { background: var(--card); border-radius: 8px; margin: 4px 0 14px; }
  .qdiag svg { width: 100%; height: auto; display: block; }

  .hub-head { display:flex; align-items:center; gap:10px; }
  .cards { display:grid; grid-template-columns: 1fr; gap:14px; margin-top:8px; }
  @media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { text-align:left; background: var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; cursor:pointer; color:var(--text); font: inherit; }
  .card:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card svg { width:100%; height:auto; display:block; border-radius:10px; background: var(--sky-top); margin-bottom:12px; }
  .card h2 { font-size:1.1rem; margin:0 0 4px; }
  .card p { margin:0; color:var(--muted); font-size:.9rem; }
  .count { display:inline-block; margin-top:8px; color:var(--accent); font-size:.85rem; font-weight:600; }
  .card-img { width:100%; height:auto; display:block; border-radius:10px; background:var(--sky-top); margin-bottom:12px; }
  .badge { display:inline-block; margin-top:8px; margin-left:6px; padding:2px 8px; border-radius:999px; background:var(--accent); color:#fff; font-size:.75rem; font-weight:600; }
  .study-item { border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:12px 0; background:var(--card); }
  .study-item summary { cursor:pointer; font-weight:600; }
  .study-img { width:100%; height:auto; display:block; border-radius:8px; margin:10px 0; background:#fff; }
  .study-body { line-height:1.5; }
  .back { margin-bottom:12px; }
  .app-head h1 { font-size:1.25rem; }
.site-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.site-tabs a,.site-tabs span{padding:8px 18px;border-radius:8px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem;background:var(--bg)}
.site-tabs a.active,.site-tabs span.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.site-tabs span.soon{opacity:.5;cursor:default}
</style>

<script>
function shuffleOpts(q) {
  // Shuffle the A-D options (and the correct answer with them). Questions whose options refer to other options stay as written.
  const refers = q.o.some(x => /\b(all|none|both|neither)\b|\[[a-e]\]|\b[a-e]\)|\bas above\b|\babove\b/i.test(x));
  if (refers || q.o.length < 2) return q;
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

nt before acting", "not involving the crew in decision making", "praising good performance"], "a": 2}, {"t": "Practice Exam Two", "n": 15, "q": "Carbon monoxide is dangerous because", "o": ["it displaces oxygen from the red blood cells", "it is heavier than air and so displaces the air", "it is very smelly and so is a distraction", "its effects increase on descent"], "a": 0}, {"t": "Practice Exam Two", "n": 16, "q": "If your Eustachian tube becomes closed or blocked, the site of the problem is likely to be", "o": ["the soft tissues at the nasal passage end of the tube", "the inner ear end of the tube", "the outer ear opening", "only at the bend"], "a": 1}, {"t": "Practice Exam Two", "n": 17, "q": "After crossing a number of time zones, the average rate of time adjustment the body makes is", "o": ["10 hours per day", "7 hours per day", "4 hours per day", "1.5 hours per day"], "a": 3}, {"t": "Practice Exam Two", "n": 18, "q": "Unequal air pressure between a part of the ear and the environment can cause pain and other complications. The part of the ear affected is the", "o": ["inner ear", "middle ear", "outer ear", "lower ear"], "a": 1}, {"t": "Practice Exam Two", "n": 19, "q": "Excess salt tends to", "o": ["make you pass a lot of water", "lower your resistance to bacterial infection", "lower the blood pressure", "raise the blood pressure"], "a": 3}, {"t": "Practice Exam Two", "n": 20, "q": "With regard to the problem of a closed or blocked Eustachian tube, the phase of flight likely to be more of a problem than the rest is", "o": ["climb, with the volume of gas in the middle ear decreasing", "cruise, with the volume of gas in the middle ear remaining constant", "descent, with the volume of gas in the middle ear decreasing", "landing, with the volume of gas in the middle ear fluctuating"], "a": 2}, {"t": "Practice Exam Two", "n": 21, "q": "Alcohol is classed as a", "o": ["stimulant", "depressant", "analgesic", "sedative"], "a": 1}, {"t": "Practice Exam Two", "n": 22, "q": "Obesity can lead to", "o": ["low blood pressure", "high blood pressure", "fainting attacks", "shortness of breath"], "a": 1}, {"t": "Practice Exam Two", "n": 23, "q": "To lower your risk of heart disease, you should avoid", "o": ["being moderate with alcohol", "having a positive attitude and avoiding emotional stress", "choosing a low salt, low cholesterol diet", "increasing your smoking"], "a": 3}, {"t": "Practice Exam Two", "n": 24, "q": "The human brain is often considered analogous to a computer. The order of processing stages is", "o": ["decision, sensation, perception, response", "sensation, perception, decision, response", "response, sensation, perception, decision", "perception, response, decision, sensation"], "a": 1}, {"t": "Practice Exam Two", "n": 25, "q": "A major factor in the Kegworth accident was", "o": ["the shut down of the wrong engine by the FO and a lack of communication between cabin crew and flight crew which would have alerted the flight crew to which engine was on fire", "the Captain's arrogance and his insistence on dealing with the problem by himself", "a failure of all flight crew members to adequately monitor the fuel state, resulting in fuel exhaustion and a one engine inoperative dead stick approach", "the crew performing rash actions without any attempt to evaluate progress or monitor results"], "a": 0}, {"t": "Practice Exam Two", "n": 26, "q": "A major contributing factor in the Tenerife accident was", "o": ["the Pan Am crew's disregard for correct radio phraseology", "the KLM Captain's concern over time constraints resulting in a rushed departure combined with a steep cockpit authority gradient inhibiting crew contributions", "both aircraft crew's failure to maintain a good lookout during ground operations", "the KLM Engineer's lack of situational awareness"], "a": 1}, {"t": "Practice Exam Two", "n": 27, "q": "A crew has just completed a flight from Melbourne to Tokyo and return with minimum rest. At the end of this tour, they would be likely to be suffering the effects of", "o": ["chronic fatigue", "acute fatigue", "transmeridional dyschronism", "boredom"], "a": 1}, {"t": "Practice Exam Two", "n": 28, "q": "Hypoxia risk will not be increased by", "o": ["increased altitude", "a cold environment", "smoking", "hyperventilation"], "a": 3}, {"t": "Practice Exam Two", "n": 29, "q": "Long term memory is characterised by", "o": ["apparently unlimited capacity, but information can be difficult to recall", "very limited capacity, but reliable and easy recall", "apparently unlimited capacity, reliable and easy recall", "limited capacity and difficult recall"], "a": 0}, {"t": "Practice Exam Two", "n": 30, "q": "A condition which is caused by excessive uric acid in the blood and can be aggravated by a poor diet is", "o": ["gout", "stomach ulcers", "tinea", "insomnia"], "a": 0}, {"t": "Practice Exam Two", "n": 31, "q": "When landing into the sun the best action for a pilot to take is to", "o": ["use the cockpit sun visor", "wear sunglasses", "concentrate on the area just over the nose", "put the seat back fully up"], "a": 0}, {"t": "Practice Exam Two", "n": 32, "q": "An effect of the long term use of aspirin is", "o": ["blurred vision", "high blood pressure", "skin irritations", "internal bleeding and kidney problems"], "a": 3}, {"t": "Practice Exam Two", "n": 33, "q": "In a situation of very high cockpit workload a pilot is liable to", "o": ["miss information due to a narrowing of attention", "become too slow to react to information", "miss information due to infrequent input", "lose interest in the situation"], "a": 0}, {"t": "Practice Exam Two", "n": 34, "q": "Under circumstances of high cockpit workload a good captain should be prepared to", "o": ["make command decisions without consultation", "take over the tasks of juniors", "prioritise and delegate tasks", "take full responsibility for all tasks"], "a": 2}, {"t": "Practice Exam Two", "n": 35, "q": "The best quality of sleep occurs between the local mean time hours of", "o": ["0800 to 2400", "2200 to 0800", "0800 to 1400", "1400 to 2200"], "a": 1}, {"t": "Practice Exam Two", "n": 36, "q": "A gesture which enhances positive communication is", "o": ["folding the arms", "crossing the legs", "finger tapping", "nodding of the head"], "a": 3}, {"t": "Practice Exam Two", "n": 37, "q": "To maintain a good communication standard between crew members it is not advisable for", "o": ["the co-pilot to be assertive when he/she feels the captain has made an error", "the captain to consult with the crew before making an operational decision", "the captain to offer praise for good performance", "the co-pilot to clear his mind of all doubts before bothering the captain"], "a": 3}, {"t": "Practice Exam Two", "n": 38, "q": "In the event of a sudden emergency in flight the most effective communication style is", "o": ["assertive", "resigned", "sympathetic", "abrasive"], "a": 0}, {"t": "Revision Test 3", "n": 1, "q": "One of the functions of the outer ear is to", "o": ["prevent the pilot's cap from slipping down over his/her eyes", "mediate the sense of balance", "equalise the pressure on either side of the eardrum", "send nerve impulses to the brain", "protect the eardrum from intrusions of insects, dust etc"], "a": 4}, {"t": "Revision Test 3", "n": 2, "q": "Which of the following is a function of the middle ear?", "o": ["to protect the eardrum from the intrusion of foreign bodies", "to amplify the vibrations arriving at the eardrum and transfer them to the cochlea", "to convert the mechanical energy of vibrations to nerve impulses", "to assist in maintaining the sense of balance"], "a": 1}, {"t": "Revision Test 3", "n": 3, "q": "Which of the following is a function of the inner ear?", "o": ["to protect the eardrum from the intrusion of foreign bodies", "to amplify the vibrations arriving at the eardrum and transfer them to the cochlea", "to convert the mechanical energy of vibrations to nerve impulses and assist in maintaining the sense of balance", "to equalise the pressure on either side of the eardrum"], "a": 2}, {"t": "Revision Test 3", "n": 4, "q": "Which of the following serves to detect the loudness and pitch of sound by converting the mechanical energy of vibration to electrical impulses?", "o": ["the cochlea", "the semicircular canals", "the hammer, anvil and stirrup", "the vestibular system"], "a": 0}, {"t": "Revision Test 3", "n": 5, "q": "Which of the following mediates the sense of balance?", "o": ["the cochlea", "the semicircular canals", "the hammer, anvil and stirrup", "the eustachian tube"], "a": 1}, {"t": "Revision Test 3", "n": 6, "q": "As a rough guide, hearing protection should be worn if the ambient noise levels are such that it is necessary to shout to conduct a conversation over a distance of", "o": ["10 metres", "5 metres", "3 metres", "half a metre"], "a": 3}, {"t": "Revision Test 3", "n": 7, "q": "Deterioration of hearing caused by exposure to loud noise usually occurs first", "o": ["in the high frequency range, above normal speech", "in the frequency range of normal speech, 300 to 5000 Hz", "in the frequency range below normal speech", "across the whole range of audible frequencies"], "a": 0}, {"t": "Revision Test 3", "n": 8, "q": "A decibel is a unit used to measure", "o": ["the frequency or pitch of sound", "the intensity or loudness of sound"], "a": 1}, {"t": "Revision Test 3", "n": 9, "q": "Hertz is used to measure", "o": ["the frequency or pitch of sound", "the intensity or loudness of sound"], "a": 0}, {"t": "Revision Test 3", "n": 10, "q": "Continuous exposure to high noise levels in the cockpit should be avoided because", "o": ["the effect is cumulative and can eventually lead to deafness", "stress levels are increased and concentration levels are decreased", "general performance and efficiency is reduced", "all of the above are correct"], "a": 3}, {"t": "Revision Test 3", "n": 11, "q": "Which of the following is the minimum intensity of noise that would result in the sensation of pain to the ears?", "o": ["85 dB", "110 dB", "140 dB", "160 dB"], "a": 2}, {"t": "Revision Test 3", "n": 12, "q": "Which of the following is the minimum noise level that would mark the onset of temporary or permanent deafness after prolonged exposure?", "o": ["85 dB", "110 dB", "140 dB", "160 dB"], "a": 0}, {"t": "Revision Test 3", "n": 13, "q": "Which of the following is the function of the eustachian tube in the human respiratory system?", "o": ["it connects the middle ear to the outer ear", "it connects the middle ear to the inner ear", "it connects the middle ear to the throat cavity", "it connects the inner ear to the throat cavity"], "a": 2}, {"t": "Revision Test 3", "n": 14, "q": "Hearing loss due to long-term exposure to high noise levels is usually first noticed in the loss of sensitivity to", "o": ["high frequency sounds", "low frequency sounds", "medium frequency sounds", "all frequencies of sound"], "a": 0}, {"t": "Revision Test 3", "n": 15, "q": "Above which noise level is it recommended that hearing protection be worn?", "o": ["160 dB", "140 dB", "110 dB", "85 dB"], "a": 3}, {"t": "Revision Test 3", "n": 16, "q": "Which part of the ear is most affected by pressure differences when the eustachian tube is blocked?", "o": ["the outer ear", "the middle ear", "the inner ear", "the ear lobe"], "a": 1}, {"t": "Revision Test 3", "n": 17, "q": "If a head cold causes a blockage in the eustachian tube, where is the blockage most likely to occur?", "o": ["at the top where the tube enters the middle ear", "at the bottom where the tube enters the nasal passage", "in the centre where the tube is narrowest", "in any location where the tube bends"], "a": 1}, {"t": "Revision Test 3", "n": 18, "q": "Which component of the inner ear senses changes in speed with constant direction [linear acceleration]?", "o": ["the semicircular canal", "the otolith organ", "the eardrum", "the cochlea"], "a": 1}, {"t": "Revision Test 3", "n": 19, "q": "When established in a balanced level turn at constant bank angle, the hair-like cells of the semicircular canals will be", "o": ["deflected in the direction of turn", "deflected in the opposite direction to the turn", "in the rest position with no deflection", "waving back and forth"], "a": 2}, {"t": "Revision Test 3", "n": 20, "q": "The term frequency when applied to sound is most closely related to", "o": ["the number of pressure waves arriving at the ear in each second", "the strength (amplitude) of the pressure waves", "the loudness of the sound", "the tone of the sound"], "a": 0}, {"t": "Revision Test 3", "n": 21, "q": "The minimum noise level which could cause a person to suffer temporary or permanent hearing loss after exposure to sustained levels is", "o": ["30 dB", "45 dB", "85 dB", "120 dB"], "a": 2}, {"t": "Revision Test 3", "n": 22, "q": "The organ which provides a person with a sense of balance is the", "o": ["accelerometer", "eustachian tube", "cochlea", "semicircular canals"], "a": 3}, {"t": "Revision Test 3", "n": 23, "q": "During constant angular acceleration, the hair-like sensors (cupula) in the semicircular canals are", "o": ["upright (zero deflection)", "tilted in the opposite direction to the turn", "tilted in the same direction as the turn", "oscillating"], "a": 0}, {"t": "Revision Test 3", "n": 24, "q": "Hyperventilation is caused by", "o": ["too much carbon monoxide in the air", "too much carbon dioxide in the air", "breathing too rapidly for the amount of activity", "breathing pure oxygen when not necessary"], "a": 2}, {"t": "Revision Test 3", "n": 25, "q": "The part of the ear which converts sounds into nerve impulses is the", "o": ["semicircular canals", "eustachian tube", "eardrum", "cochlea"], "a": 3}, {"t": "Revision Test 3", "n": 26, "q": "The anatomy of the ear which acts as a linear accelerometer is the", "o": ["stirrup", "anvil", "cochlea", "otolith"], "a": 3}, {"t": "Revision Test 3", "n": 27, "q": "Temporary or permanent hearing loss can be caused by sustained noise exposure at levels", "o": ["above 120 dB", "of 60 dB or greater", "typically found in the cockpit of a light aircraft", "above 140 dB"], "a": 2}, {"t": "Revision Test 3", "n": 28, "q": "Exposure to sustained high noise levels", "o": ["is distracting only", "is distracting and fatiguing, but only likely to cause temporary hearing loss", "may cause permanent hearing loss", "is irritating and distracting, but unlikely to be fatiguing"], "a": 2}, {"t": "Revision Test 3", "n": 29, "q": "A guide as to when hearing protection should be worn is", "o": ["if you must yell to be heard 5 metres away", "if you can't hear a whisper from 0.5 metres away", "if you can't hear a normal conversation from 2 metres away", "if you must yell to be heard 0.5 metres away"], "a": 3}, {"t": "Revision Test 3", "n": 30, "q": "Hearing loss due to long term exposure to high noise levels usually initially affects", "o": ["detection of high frequency sounds", "detection of low frequency sounds", "all frequencies equally", "middle frequency sounds"], "a": 0}, {"t": "Revision Test 3", "n": 31, "q": "It is strongly advised that hearing protections such as a good quality headset should be worn", "o": ["during preflight inspections and throughout the flight", "during take-off only", "during take-off and landing", "at all times during flight"], "a": 3}, {"t": "Revision Test 3", "n": 32, "q": "The function of the hammer, anvil and stirrup is to transfer vibrations from", "o": ["the middle ear to the inner ear", "the outer ear to the middle ear", "the middle ear to the ear drum", "the ear drum to the inner ear"], "a": 3}, {"t": "Revision Test 1", "n": 1, "q": "The type of human errors which feature most commonly in aircraft accidents are", "o": ["errors in manipulating the flying controls (handling errors)", "errors of judgement or poor decision making", "errors caused through lack of theoretical knowledge", "errors caused through lack of experience on type"], "a": 1}, {"t": "Revision Test 1", "n": 2, "q": "The most common cause of pilot incapacitation during flight is", "o": ["heart attack", "dehydration", "blocked sinus passages", "food or drink poisoning (gastro-intestinal disorders)"], "a": 3}, {"t": "Revision Test 1", "n": 3, "q": "Dehydration is more likely to be experienced after several hours at", "o": ["high altitude on a dry day", "low altitude on a humid day", "high altitude on a humid day", "low altitude on any day"], "a": 0}, {"t": "Revision Test 1", "n": 4, "q": "The symptoms of dehydration include", "o": ["profuse sweating", "drying of the nasal passages and a prickly sensation in the eyes", "'runny' eyes and nose", "stomach cramps and a high temperature"], "a": 1}, {"t": "Revision Test 1", "n": 5, "q": "The CASA has recommended a period on the ground after making a blood donation of at least", "o": ["6 hours", "24 hours", "12 hours", "48 hours"], "a": 1}, {"t": "Revision Test 1", "n": 6, "q": "CAR 256 requires total abstinence by all pilots from any alcohol for a period of", "o": ["8 hours before departure", "24 hours before departure", "8 hours before commencing duty", "12 hours before departure"], "a": 0}, {"t": "Revision Test 1", "n": 7, "q": "Which of the following is true of drugs taken by pilots for medical reasons before flight?", "o": ["any drugs that are available 'over the counter' can be considered safe", "drugs can be considered safe if they are prescribed by a doctor", "drugs can be considered safe unless there is a warning on the packet", "the opinion of a DAME should be sought before using any drug"], "a": 3}, {"t": "Revision Test 1", "n": 8, "q": "Discomfort or pain in the ears or sinuses is most likely during", "o": ["long periods of cruising flight at high altitude", "high rates of descent in unpressurised aircraft", "high rates of climb in unpressurised aircraft", "long slow descents in unpressurised aircraft"], "a": 1}, {"t": "Revision Test 1", "n": 9, "q": "If an otherwise healthy pilot suffers a bout of dizzy spells, the appropriate action required by CASR 67.205 would be", "o": ["notify a DAME and refrain from all flying until cleared", "notify a DAME and refrain from all commercial flying until cleared", "notify a DAME and refrain from all instrument flying until cleared", "resume flying providing there is no recurrence within twenty-four hours"], "a": 0}, {"t": "Revision Test 1", "n": 10, "q": "Pilots can best assist airsick passengers by", "o": ["warning them that they will have to clean up the mess if they vomit", "descending quickly to land before they become sick", "reassuring them that airsickness is nothing to worry about", "flying as smoothly as possible and making all manoeuvres and descents gentle"], "a": 3}, {"t": "Revision Test 1", "n": 11, "q": "Which of the following is a condition which is caused by excessive uric acid in the blood and can be aggravated by poor diet?", "o": ["gout", "angina", "leprosy", "tinea"], "a": 0}, {"t": "Revision Test 1", "n": 12, "q": "Which of the following would not be likely to result from flying with a severe cold?", "o": ["dizziness caused by pressure build-up in the middle ear (pressure vertigo)", "discomfort or pain in the ears during a rapid descent", "blurring of vision", "rupturing of the eardrum"], "a": 2}, {"t": "Revision Test 1", "n": 13, "q": "It is generally accepted that human error can be totally eliminated from aviation with proper training and standard operating procedures", "o": ["this statement is true", "this statement is false"], "a": 1}, {"t": "Revision Test 1", "n": 14, "q": "Too much salt in the diet can lead to", "o": ["excessive sweating", "increased chance of catching colds or flu", "high blood pressure", "low blood pressure"], "a": 2}, {"t": "Revision Test 1", "n": 15, "q": "Foods most likely to produce intestinal gases are", "o": ["salty foods", "green vegetables", "foods high in sugar", "chicken"], "a": 1}, {"t": "Revision Test 1", "n": 16, "q": "Obesity [being over weight] has been linked with which of the following health problems", "o": ["drowsiness, headaches, low blood pressure and gout", "cancer, drowsiness, headaches and heart disease", "high blood pressure (hypertension), gout, diabetes and heart disease", "diabetes, headaches, cancer and high blood pressure"], "a": 2}, {"t": "Revision Test 1", "n": 17, "q": "Too little iron in the diet can lead to which of the following health problems?", "o": ["anaemia", "low blood pressure", "skin rashes", "dizzy spells"], "a": 0}, {"t": "Revision Test 1", "n": 18, "q": "High blood pressure (hypertension) is a common cause of disqualification on medical grounds. With which of the following is hypertension most directly linked?", "o": ["heart disease", "anaemia", "anorexia", "old age"], "a": 0}, {"t": "Revision Test 1", "n": 19, "q": "On a hot day it is possible for the body to lose about 5 litres (more than one gallon) of water", "o": ["this statement is true", "this statement is false"], "a": 0}, {"t": "Revision Test 1", "n": 20, "q": "One of the common characteristics of ageing is a deterioration of hearing. This is usually noticed first in the", "o": ["low frequencies", "medium frequencies", "high frequencies", "across all frequencies"], "a": 2}, {"t": "Revision Test 1", "n": 21, "q": "The purpose of the Eustachian tube in the human respiratory system is to connect the", "o": ["middle ear to the outer ear", "inner ear to the middle ear", "outer ear to the inner ear", "middle ear to the throat", "inner ear to the throat"], "a": 3}, {"t": "Revision Test 1", "n": 22, "q": "The primary cause of pilot incapacitation in flight is", "o": ["disorientation due to inner ear infections", "gastrointestinal disorders", "heart attack", "stroke"], "a": 1}, {"t": "Revision Test 1", "n": 23, "q": "A person flying with a head cold would not usually be affected by", "o": ["hypermetropia", "pressure vertigo", "difficulty clearing ears on descent", "rupturing of the tympanic membrane (eardrum)"], "a": 0}, {"t": "Revision Test 1", "n": 24, "q": "The recommended period of time between blood donations and commencement of flying duties is", "o": ["12 hours", "24 hours", "48 hours", "96 hours"], "a": 1}, {"t": "Revision Test 1", "n": 25, "q": "If suffering from heat stress, a pilot should", "o": ["drink sufficient fluid to quench his thirst", "drink more fluid than dictated by thirst alone", "drink ample quantities of carbonated fluids (soft drinks)", "drink ample water (rather than other fluids)"], "a": 1}, {"t": "Revision Test 1", "n": 26, "q": "Pilots who are inclined to suffer from air sickness", "o": ["should never take travel sickness tablets", "should always deliberately induce vomiting", "should use caution when using travel sickness preparations", "can safely take any travel sickness preparation"], "a": 2}, {"t": "Revision Test 1", "n": 27, "q": "The Valsalva manoeuvre", "o": ["could never be the cause of pressure vertigo", "is more likely to be needed during a descent than a climb", "is more likely to be needed during a climb than a descent", "is not likely to be needed during a climb or descent"], "a": 1}, {"t": "Revision Test 1", "n": 28, "q": "An excessively cold environment does not pose the danger of", "o": ["impairment of thinking", "apathy", "loss of consciousness", "a feeling of elation"], "a": 3}, {"t": "Revision Test 1", "n": 29, "q": "An obese pilot with hypertension would be unlikely to suffer from", "o": ["increased risk of heart disease", "difficulty in breathing due to lung cancer", "pain in the joints due to excess wear and tear", "poor circulation"], "a": 1}, {"t": "Revision Test 1", "n": 30, "q": "The painful condition known as barotrauma is most likely to occur", "o": ["with an increase in differential pressure inside and outside the body when on descent", "with an increase in differential pressure inside and outside the body when on climb", "with a decrease in differential pressure inside and outside the body when on descent", "with a decrease in differential pressure inside and outside the body when on climb"], "a": 0}, {"t": "Revision Test 1", "n": 31, "q": "The ideal relative humidity for passenger comfort in a jet transport aircraft is considered to be", "o": ["10-20%", "20-30%", "40-60%", "60-70%"], "a": 2}, {"t": "Revision Test 1", "n": 32, "q": "On long flights at high altitude the relative humidity in the cabin of an aircraft may fall below comfortable levels. The relative humidity considered optimal for human comfort is", "o": ["40-60%", "50-70%", "25-65%", "30-50%"], "a": 0}, {"t": "Revision Test 1", "n": 33, "q": "During a descent with blocked Eustachian tubes, the gas volume in the middle ear", "o": ["increases", "decreases", "remains constant"], "a": 1}, {"t": "Revision Test 1", "n": 34, "q": "Sinus pain experienced by a pilot in an unpressurised aircraft is most likely with", "o": ["a blocked Eustachian tube during a climb", "a head cold during a climb", "a blocked Eustachian tube during a descent", "a head cold during a descent"], "a": 1}, {"t": "Revision Test 1", "n": 35, "q": "Select the lowest operating environment temperature at which the symptoms of heat stress are likely to occur", "o": ["15 C", "25 C", "32 C", "40 C"], "a": 2}, {"t": "Revision Test 1", "n": 36, "q": "If you pinch yourself just above the hip, a good level of fitness is indicated if the fold of flesh in your grasp has a thickness of about", "o": ["12 mm", "6 mm", "20 mm", "25 mm"], "a": 0}, {"t": "Revision Test 1", "n": 37, "q": "The best way to guard against dehydration is to", "o": ["drink water only when you are thirsty", "drink a large amount of water at the beginning of each day", "drink water regularly throughout the day", "drink only when you are out of the sun"], "a": 2}, {"t": "Revision Test 6", "n": 1, "q": "Which of the following will always be accompanied by an increase in positive G load?", "o": ["increased IAS in a dive", "any manoeuvre which requires extra power", "any manoeuvre which requires the pilot to pull back on the control column", "any manoeuvre in which the aircraft's nose is above the horizon"], "a": 2}, {"t": "Revision Test 6", "n": 2, "q": "Which of the following is an effect of a sustained high G load?", "o": ["a slowing of the heart beat", "a decreased flow of oxygenated blood to the brain", "an increased flow of oxygenated blood to the brain", "an irregular heart beat"], "a": 1}, {"t": "Revision Test 6", "n": 3, "q": "Very high transient (short-duration) G loads can be tolerated with little effect because", "o": ["the brain can continue to function for a few seconds on the residual oxygen which was present before the onset of the G load", "the heart responds immediately to the onset of high G loads by pumping faster", "high G load forces freshly oxygenated blood to the brain", "the brain can continue to function without oxygen until the increased heart rate compensates"], "a": 0}, {"t": "Revision Test 6", "n": 4, "q": "In which of the following situations would a normal healthy person be most likely to experience loss of consciousness (G-LOC)?", "o": ["eight G sustained for two seconds", "three G sustained for five seconds", "seven G sustained for seven seconds", "two G sustained for fifteen seconds"], "a": 2}, {"t": "Revision Test 6", "n": 5, "q": "Which of the following would not increase a pilot's tolerance to high G loads?", "o": ["adopting a more reclined seating position", "tensing of the stomach muscles just before the onset of and during the G load", "maintaining a high level of physical fitness", "adopting a more erect seating position"], "a": 3}, {"t": "Revision Test 6", "n": 6, "q": "Which of the following is an effect of a sustained negative G load?", "o": ["a slowing of the heart beat", "a decreased flow of oxygenated blood to the brain", "pooling of blood in the abdomen and legs", "an irregular heart beat"], "a": 0}, {"t": "Revision Test 6", "n": 7, "q": "Which of the following transitions of G loads would be most likely to produce G-LOC?", "o": [ "o": ["-1G", "-2G", "-3G", "-4G"], "a": 2}, {"t": "Revision Test 4", "n": 1, "q": "The function of the ciliary muscles in the eye is to", "o": ["alter the shape of the lens to allow the eye to focus on objects at various distances", "move the eye from left to right in the socket", "move the eyelids to produce blinking", "change the size of the pupil to vary the amount of light entering the eye"], "a": 0}, {"t": "Revision Test 4", "n": 2, "q": "When light passes through the lens it is brought to focus at the back of the eyeball on the", "o": ["retina", "optic nerve", "cornea", "iris"], "a": 0}, {"t": "Revision Test 4", "n": 3, "q": "The two different types of light sensitive elements on the retina are classified as", "o": ["rods which are sensitive to colour and cones which work best in dim light", "cones which are sensitive to colour and rods which work best in dim light", "rods and cones both of which respond equally to all lighting conditions", "rods and cones both of which are responsible for colour vision"], "a": 1}, {"t": "Revision Test 4", "n": 4, "q": "The blind spot is", "o": ["the area of the lens which is screened by the iris", "the black spot in the centre of the coloured section of the eye", "at the junction of the optic nerve and the retina", "an area on the cornea which does not respond to light"], "a": 2}, {"t": "Revision Test 4", "n": 5, "q": "If a pilot whose eyes have fully adapted to darkness is exposed to a bright flash of light, the time required for dark adaptation to be re-established is most likely to be", "o": ["3 minutes", "5 minutes", "15 minutes", "30 minutes"], "a": 3}, {"t": "Revision Test 4", "n": 6, "q": "Prolonged exposure to bright glare such as beach sand or snow can cause a significant reduction in night vision for up to", "o": ["12 hours", "one day", "one week", "one month"], "a": 2}, {"t": "Revision Test 4", "n": 7, "q": "Empty Field Myopia is the tendency of the ciliary muscle to relax when there are no close objects in the fie anding into a low sun"], "a": 3}, {"t": "Revision Test 4", "n": 20, "q": "Heavy rain may have the effect of making objects viewed through the windscreen appear", "o": ["further away than they actually are", "closer than they actually are", "larger than they actually are", "brighter than they actually are"], "a": 0}, {"t": "Revision Test 4", "n": 21, "q": "To avoid the possibility of the eyes taking up a resting focus position when flying in conditions without visual texture, it is recommended to", "o": ["stare at the horizon", "periodically look at an external aircraft fixture such as a wingtip", "blink regularly", "fixate at infinity"], "a": 1}, {"t": "Revision Test 4", "n": 22, "q": "To avoid an aircraft moving into the visual blind spot in a pilot's field of view, it is recommended to", "o": ["move the head as well as the eyes", "move the eyes only", "close one eye when scanning", "not rely on see and avoid for separation"], "a": 0}, {"t": "Revision Test 4", "n": 23, "q": "While night flying, the pilot of a passenger aircraft is exposed to the momentary flash of a match in the cabin. Full dark re-adaption will take", "o": ["not more than 5 minutes", "about 30 minutes", "10 to 15 minutes", "at least an hour"], "a": 1}, {"t": "Revision Test 4", "n": 24, "q": "Flicker vertigo is a condition which may occur during flight in a helicopter due to the strobe effect of light through the rotor disc. It may lead to", "o": ["a feeling of excessive speed", "disorientation", "an over alert state of mind", "a state of total relaxation"], "a": 1}, {"t": "Revision Test 4", "n": 25, "q": "Night vision may be assisted by", "o": ["avoiding dark rooms during the day", "avoiding the use of sunglasses during the day", "avoiding bright light during the day and wearing sunglasses", "avoiding the use of a hat when out in bright sunshine"], "a": 2}, {"t": "Revision Test 4", "n": 26, "q": "Night vision is enhanced by looking slightly off centre. This is due to", "o": ["the concentration of ing from", "o": ["the eyes", "the inner ear", "the middle ear", "the proprioceptive system"], "a": 0}, {"t": "Revision Test 5", "n": 3, "q": "Which of the following is the most likely cause of disorientation?", "o": ["a change in the information coming from the inner ear", "a conflict or ambiguity in the information coming from visual, vestibular and postural cues", "poor lighting reducing the amount of visual information received", "a rapid transition from level flight to a steep climb"], "a": 1}, {"t": "Revision Test 5", "n": 4, "q": "In the absence of reliable visual information, which of the following states of motion would be most difficult to differentiate?", "o": ["a steep turn and a rapid deceleration in level flight", "a rapid acceleration in level flight and a transition from level flight to a dive", "a rapid acceleration in level flight and a transition from level flight to a climb", "a rapid deceleration in level flight and a transition from level flight to a climb"], "a": 2}, {"t": "Revision Test 5", "n": 5, "q": "The most effective way to deal with an episode of disorientation in flight is to", "o": ["keep a constant look-out for glimpses of the natural horizon outside", "rely absolutely on the aircraft's instruments", "keep the control column central and maintain a constant power", "disregard the instrument indications and fly by 'feel' until it passes"], "a": 1}, {"t": "Revision Test 5", "n": 6, "q": "'The leans' is a state of disorientation which occurs when", "o": ["the rate of onset of the initial bank angle is above the threshold of perception, but the rate of the pilot's correction to a level attitude is below that threshold", "the rate of onset of the initial bank angle is below the threshold of perception, and the rate of the pilot's correction to a level attitude is also below that threshold", "the rate of onset of the initial bank angle is below the threshold of perception, but the rate of the pilot's correction to a level attitude is above pective?", "o": ["if two aircraft are in the field of view, the one which appears larger is always closest to the observer", "if two aircraft are in the field of view, the one which appears closer to the horizon is always further away", "any point which is on the horizon must be at the same height as the observer", "if two aircraft in the field of view are at the same height, they will also appear to be the same distance above or below the horizon"], "a": 2}, {"t": "Revision Test 5", "n": 12, "q": "One illusion which may be experienced on a dark night approach to a very wide runway which is remote from street or town lighting is", "o": ["the aircraft appears to be higher than it actually is during the flare prior to touchdown", "the aircraft appears to be lower than it actually is during the flare prior to touchdown", "the aircraft appears to be travelling faster than it actually is during the landing roll", "the aircraft appears to be higher than it actually is during the approach"], "a": 1}, {"t": "Revision Test 5", "n": 13, "q": "One illusion which may be experienced on a dark night approach to a narrow runway which is remote from street or town lighting is", "o": ["the aircraft appears to be higher than it actually is during the flare prior to touchdown", "the aircraft appears to be lower than it actually is during the flare prior to touchdown", "the aircraft appears to be travelling slower than it actually is during the landing roll", "the aircraft appears to be lower than it actually is during the approach"], "a": 0}, {"t": "Revision Test 5", "n": 14, "q": "You are making an approach by day into a runway where the terrain slopes up from the threshold of intended landing. The most likely misjudgment during this approach would be", "o": ["an overestimate of your height above the runway threshold", "an underestimate of your height above the runway threshold", "an underestimate of your speed during the approach", "an overestimate of the length of the runway"], "a"  it actually is in daylight", "further away than it actually is on a dark night", "further away than it actually is in daylight"], "a": 0}, {"t": "Revision Test 5", "n": 22, "q": "The somatogravic illusion causes the pilot to think that", "o": ["deceleration in a descent is level flight", "deceleration in level flight is a climb", "acceleration in a climb is level flight", "acceleration in level flight is a climb"], "a": 3}, {"t": "Revision Test 5", "n": 23, "q": "The effects of vertigo may be reduced or eliminated by", "o": ["rapidly scanning between instruments and external visual features", "looking only outside in conditions of poor visibility", "scanning all instruments only", "fixating only on one instrument"], "a": 2}, {"t": "Revision Test 5", "n": 24, "q": "The 'black hole' phenomena on take-off refers to", "o": ["the inability of light to escape beyond the event horizon", "the somatogravic illusion", "autokinesis", "the place where odd socks go"], "a": 1}, {"t": "Revision Test 5", "n": 25, "q": "A pilot's susceptibility to visual illusions during approaches will be increased by", "o": ["fatigue", "the amount and nature of their flying experience", "good night adaptation", "the presence of good glideslope guidance"], "a": 0}, {"t": "Revision Test 5", "n": 26, "q": "Disorientation is likely to occur as a result of", "o": ["flying on instruments only, if you accidentally enter a cloud while in flight", "avoiding looking at instruments for reference if you accidentally enter a cloud while in flight", "avoiding fast head movements when no external horizon is visible", "only looking outside the cockpit on a sunny day with no cloud"], "a": 1}, {"t": "Revision Test 5", "n": 27, "q": "A pilot experiencing spatial disorientation in IMC should", "o": ["avoid head and eye movements", "scan all instruments", "fixate on one instrument", "concentrate on outside visual cues"], "a": 1}, {"t": "Revision Test 5", "n": 28, "q": "When on approach to a long wide runway with terrain which slopes down to the landing threshold, the pilot may feel that he/she is", "o": ["low on the approach path resulting in a tendency to overshoot", "high on the approach path resulting in a tendency to overshoot", "low on the approach path resulting in a tendency to undershoot", "high on the approach path resulting in a tendency to undershoot"], "a": 0}, {"t": "Revision Test 5", "n": 29, "q": "On approach to land on a runway at night with an over water approach a pilot is likely to perceive that the runway is", "o": ["further away than it really is and that the approach is too low resulting in an overshoot", "further away than it really is and that the approach is too high causing an undershoot", "closer than it really is and that the approach is too low resulting in an overshoot", "closer than it really is and that the approach is too high causing an undershoot"], "a": 3}, {"t": "Revision Test 5", "n": 30, "q": "The most important cue used by a pilot in judging height is", "o": ["aircraft attitude", "runway length", "texture flow on the ground", "ground illumination intensity from landing light"], "a": 2}, {"t": "Revision Test 5", "n": 31, "q": "A disoriented pilot should", "o": ["vigorously seek external visual cues", "avoid head movements", "combine flight instrument indications with external visual clues", "roll the aircraft into a rate one level turn and maintain the turn until re-oriented"], "a": 1}, {"t": "Revision Test 5", "n": 32, "q": "A pilot is most likely to fly an approach which is too low when the approach is made", "o": ["the runway is wider than usual", "the runway lights are dimmer than usual", "the runway slopes down from the aiming point", "the runway is shorter than usual"], "a": 1}, {"t": "Revision Test 5", "n": 33, "q": "Disorientation is a condition which exists when", "o": ["there is not enough visual information available to the brain", "there is insufficient information available from visual, vestibular and proprioceptive cues", "the body is subjected to rapid accelerations", "there is conflict of information from visual, vestibular and proprioceptive cues"], "a": 3}, {"t": "Revision Test 5", "n": 34, "q": "Information from the eyes, ears combine with proprioceptive information to give the body a sense of", "o": ["equilibrium", "situational awareness", "navigation position", "vertigo"], "a": 0}, {"t": "Revision Test 5", "n": 35, "q": "During take-off on a dark night it is important during the initial climb out to", "o": ["seek as many visual cues as possible from outside the cockpit", "keep checking the instrument indications with outside information", "concentrate only on the instruments to maintain the aircraft's attitude", "fly by 'feel' as much as possible"], "a": 2}, {"t": "Revision Test 5", "n": 36, "q": "When maintaining the correct approach path to land on a runway which is shorter than usual you may", "o": ["think you are low and therefore tend to overshoot", "think you are high and therefore tend to overshoot", "think you are low and therefore tend to undershoot", "think you are high and therefore tend to undershoot"], "a": 0}, {"t": "Exercise 7", "n": 1, "q": "The transfer of oxygen to the blood stream during respiration depends most directly upon", "o": ["the breathing rate", "the partial pressure of oxygen within the lungs", "the percentage of lung capacity achieved with each breath (depth of breathing)", "the volume of oxygen inhaled with each breath"], "a": 1}, {"t": "Exercise 7", "n": 2, "q": "The component of blood which is most directly involved in the transport of oxygen throughout the body is", "o": ["the plasma", "haemoglobin", "the white blood cells", "the red blood cells"], "a": 1}, {"t": "Exercise 7", "n": 3, "q": "When suffering from hypoxia at high level in an unpressurised aircraft, the pilot or passengers feel no unpleasant suffocating sensation because", "o": ["in the absence of physical exertion, there is no change in the carbon dioxide level in the blood so the brain does not respond", "there is a subconscious increase in breathing rate to compensate for the dropping ambient atmospheric pressure", "the heart rate increases to increase the blood flow to the brain to compensate for the dropping ambient atmospheric pressure", "the drop in partial pressure of oxygen is accompanied by a similar drop in the partial pressure of carbon dioxide"], "a": 0}, {"t": "Exercise 7", "n": 4, "q": "If a pilot suspects that he/she is suffering the effects of hypoxia, the most appropriate remedy would be", "o": ["voluntarily increase the breathing rate to increase the oxygen uptake", "voluntarily increase the depth of breathing to induce more oxygen into the lungs", "voluntarily increase both the rate and depth of breathing", "use supplemental oxygen or descend immediately to a lower level"], "a": 3}, {"t": "Exercise 7", "n": 5, "q": "In the event of a sudden loss of cabin pressure at 30000 ft, the Effective Performance Time [EPT] for a pilot without supplemental oxygen would be approximately", "o": ["5 minutes", "2 minutes", "1 minute", "15 seconds"], "a": 2}, {"t": "Exercise 7", "n": 6, "q": "Which of the following is not normally a symptom of hypoxia?", "o": ["cyanosis", "a feeling of euphoria", "severe headache", "erratic behaviour"], "a": 2}, {"t": "Exercise 7", "n": 7, "q": "CAO 20.4.7 requires that supplemental oxygen be provided and used by the pilot at all times during flight above", "o": ["20000 feet", "10000 feet", "14000 feet", "8000 feet"], "a": 1}, {"t": "Exercise 7", "n": 8, "q": "One of the effects of hypoxia is a degradation of night vision. This effect begins at about", "o": ["4000 feet", "10000 feet", "14000 feet", "20000 feet"], "a": 0}, {"t": "Exercise 7", "n": 9, "q": "Each passenger must be provided with supplemental oxygen for all of the time at which an unpressurised aircraft is operating above", "o": ["20000 feet", "10000 feet", "14000 feet", "8000 feet"], "a": 2}, {"t": "Exercise 7", "n": 10, "q": "Which of the following will increase susceptibility to hypoxia?", "o": ["smoking and alcohol", "anaemia", "cold and fatigue", "all of these"], "a": 3}, {"t": "Exercise 7", "n": 11, "q": "The average time of useful consciousness for a passenger sitting quietly following a rapid decompression at 30000 feet is closest to", "o": ["3 minutes", "5 minutes", "1 minute", "10 minutes"], "a": 0}, {"t": "Exercise 7", "n": 12, "q": "Oxygen is transported around the body by", "o": ["haemoglobin", "white blood cells", "plasma", "the nervous system"], "a": 0}, {"t": "Exercise 7", "n": 13, "q": "The average time of useful consciousness while engaged in moderate activity following a rapid decompression at 25000 feet is", "o": ["1 minute", "3 minutes", "5 minutes", "10 minutes"], "a": 1}, {"t": "Exercise 7", "n": 14, "q": "A heavy smoker will suffer the effects of hypoxia at a lower altitude than a non-smoker. While flying at an altitude of 5000 feet, a heavy smoker could be experiencing the same degree of hypoxia as a non-smoker at", "o": ["5000 feet", "10000 feet", "15000 feet", "20000 feet"], "a": 1}, {"t": "Exercise 7", "n": 15, "q": "Hypoxia may be caused by", "o": ["flying with a head cold", "flying at an altitude where the partial pressure of oxygen is too low", "breathing too quickly and/or too deeply for the requirements of the body", "flying after a period of underwater diving"], "a": 1}, {"t": "Exercise 7", "n": 16, "q": "Hypoxia is always accompanied by", "o": ["high temperature and vomiting", "dizziness", "profuse sweating", "a degradation in the performance of a pilot"], "a": 3}, {"t": "Exercise 7", "n": 17, "q": "Which of the following would not increase the likelihood of suffering the effects of hypoxia at a relatively low altitude", "o": ["flying at night", "flying with an elevated blood alcohol level", "flying in a poor state of physical fitness", "smoking heavily"], "a": 0}, {"t": "Exercise 7", "n": 18, "q": "The time of useful consciousness [Effective Performance Time - EPT] while cruising at an altitude of 20 000 feet and sitting quietly would be about", "o": ["1 minute", "20 minutes", "15 minutes", "5 minutes"], "a": 1}, {"t": "Exercise 7", "n": 19, "q": "The symptoms of hyperventilation are", "o": ["quite similar to those of hypoxia", "quite different to those of hypoxia", "a blue colouring of the lips and fingernails (cyanosis)", "profuse sweating"], "a": 0}, {"t": "Exercise 7", "n": 20, "q": "Above which altitude does it first become necessary for the pilot of an unpressurised aircraft to breathe pure [100%] oxygen?", "o": ["10000 feet", "33700 feet", "40000 feet", "45000 feet"], "a": 1}, {"t": "Exercise 7", "n": 21, "q": "Above which altitude does it first become necessary for the pilot of an unpressurised aircraft to breathe pure [100%] oxygen under pressure?", "o": ["10000 feet", "20000 feet", "40000 feet", "45000 feet"], "a": 2}, {"t": "Exercise 7", "n": 22, "q": "Cyanosis can be identified by", "o": ["rapid breathing", "a blue coloration of the finger-nail beds and lips", "slurred speech", "difficulty in maintaining balance"], "a": 1}, {"t": "Exercise 7", "n": 23, "q": "Compared to sitting quietly in a normal cockpit environment, the uptake of oxygen when under stress of coping with a life-threatening emergency can be increased by a factor of", "o": ["2", "10", "20", "5"], "a": 2}, {"t": "Exercise 7", "n": 24, "q": "The most likely immediate effect of a sudden decompression at 35 000 feet would be", "o": ["pains in the stomach", "the forced exhalation of breath", "gasping for air", "dizziness"], "a": 1}, {"t": "Exercise 7", "n": 25, "q": "A regular smoker at sea-level can be assumed to be at an effective altitude of", "o": ["2000 feet", "5000 feet", "8000 feet", "10000 feet"], "a": 1}, {"t": "Exercise 7", "n": 26, "q": "The average time of useful consciousness when engaged in moderate activity following a rapid decompression at 20000 ft is closest to", "o": ["10 minutes", "5 minutes", "3 minutes", "1 minute"], "a": 1}, {"t": "Exercise 7", "n": 27, "q": "Oxygen is transported around the body in the blood by", "o": ["haemoglobin", "white blood cells", "leukocytes", "plasma"], "a": 0}, {"t": "Exercise 7", "n": 28, "q": "The average time of useful consciousness when engaged in moderate activity following a decompression at 30000 ft is closest to", "o": ["30 seconds", "1 minute", "5 minutes", "10 minutes"], "a": 1}, {"t": "Exercise 7", "n": 29, "q": "A smoker who has an elevated level of carbon monoxide in the blood stream may suffer a greater reduction in performance as altitude increases compared to a non smoker. This is because at a cabin altitude of 5000 ft, the physiological altitude of a smoker with a 5% carboxyhaemoglobin saturation can be up to", "o": ["7000 ft", "10000 ft", "15000 ft", "20000 ft"], "a": 1}, {"t": "Exercise 7", "n": 30, "q": "Hypoxia may be caused by", "o": ["flying with a head cold", "flying at an altitude where the partial pressure of oxygen is too low", "breathing too quickly for the amount of activity", "flying after scuba diving"], "a": 1}, {"t": "Exercise 7", "n": 31, "q": "Hypoxia is always accompanied by", "o": ["unconsciousness", "dizziness", "a deterioration in flying performance", "perspiration"], "a": 2}, {"t": "Exercise 7", "n": 32, "q": "Susceptibility to hypoxia will not be increased by", "o": ["flying at night", "flying with a hangover", "lack of physical fitness", "cigarette smoking", "excessively cold environment"], "a": 0}, {"t": "Exercise 7", "n": 33, "q": "The time of useful consciousness while cruising at FL200 following an oxygen supply failure and while sitting quietly is usually closest to", "o": ["1 minute", "20 minutes", "15 minutes", "10 minutes"], "a": 1}, {"t": "Exercise 7", "n": 34, "q": "Under what circumstances should 100% oxygen be given to a passenger", "o": ["if they are hyperventilating", "if they are suffering from the bends", "if they are suffering from carbon monoxide poisoning", "if they are suffering from hypoglycaemia"], "a": 2}, {"t": "Exercise 7", "n": 35, "q": "Hyperventilation", "o": ["produces a chemical imbalance in the body which may give rise to symptoms that are often mistaken for hypoxia", "is not likely if a person is breathing from supplementary oxygen", "cannot lead to unconsciousness", "is usually due to factors other than anxiety or apprehension"], "a": 0}, {"t": "Exercise 7", "n": 36, "q": "One method recommended to help overcome 'hyperventilation' is to", "o": ["breathe more deeply and at a slightly faster rate", "hold your breath, or try to breathe more slowly", "hold your nose and blow out hard", "avoid reading 'Penthouse' during class"], "a": 1}, {"t": "Exercise 7", "n": 37, "q": "If you are experiencing feelings of warmth and well being, associated with blue discolouration around the lips and fingernails, you may be suffering from", "o": ["hyperventilation", "the 'bends'", "CO poisoning", "hypoxia"], "a": 3}, {"t": "Exercise 7", "n": 38, "q": "Many of the symptoms of hypoxia and hyperventilation appear the same. To assist in deciding the condition being experienced", "o": ["only hypoxia causes tingling sensations", "only hyperventilation causes blue colouration around the extremities of the body", "only hyperventilation causes feelings of warmth and well being", "only hypoxia causes blue colouring around the lips"], "a": 3}, {"t": "Exercise 7", "n": 39, "q": "A tingling feeling in the extremities is a symptom of", "o": ["hyperventilation", "carbon monoxide poisoning", "hypoxia", "the bends"], "a": 0}, {"t": "Exercise 7", "n": 40, "q": "A voluntary reduction in the rate of respiration is a treatment for", "o": ["hyperventilation", "carbon monoxide poisoning", "hypoxia", "the bends"], "a": 0}, {"t": "Exercise 7", "n": 41, "q": "A pilot should breathe 100% oxygen under pressure above a cabin altitude of", "o": ["20000 ft", "30000 ft", "40000 ft", "45000 ft"], "a": 2}, {"t": "Exercise 7", "n": 42, "q": "As altitude is increased, the percentage of oxygen present in the atmosphere", "o": ["remains constant", "decreases", "increases", "decreases then increases"], "a": 0}, {"t": "Exercise 8", "n": 1, "q": "The average retention span of the short term memory is about", "o": ["5 to 10 seconds", "15 to 30 seconds", "1 minute", "3 minutes"], "a": 1}, {"t": "Exercise 8", "n": 2, "q": "Which of the following is true concerning the short term memory's susceptibility to error?", "o": ["it is very susceptible to error", "it is free of error", "it is almost free of error", "it is more susceptible to error in the young"], "a": 2}, {"t": "Exercise 8", "n": 3, "q": "The long term memory performs best when the information is presented", "o": ["in one large block", "as a series of unrelated single items", "by association with previous items already stored in the long term memory", "with the aid of over-head projector slides"], "a": 2}, {"t": "Exercise 8", "n": 4, "q": "Attitude is considered as incorporating three different elements; they are", "o": ["believing [cognitive], feeling [affective] and acting [behavioural]", "seeing [visual], believing [cognitive] and feeling [affective]", "seeing [visual], hearing [auditory] and feeling [affective]", "feeling [affective], acting [behavioural] and hearing [auditory]"], "a": 0}, {"t": "Exercise 8", "n": 5, "q": "The source of motivation is", "o": ["different for different individuals", "the same for everybody", "associated only with monetary gain", "associated only with personal satisfaction"], "a": 0}, {"t": "Exercise 8", "n": 6, "q": "Our attitudes are often the result of our thoughts or beliefs colouring our perception of reality", "o": ["this statement is true", "this statement is false"], "a": 0}, {"t": "Exercise 8", "n": 7, "q": "The duration of the sensory memory for sounds is approximately", "o": ["1 to 2 seconds", "2 to 4 seconds", "4 to 8 seconds", "15 to 20 seconds"], "a": 2}, {"t": "Exercise 8", "n": 8, "q": "The duration of the sensory memory for visual images is approximately", "o": ["1 second", "2 seconds", "8 seconds", "20 seconds"], "a": 0}, {"t": "Exercise 8", "n": 9, "q": "The average number of items that can be held in the short term memory is", "o": ["7", "10", "15", "20"], "a": 0}, {"t": "Exercise 8", "n": 10, "q": "One interesting characteristic of the short term memory is that it appears to be", "o": ["almost entirely acoustic", "almost entirely visual", "equally reliant on visual and acoustic inputs", "unaffected by alcohol"], "a": 0}, {"t": "Exercise 8", "n": 11, "q": "When a task has been rehearsed and drilled to the point where it can be performed with no conscious monitoring, it has become a", "o": ["motor program", "reflex action", "habit", "conditioned response"], "a": 0}, {"t": "Exercise 8", "n": 12, "q": "The four stages by which information is processed by the brain are", "o": ["decision, perception, sensation and response", "perception, sensation, response and decision", "sensation, decision, perception, and response", "sensation, perception, decision and response"], "a": 3}, {"t": "Exercise 8", "n": 13, "q": "The Performance v Arousal curve shows that", "o": ["the higher the arousal, the better the performance", "the lower the arousal, the better the performance", "the best performance is achieved at a moderate level of arousal", "performance is virtually unaffected by arousal"], "a": 2}, {"t": "Exercise 8", "n": 14, "q": "As arousal increases from boredom to anxiety, the performance of a particular task is likely to", "o": ["increase continuously", "decrease continuously", "decrease then increase", "increase then decrease"], "a": 3}, {"t": "Exercise 8", "n": 15, "q": "Which of the following is likely to have the most lasting effect on pilot motivation?", "o": ["high wages", "promotion", "threat of dismissal", "job satisfaction"], "a": 3}, {"t": "Exercise 8", "n": 16, "q": "The main function of the semantic memory is to", "o": ["recognise names and faces", "recognise visual symbols, codes or logos", "remember episodes of cause and effect that have occurred in the past", "remember skills that have been learned by constant repetition"], "a": 1}, {"t": "Exercise 8", "n": 17, "q": "The main function of the episodic memory is to", "o": ["recognise names and faces", "recognise visual symbols, codes or logos", "remember episodes of cause and effect that have occurred in the past", "remember skills that have been learned by constant repetition"], "a": 2}, {"t": "Exercise 8", "n": 18, "q": "A personality which features cool headed self assurance would be classified as", "o": ["stable extrovert", "unstable extrovert", "stable introvert", "unstable introvert"], "a": 2}, {"t": "Exercise 8", "n": 19, "q": "Deference is one of the 'hazardous thoughts' which affect human behaviour and decision making. It refers to", "o": ["the tendency to resist authority and object to regulation", "the tendency to commit to a particular course of action without considering the consequences", "the tendency to blame another person or circumstance for whatever goes wrong", "the tendency to believe that 'it can't happen to me'"], "a": 2}, {"t": "Exercise 8", "n": 20, "q": "Which of the following is true of the brain's mental capacity?", "o": ["the brain can consciously think upon several items at the same time", "the brain can carry out only one motor program at a time", "the brain can carry out more than one motor program at a time", "the brain cannot carry out a motor program without consciously monitoring the actions involved"], "a": 2}, {"t": "Exercise 8", "n": 21, "q": "Long term memory is enhanced if the information is presented", "o": ["in massive chunks", "in limited quantity", "by association with existing stored information", "with continuous repetition"], "a": 2}, {"t": "Exercise 8", "n": 22, "q": "When a manual task has been rehearsed and practised it requires less conscious attention to perform than a new task. This is because the well practised task is performed via a", "o": ["cerebellum loop", "motor program", "parasympathetic memory channel", "mental picture"], "a": 1}, {"t": "Exercise 8", "n": 23, "q": "Concerning the rate of information processing and the attention range of a pilot flying with a critically ill patient diverting to an emergency alternate in poor weather compared to a typical flight", "o": ["the rate of information processing will increase and the attention range will decrease", "the rate of information processing will decrease and the attention range will increase", "the rate of information processing will increase and the attention range will increase", "the rate of information processing will decrease and the attention range will decrease"], "a": 0}, {"t": "Exercise 8", "n": 24, "q": "Professionals in the field of aviation workload assess pilot's mental workload in order to determine", "o": ["the minimum rest period required", "the maximum duty period which may be sustained", "the maximum flight time which may be sustained", "how much spare mental capacity is available to allow a pilot to cope in an emergency"], "a": 3}, {"t": "Exercise 8", "n": 25, "q": "A motor program is most likely to have a problem at the stage of", "o": ["initiation", "execution", "learning", "formulation"], "a": 0}, {"t": "Exercise 8", "n": 26, "q": "A goal oriented person who is not people oriented will relate to others in a way that appears", "o": ["friendly to associates and subordinates", "autocratic to subordinates and associates", "cool to subordinates and associates", "friendly to associates but aggressive to subordinates"], "a": 1}, {"t": "Exercise 8", "n": 27, "q": "According to Maslow's Hierarchy of human needs, the motivating factor on the highest level of the hierarchy is", "o": ["monetary rewards/salary", "responsibility/job satisfaction", "job security", "working relationships with colleagues", "working conditions"], "a": 1}, {"t": "Exercise 8", "n": 28, "q": "A person is able to best recall information from short term memory that is", "o": ["visual and clustered", "audible and clustered", "visual and separate", "audible and separate"], "a": 1}, {"t": "Exercise 8", "n": 29, "q": "A Captain on a flight disables the overspeed warning system by pulling the circuit breaker. The First Officer asks the Captain why and he replies that it will enable them to increase speed and save time and that he knows what he is doing. The First Officer then shrugs his shoulders and says nothing more about the decision. The First Officer's attitude in this case may described as", "o": ["anti-authoritarian", "one of vulnerability", "assertive", "deferent"], "a": 3}, {"t": "Exercise 8", "n": 30, "q": "A large transport jet aircraft suffered total hydraulic system failure when an engine explosion severed the hydraulic lines of all three hydraulic systems leaving the aircraft with no primary flight control response. The crew were able to crash land the aircraft using asymmetric thrust from the remaining engines. Two thirds of the people on board (184 out of 285) survived the crash. The crew were able to control an apparently uncontrollable aircraft by using knowledge from", "o": ["short term memory", "long term memory", "motor programs", "semantic memory"], "a": 1}, {"t": "Exercise 8", "n": 31, "q": "The ideal level of arousal for a pilot prior to completing a flight proficiency check is", "o": ["very high", "high", "very low", "low to moderate", "moderate"], "a": 4}, {"t": "Exercise 8", "n": 32, "q": "Regarding motivation", "o": ["people may be motivated by different forces while apparently behaving in the same way", "everyone is motivated by the same basic factors", "motivation drives a person to behave in a socially acceptable way", "drives are innate in all individuals while motivation is extrinsic"], "a": 0}, {"t": "Exercise 8", "n": 33, "q": "The human brain may be considered in some ways to be similar to a computer. It processes inputs in the order of", "o": ["perception, reaction, review, reassess", "sensation, perception, decision, response", "induction, review, processing, revision", "processing, responding, perceiving, behaving"], "a": 1}, {"t": "Exercise 8", "n": 34, "q": "A pilot who is anxious about night flying is conducting an approach at 2300 hours local time to an airport in poor weather. In this situation his/her level of arousal is likely to be", "o": ["low", "high", "optimum", "extreme"], "a": 1}, {"t": "Exercise 8", "n": 35, "q": "Cruising on a long flight over featureless terrain a pilot's information processing is likely to suffer from", "o": ["increased rate and decreased range", "increased rate and increased range", "decreased rate and decreased range", "decreased rate and increased range"], "a": 3}, {"t": "Exercise 8", "n": 36, "q": "The brain processes information through four stages. In order these are", "o": ["decision, perception, sensation, response", "perception, sensation, decision, response", "sensation, response, perception, decision", "sensation, perception, decision, response"], "a": 3}, {"t": "Exercise 8", "n": 37, "q": "The factors by which attitude may be said to be influenced are", "o": ["cognitive, affective and behavioural", "behavioural, psychological and physiological", "cognitive, environmental and mental", "affective, effective and reflective"], "a": 0}, {"t": "Exercise 8", "n": 38, "q": "Motivation is derived from", "o": ["the same sources for all individuals", "different sources for different individuals", "extrinsic factors only", "intrinsic factors only"], "a": 1}, {"t": "Exercise 8", "n": 39, "q": "The Hertzberg Two Factor Theory proposes positive motivating factors in job satisfaction like achievement and recognition. Negative factors causing dissatisfaction are hygiene factors. An example of a hygiene factor is", "o": ["advancement", "responsibility", "staff relations", "the type of work"], "a": 2}, {"t": "Exercise 8", "n": 40, "q": "After takeoff a pilot notices oil leaking from one of the engines due to a loose oil cap and immediately shuts down the engine but fails to feather the propeller. The aircraft crashes as a result. The actions of the pilot in this situation are the result of an attitude of", "o": ["invulnerability", "macho", "resignation", "impulsiveness"], "a": 3}, {"t": "Exercise 8", "n": 41, "q": "An instructor who lets a student deviate significantly from a standard approach, hoping they will improve uses an interactive style which may be categorised as", "o": ["P+ G+", "P+ G-", "P- G-", "P- G+"], "a": 1}, {"t": "Exercise 8", "n": 42, "q": "The personality type most likely to have an accident as a result of risk taking is the", "o": ["stable introvert", "stable extrovert", "anxious introvert", "anxious extrovert"], "a": 3}, {"t": "Exercise 8", "n": 43, "q": "The typical number of separate unrelated items which can be retained in the working memory is", "o": ["3", "7", "12", "20"], "a": 1}, {"t": "Exercise 8", "n": 44, "q": "During periods of high stress, a pilots attention is likely to be", "o": ["selective sequential", "divided parallel", "selective parallel", "divided sequential"], "a": 0}, {"t": "Exercise 8", "n": 45, "q": "The technique of 'chunking' may be used to", "o": ["improve the capacity of the short-term [working] memory", "improve the capacity of the long-term memory", "improve the capacity of the sensory memory", "increase the rate at which information can be processed"], "a": 0}, {"t": "Exercise 9", "n": 1, "q": "During which period of the day will the average person find it most difficult to stay awake?", "o": ["midday to 2 pm", "10 pm to 2 am", "3 am to 5 am", "9 am to midday"], "a": 2}, {"t": "Exercise 9", "n": 2, "q": "What is the average rate at which the body resynchronises to local time after travelling through a large change in longitude?", "o": ["6 hours per day", "8 hours per day", "4 hours per day", "1.5 hours per day"], "a": 3}, {"t": "Exercise 9", "n": 3, "q": "After a non-stop flight through a 90 degree change in longitude, the time required for the body rhythms to fully readjust to the destination's local time would be closest to", "o": ["1 day", "4 days", "10 days", "12 days"], "a": 1}, {"t": "Exercise 9", "n": 4, "q": "On the Holmes/Rahe scale of recent experience which of the following is rated as being the least stressful?", "o": ["change in eating habits", "trouble with the boss at work", "retirement", "death of a close family member"], "a": 0}, {"t": "Exercise 9", "n": 5, "q": "The Holmes/Rahe research showed that stress levels can be increased by changes in life style or conditions and any change, for the worse or for the better can increase stress levels", "o": ["this statement is true", "this statement is false"], "a": 0}, {"t": "Exercise 9", "n": 6, "q": "Which of the following is true regarding transmeridian dysynchronism [jet lag]", "o": ["flying east requires the body's rhythms to advance", "flying west requires the body's rhythms to advance", "flying east requires the body's rhythms to delay", "flying north in summer requires the body's rhythms to advance"], "a": 0}, {"t": "Exercise 9", "n": 7, "q": "Which of the following is true of the circadian rhythm for a normal person?", "o": ["it always follows an exact 24 hour cycle", "it tends to revert to a 25 hour cycle when the subject is isolated in an artificial environment", "it speeds up in summer and slows down in winter", "the body finds it easier to speed it up than it does to slow it down"], "a": 1}, {"t": "Exercise 9", "n": 8, "q": "Which of the following would be most vulnerable to fatigue?", "o": ["clear thinking", "hovering a helicopter", "seeing and hearing clearly", "speaking clearly"], "a": 0}, {"t": "Exercise 9", "n": 9, "q": "The lapse in performance standards which occurs daily in mid afternoon is known as", "o": ["the post-meridian depression", "the post-prandial dip", "the siesta syndrome", "the afternoon lapse phase"], "a": 1}, {"t": "Exercise 9", "n": 10, "q": "Which of the following describe, in order of occurrence, the three phases of the body's adaptation to stress?", "o": ["resistance, alarm, collapse", "collapse, resistance, alarm", "resistance, collapse, alarm", "alarm, resistance, collapse"], "a": 3}, {"t": "Exercise 9", "n": 11, "q": "Which of the following describes the effect of excess stress on the attention span?", "o": ["the attention span is reduced", "the attention span is increased", "the attention span is not affected by excess stress", "the attention span reduces initially but soon returns to normal"], "a": 0}, {"t": "Exercise 9", "n": 12, "q": "Sleep is likely to be most beneficial when", "o": ["you go to bed as late as possible", "the sleep period coincides with the circadian sleep cycle", "the bed room is kept at body temperature", "you go to bed as early as possible"], "a": 1}, {"t": "Exercise 9", "n": 13, "q": "Chronic fatigue differs from acute fatigue in that", "o": ["it can usually be relieved by a good night's sleep", "it is always the result of overexertion", "it is easily treated by sleeping pills", "it is usually life-style related and the cause may not be obvious"], "a": 3}, {"t": "Exercise 9", "n": 14, "q": "Tasks become more likely to be affected by fatigue as they become", "o": ["more monotonous and less complicated", "less monotonous and less complicated", "more monotonous and more complicated", "less monotonous and more complicated"], "a": 2}, {"t": "Exercise 9", "n": 15, "q": "Which of the following is true of acute stress?", "o": ["it always has a negative effect on performance and should be avoided at all costs", "it has no affect on performance", "moderate levels of stress can enhance the dynamics of coping with a particular situation", "the higher the stress levels, the better the performance becomes"], "a": 2}, {"t": "Exercise 9", "n": 16, "q": "A common source of human error is the false hypothesis. Under certain conditions this is more or less likely than at other times. From the following list, select the situation least likely to result in a person arriving at a false hypothesis", "o": ["when expectancy of an event is high", "after a period of intense concentration", "during a period of preoccupation with another problem", "during normal operations"], "a": 3}, {"t": "Exercise 9", "n": 17, "q": "The process of decision making involves which order of steps?", "o": ["consider the facts; define the problem; consider the solutions; act; consider the result", "define the problem; consider the facts; consider the solutions; act; consider the result", "consider the facts; consider the solutions; define the problem; act; consider the result", "define the problem; consider the solutions; consider the facts; act; consider the result"], "a": 1}, {"t": "Exercise 9", "n": 18, "q": "A pilot who was worried about the condition of the left engine in a twin-engine aeroplane experienced an engine failure on take-off and feathered the left engine, only to find that it was the right engine which failed. This pilot has been a victim of", "o": ["expectancy producing a false hypothesis", "a motor program producing a false hypothesis", "expectancy producing a mental block", "stress producing a memory loss"], "a": 0}, {"t": "Exercise 9", "n": 19, "q": "The illustration below serves to illustrate the perceptual error known as [PARIS IN THE SPRING]", "o": ["the Coriolis illusion", "the autokinetic illusion", "somatogravic illusion", "mind set"], "a": 3, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCADRAUUDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBQYEAwf/xABBEAABBAEDAwIDBQYDBQkBAAABAAIDEQQFITEGQVESYRNxgQcUIpGxFRYyocHRQlJiIyQzZOEXJjQ1Q1NUcvCD/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/APpPfflMn0tJN0AsxJ1BnzPim0vCOTAJjHIz0kOABokHgfJaN5ccdxFscWki+QaQcEuu4EWlyai97zjxGnEMNg3XCM7XcXBbgulbIW5r2tjLW2LIsX4WYlzsnUfs31SXMkEkzPW0uDQNgRWwXv1C4f
