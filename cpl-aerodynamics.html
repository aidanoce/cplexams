<html lang="en">
<head>

<title>CPL Aerodynamics</title>
<style>
  :root {

    --good-bg: #dcfce7; --sky-top: #d6e8fb; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1c2130; --text: #e6e9f0; --muted: #9aa3b5;
      --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --border: #2f3646;
      --good-bg: #163d26; --sky-top: #16203a; --bad-bg: #4a1d1d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1c2130; --text: #e6e9f0; --muted: #9aa3b5;
    --accent: #60a5fa; --good: #4ade80; --bad: #f87171; --border: #2f3646;
    --good-bg: #163d26; --sky-top: #16203a; --bad-bg: #4a1d1d;
  }
  * { box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, var(--sky-top) 0, var(--bg) 420px) var(--bg);
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><g fill='%23708090' transform='rotate(-20 90 90)'><path d='M90 22 C94 22 96 26 96 32 L96 70 L150 96 L150 106 L96 96 L94 136 L110 148 L110 156 L90 150 L70 156 L70 148 L86 136 L84 96 L30 106 L30 96 L84 70 L84 32 C84 26 86 22 90 22 Z'/></g></svg>");
    background-size: 180px 180px; opacity: .10;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 0 40px; position: relative; z-index: 1; }
  h1 { font-size: 1.35rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  select, button {
    font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .progress { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .qtext { font-size: 1.05rem; margin: 6px 0 14px; white-space: pre-line; }
  .qhead { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .star { font-size: 1.5rem; background: none; border: none; color: var(--muted); padding: 0 4px; line-height: 1; }
  .star.on { color: #f5b301; }
  .topic { font-size: .8rem; color: var(--accent); margin: -6px 0 10px; }
  .expl { margin-top: 8px; color: var(--text); font-size: .93rem; }
  .qimg { max-width: 100%; display: block; margin: 6px 0 12px; background: #fff; border-radius: 8px; padding: 6px; }
  .qnote { font-size: .8rem; color: var(--muted); font-style: italic; margin-top: -8px; margin-bottom: 12px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .98rem; width: 100%;
  }
  .opt .letter { display: inline-block; width: 26px; font-weight: 600; color: var(--muted); }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .feedback { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }
  .feedback.good { display: block; background: var(--good-bg); color: var(--good); }
  .feedback.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .score-big { font-size: 2.2rem; font-weight: 700; margin: 6px 0; }
  .missed { margin-top: 12px; }
  .missed li { margin-bottom: 10px; }
  .hidden { display: none !important; }
  .toggle { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 6px; }
  .theme-btn { margin-left: auto; }
  .footer-note { color: var(--muted); font-size: .8rem; margin-top: 16px; }

  .qdiag { background: var(--card); border-radius: 8px; margin: 4px 0 14px; }
  .qdiag svg { width: 100%; height: auto; display: block; }

  .hub-head { display:flex; align-items:center; gap:10px; }
  .cards { display:grid; grid-template-columns: 1fr; gap:14px; margin-top:8px; }
  @media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { text-align:left; background: var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; cursor:pointer; color:var(--text); font: inherit; }
  .card:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card svg { width:100%; height:auto; display:block; border-radius:10px; background: var(--sky-top); margin-bottom:12px; }
  .card h2 { font-size:1.1rem; margin:0 0 4px; }
  .card p { margin:0; color:var(--muted); font-size:.9rem; }
  .count { display:inline-block; margin-top:8px; color:var(--accent); font-size:.85rem; font-weight:600; }
  .card-img { width:100%; height:auto; display:block; border-radius:10px; background:var(--sky-top); margin-bottom:12px; }
  .badge { display:inline-block; margin-top:8px; margin-left:6px; padding:2px 8px; border-radius:999px; background:var(--accent); color:#fff; font-size:.75rem; font-weight:600; }
  .study-item { border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:12px 0; background:var(--card); }
  .study-item summary { cursor:pointer; font-weight:600; }
  .study-img { width:100%; height:auto; display:block; border-radius:8px; margin:10px 0; background:#fff; }
  .study-body { line-height:1.5; }
  .back { margin-bottom:12px; }
  .app-head h1 { font-size:1.25rem; }
.site-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 8px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.site-tabs a,.site-tabs span{padding:8px 18px;border-radius:8px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem;background:var(--bg)}

<script>
function shuffleOpts(q) {
  // Shuffle the A-D options (and the correct answer with them). Questions whose options refer to other options stay as written.
  const refers = q.o.some(x => /\b(all|none|both|neither)\b|\[[a-e]\]|\b[a-e]\)|\bas above\b|\babove\b/i.test(x));
  if (refers || q.o.length < 2) return q;
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

  {t:"Test 1",n:16,q:"The speed which produces maximum rate of climb for a given weight and power is",o:["The best lift/drag ratio speed","The speed best possible for that power setting","The speed which produces maximum thrust","The speed at which maximum surplus power is available over and above that required for level flight at that speed"],a:3},
  {t:"Test 1",n:17,q:"The effect of increasing headwind component during a climb at constant indicated air speed and constant power is",o:["Rate of climb is increased while angle of climb is unchanged","Rate of climb is unchanged while angle of climb is increased","Rate of climb is decreased while angle of climb is unchanged","Rate of climb is unchanged while angle of climb is decreased"],a:1},
  {t:"Test 1",n:18,q:"The effect of increased weight on the gliding range of an aeroplane is",o:["Gliding range is reduced if angle of attack is kept constant","Gliding range is not affected if angle of attack is increased","Gliding range is not affected if angle of attack is kept constant","Gliding range is increased if angle of attack is reduced"],a:2},
  {t:"Test 1",n:19,q:"Compared to still air performance, when a tail wind exists for a descent at constant indicated air speed",o:["Both rate and angle of descent are changed","Rate of descent is changed but angle of descent is not","Rate of descent is unchanged but angle of descent is decreased","Rate and angle of descent are both decreased"],a:2},
  {t:"Test 1",n:20,q:"A sudden drop in head wind component during an approach to land will initially cause",o:["A reduction in indicated air speed for the same nose attitude","A reduction in indicated air speed and a higher nose attitude","An increase in indicated air speed and a lower nose attitude","An increase in indicated air speed for the same nose attitude"],a:0},
  {t:"Test 1",n:21,q:"An aircraft stalls at 50 kt IAS in level flight at a particular weight. In a 45° banked level balanced turn, the indicated stalling speed would be approximately",o:["The same","60 kt","70 kt","75 kt"],a:1},
  {t:"Test 1",n:22,q:"A heavy aircraft and a light aircraft are turning at the same indicated air speed and angle of bank. If both aircraft are at the same altitude, the radius of turn",o:["Is greater for the heavy aircraft","Is less for the heavy aircraft","Depends upon the weight","Is the same"],a:3},
  {t:"Test 1",n:23,q:"For a given aircraft, a turn at a given bank and indicated air speed would",o:["Have a greater radius if altitude was increased","Have the same radius at all altitudes","Have a greater radius if altitude was decreased","Have a smaller radius if altitude was increased"],a:1},
  {t:"Test 1",n:24,q:"Tail wheel aircraft are more prone to ground looping than nose wheel aircraft because",o:["Pilot visibility is reduced","The centre of gravity is behind the main wheels","The centre of gravity is ahead of the main wheels","The wings are at a higher angle of attack"],a:1},
  {t:"Test 1",n:25,q:"Which of the following could be attributed to ground effect?",o:["The aircraft may become airborne at a speed well below a safe climbing speed","The aircraft may become difficult to rotate","The float between round out and touch down may be shorter than usual","The initial climb, just after take off, will be greatly improved"],a:0},
  {t:"Test 1",n:26,q:"A tendency to yaw is noticed as the tail is lifted to the flying attitude during the take off run in a tailwheel aircraft. This is due to",o:["Slipstream effect","Engine torque","Asymmetric blade effect","Gyroscopic precession"],a:3},
  {t:"Test 1",n:27,q:"Stalling speed is increased by an increase in",o:["Flap extension","Power","Load factor","Angle of attack"],a:2},
  {t:"Test 1",n:28,q:"Climbing an aeroplane at a higher speed than that recommended for the best rate of climb will result in",o:["An increased rate and decreased angle of climb","An increased rate and angle of climb","A decreased rate and angle of climb","A decreased rate and increased angle of climb"],a:2},
  {t:"Test 1",n:29,q:"A thin coating of clear ice on the leading edge of an aerofoil of an aircraft in flight",o:["Decreases lift and increases drag by changing the aerofoil characteristics","Has no particular effect as the decrease in drag is accompanied by a decrease in lift","Increases the efficiency of the aerofoil by reducing drag","Increases lift by increasing the camber of the aerofoil"],a:0},
  {t:"Test 1",n:30,q:"The recommended speed for flight in turbulent conditions is",o:["A speed which allows flap to be lowered for better forward visibility","As fast as possible to minimise the effect of a gust induced stall","A speed which gives a compromise between excessive structural loads and the stall","As slow as possible to minimise the loads on the aircraft structure"],a:2},
  {t:"Test 1",n:31,q:"An aerofoil is said to be at its stalling angle if any increase or decrease in angle of attack causes",o:["More drag","A lower lift/drag ratio","Less lift","Less lift and less drag"],a:2},
  {t:"Test 1",n:32,q:"How will lift and drag vary if the angle of attack of an aerofoil is increased from 4° up to the stalling angle?",o:["Lift will increase and drag will decrease","Lift and drag will both increase","Lift will decrease and drag will increase","Lift and drag will both decrease"],a:1},

  {t:"Test 2",n:1,q:"The angle of attack of an aerofoil is defined as the angle between",o:["The chord line and the longitudinal axis","The aircraft's nose and the natural horizon","The chord line and the relative airflow","The aircraft indicator and the horizon bar on the artificial horizon"],a:2},
  {t:"Test 2",n:2,q:"An angle of attack increase in straight and level flight is accompanied by",o:["An increase in the total reaction and a forward movement in the centre of pressure","An increase in the total reaction and an aft movement in the centre of pressure","A decrease in the total reaction and a forward movement in the centre of pressure","A forward movement in the total reaction and no change in the centre of pressure"],a:0},
  {t:"Test 2",n:3,q:"If indicated air speed is kept constant and angle of attack is increased",o:["Induced drag will remain the same but parasite drag will increase","Both induced drag and parasite drag will increase","Induced drag will increase but parasite drag will remain the same","Induced drag will increase and parasite drag will decrease"],a:1},

  {t:"Test 2",n:8,q:"If flap is lowered during an approach and nose attitude and power are kept constant",o:["Airspeed and angle of descent will both increase","Airspeed and angle of descent will both decrease","Air speed will decrease and angle of descent will remain constant","Air speed will decrease and angle of descent will increase"],a:3},
  {t:"Test 2",n:9,q:"During the pull out from a dive, the stall compared to level flight, will occur at",o:["The same indicated air speed but a lower angle of attack","A higher indicated air speed but a lower angle of attack","A higher indicated air speed but the same angle of attack","A lower indicated air speed but the same angle of attack"],a:2},
  {t:"Test 2",n:10,q:"Which of the following factors would produce an increase in indicated stalling speed?",o:["A decrease in air density","A decrease in head wind component","An increase in engine power","An increase in load factor"],a:3},
  {t:"Test 2",n:11,q:"Cockpit indications which would allow a pilot to differentiate between a spiral dive and a spin would be",o:["In a spin the indicated air speed would be low and unchanging","In a spin the indicated air speed would be high and rapidly increasing","In a spiral the indicated air speed would be low and unchanging","In a spiral the indicated air speed would be high initially, then steadily decreasing"],a:0},
  {t:"Test 2",n:12,q:"When flying straight and level at a particular aircraft weight,",o:["An increase in indicated air speed will require an increase in angle of attack","An increase in indicated air speed will require a decrease in angle of attack","A decrease in indicated air speed will require a decrease in angle of attack","Providing indicated air speed is kept constant, various angles of attack may be used"],a:1},
  {t:"Test 2",n:13,q:"As aircraft weight decreases with fuel burn off in straight and level flight at constant power setting",o:["Angle of attack must be decreased and indicated air speed will decrease","Angle of attack must be increased and indicated air speed will increase","Angle of attack must be decreased and indicated air speed will increase","Angle of attack must be increased and indicated air speed will decrease"],a:2},
  {t:"Test 2",n:14,q:"To achieve maximum range in a piston engine aircraft, the power that is used must",o:["Produce the lowest possible forward speed","Produce the indicated air speed corresponding to the highest lift coefficient","Produce the indicated air speed corresponding to the lowest lift coefficient","Produce the indicated air speed corresponding to minimum drag"],a:3},
  {t:"Test 2",n:15,q:"The indicated air speed which produces the maximum rate of climb in a piston engine aircraft changes as height increases. This is necessary to",o:["Maintain the maximum surplus power","Maintain the maximum surplus thrust","Maintain the minimum total drag","Maintain the maximum possible engine power"],a:0},
  {t:"Test 2",n:16,q:"When the headwind experienced during a climb suddenly decreases",o:["Angle of climb increases","Rate of climb increases","Angle of climb remains the same but rate of climb decreases","Angle of climb decreases"],a:3},
  {t:"Test 2",n:17,q:"Which of the following factors would produce a decrease in the angle of climb?",o:["A decrease in aircraft weight","An increase in surplus thrust","An increase in headwind component","A turn during the climb from upwind to downwind"],a:3},
  {t:"Test 2",n:18,q:"When flap is extended during a glide at constant indicated air speed",o:["Both rate and angle of descent will increase","Rate of descent will decrease and angle of descent will increase","Rate of descent will remain the same but angle of descent will increase","Rate of descent will increase, and angle of descent will decrease"],a:0},
  {t:"Test 2",n:19,q:"A heavy aircraft and a light aircraft of the same type are gliding into a headwind at the same lift/drag ratio. The effect on gliding range will be",o:["The heavy aircraft will glide further","The light aircraft will glide further","Both aircraft will glide the same distance","Both aircraft will suffer the same decrease in range because of the headwind"],a:0},
  {t:"Test 2",n:20,q:"A pilot suspects that he is undershooting a forced landing in calm conditions. The best technique to employ would be",o:["Raise the nose to decrease the gliding speed","Increase the gliding speed to allow for a longer float after round out","Increase the flap extension","Maintain the speed that produces the best lift drag ratio"],a:3},
  {t:"Test 2",n:21,q:"A level balanced turn with an angle of bank of 75° would cause an increase in stalling speed of approximately",o:["10%","50%","100%","200%"],a:2},
  {t:"Test 2",n:22,q:"More power is required during a level turn to maintain the same indicated air speed as in straight and level flight because",o:["The nose attitude in a turn is higher","The elevator in a turn is deflected into the slipstream","Aileron drag is produced by the deflected ailerons during a turn","The total drag on the aircraft is increased during a turn"],a:3},
  {t:"Test 2",n:23,q:"During a level balanced turn at constant bank the effect of increasing power will be",o:["Rate of turn will be the same but radius of turn will decrease","Both rate and radius of turn will increase","Rate of turn will increase and radius of turn will decrease","Rate of turn will decrease and radius of turn will increase"],a:3},
  {t:"Test 2",n:24,q:"If ice forms on propeller blades during flight, the immediate effect on the aircraft will be",o:["A decrease in thrust available","An increase in total drag","The propeller blades may not be able to be feathered","The extra weight will affect the centre of gravity"],a:0},
  {t:"Test 2",n:25,q:"One result of ground effect is",o:["The take off run is longer than usual","The float after round out is longer than usual","The climb out after take off is improved","The touch down occurs immediately after round out"],a:1},
  {t:"Test 2",n:26,q:"The initial effect of propeller torque is to cause the aircraft to",o:["Roll opposite to propeller rotation","Yaw opposite to propeller rotation","Roll with propeller rotation","Yaw with propeller rotation"],a:0},
  {t:"Test 2",n:27,q:"The tendency to yaw on take off in a tailwheel aircraft with a clockwise rotating propeller is greatest in",o:["A crosswind from the left","A headwind","Calm conditions","A crosswind from the right"],a:0},
  {t:"Test 2",n:28,q:"Which of the following factors will alter the indicated stalling speed of an aeroplane?",o:["Air density","Power setting","Altitude","Density altitude"],a:1},
  {t:"Test 2",n:29,q:"The most significant effect of not clearing frost from the wings of an aircraft before flight is that",o:["The stalling angle will increase","The indicated stalling speed will increase","There will be a marked deterioration on acceleration during the take off run","Both the indicated stalling speed and the stalling angle will increase"],a:1},
  {t:"Test 2",n:30,q:"Which of the following flight instruments will best allow a pilot to differentiate between a spin and a spiral dive?",o:["The vertical speed indicator","The flight attitude indicator","The airspeed indicator","The turn and balance indicator"],a:2},
  {t:"Test 2",n:31,q:"The aerodynamic lift force on an aeroplane always acts perpendicular to the",o:["Longitudinal axis","Wing chord","Relative airflow","Thrust line"],a:2},
  {t:"Test 2",n:32,q:"How will the magnitude of the lift force vary if the angle of attack of an aerofoil is increased towards the stalling angle?",o:["Lift will decrease and then increase","Lift will increase","Lift will increase and then decrease","Lift will decrease"],a:1},
  {t:"Test 2",n:33,q:"More power is required to maintain altitude as the IAS is reduced, if the aeroplane is flying at speeds below the",o:["Maximum structural cruising speed","Maximum endurance speed","Best rate of climb speed","Best range speed"],a:1},

  {t:"Test 3",n:3,q:"To achieve maximum specific air range, a piston engine aircraft must be flown at a speed which will give the",o:["Minimum lift/drag ratio","Minimum fuel consumption rate","Maximum lift","Least total drag"],a:3},
  {t:"Test 3",n:4,q:"What effect will a headwind have on the angle and rate of climb?",o:["The angle will increase and the rate will remain unchanged","The angle will decrease and the rate will increase","The angle will increase and the rate will decrease","The angle and rate will both increase"],a:0},
  {t:"Test 3",n:5,q:"If the indicated stalling speed of an aeroplane is 50 kt in level flight, what will the indicated stalling speed be in a 45° bank balanced turn?",o:["50 kt","70 kt","100 kt","60 kt"],a:3},
  {t:"Test 3",n:6,q:"One reason for using flap during an approach to land is that it",o:["Increases downwash and reduces ground effect","Increases drag and permits a steeper approach angle","Increases lift and prolongs the float before touchdown","Increases the lift/drag ratio and reduces touchdown speeds"],a:1},
  {t:"Test 3",n:7,q:"How will lowering partial flap affect the glide performance if IAS is maintained?",o:["The glide angle will decrease","The rate of descent will decrease","The glide distance will increase","The glide angle and rate of descent will both increase"],a:3},
  {t:"Test 3",n:8,q:"To achieve the maximum glide range in still air at a higher weight the pilot should",o:["Maintain IAS and reduce the angle of attack", "Reduce the IAS and increase the angle of attack", "Reduce the IAS and maintain the angle of attack", "Increase the IAS and maintain the angle of attack"],a:3},
  {t:"Test 3",n:9,q:"If bank is increased and power is kept constant during a level turn, what will be the effect on turn performance?",o:["Rate and radius of turn will increase", "Rate of turn will increase and radius of turn will decrease", "Rate of turn will decrease and radius of turn will increase", "Radius and rate of turn will decrease"],a:1},
  {t:"Test 3",n:10,q:"If the centre of gravity of an aeroplane is moved further forward, the effect on the static stability is",o:["Lateral stability will improve", "Directional stability will deteriorate", "Longitudinal stability will deteriorate and directional stability will improve", "Longitudinal stability will improve"],a:3},
  {t:"Test 3",n:11,q:"If the indicated stalling speed of an aeroplane is 60 kt in level flight, what will the indicated stalling speed be in a 60° bank level turn?",o:["70 kt", "75 kt", "60 kt", "85 kt"],a:3},
  {t:"Test 3",n:12,q:"Climbing an aeroplane at a slightly lower speed than that recommended for best rate will result in",o:["A decreased rate and angle of climb", "A decreased rate and increased angle of climb", "An increased rate and angle of climb", "An increased rate and decreased angle of climb"],a:1},
  {t:"Test 3",n:13,q:"Consider the turn performance of two aeroplanes of different gross weights. At the same IAS, altitude and bank angle, the heavy aeroplane will have",o:["A lower rate and greater radius of turn than the light one", "A greater rate of turn than the light one", "The same rate and radius of turn as the light one", "A greater radius of turn than the light one"],a:2},
  {t:"Test 3",n:14,q:"In level flight the speed at which total drag would be a minimum would be",o:["The minimum speed for level flight", "The maximum cruising speed", "The normal cruising speed", "Less than the normal cruising speed"],a:3},
  {t:"Test 3",n:15,q:"How will gliding at a higher speed than that recommended for the best glide affect the glide range?",o:["Glide range remains the same", "Glide range decreases", "Glide range increases"],a:1},
  {t:"Test 3",n:16,q:"The stalling angle of attack of an aerofoil is that angle of attack at which",o:["The lift and drag produced are equal", "The lift/drag ratio is at a maximum", "The aerofoil is producing maximum lift", "The aerofoil is producing maximum drag"],a:2},

  {t:"Test 3",n:21,q:"Due to high traffic density at your destination you have planned to hold, if required, at an altitude of 1500 feet. On arrival you are advised by ATC that holding at that level is not available and you are required to hold at 5000 feet instead. The effect this change of level will have on holding is",o:["The maximum time for which you can hold will increase", "The maximum time for which you can hold will decrease", "The maximum time for which you can hold will not be affected", "Less power will be needed for holding"],a:1},
  {t:"Test 3",n:22,q:"What will be the effect of a headwind on glide range and glide endurance if an aeroplane is flown at its best lift/drag ratio speed?",o:["Range will be unaffected but endurance will increase", "Range will be reduced but endurance will be unaffected", "Range will be unaffected but endurance will be reduced", "Range and endurance will both be reduced"],a:1},
  {t:"Test 3",n:23,q:"An aeroplane is flying at 120 kt IAS in straight and level flight. In order to execute a steep turn at the same height and IAS, extra power is required to offset the",o:["Centripetal force induced by the turn", "Increased wing loading as bank is applied", "Loss of the vertical component of lift caused by the bank", "Increased induced drag caused by the higher angle of attack"],a:3},
  {t:"Test 3",n:24,q:"Assuming other factors remain constant, how will lift and drag vary as the angle of attack of an aerofoil is increased from 4° towards the stalling angle?",o:["Lift will increase and drag will decrease", "Lift and drag will both increase", "Lift will decrease and drag will increase", "Lift and drag will both decrease"],a:1},
  {t:"Test 3",n:25,q:"An aircraft is established on final in the region of reverse command. If the pilot now increases the back pressure on the control column the effect on rate of descent and indicated air speed will be",o:["Both rate of descent and indicated air speed will increase", "Indicated air speed will increase and rate of descent will decrease", "Indicated air speed will decrease and rate of descent will increase", "Both rate of descent and indicated air speed will decrease"],a:2},
  {t:"Test 3",n:26,q:"Which statement is correct regarding the accumulation of ice on the blades of a propeller during flight?",o:["It is impossible due to the speed of rotation of the blades", "It can be encountered at OATs above freezing on humid days", "Thrust could exceed the maximum permitted if ice forms", "Thrust will be reduced and vibrations are likely"],a:3},

  {t: "Book A4", n: 8, q: "Refer to the figure. For an aircraft to achieve maximum endurance in level flight it must be flown", o: ["at speed S", "slower than speed S in any wind conditions", "slower than speed S if a tailwind exists", "faster than speed S if a tailwind exists"], a: 1, note: "The figure for this question is not included here."},
  {t: "Book A4", n: 9, q: "Ignoring all other considerations, the theoretical height to fly at in a piston engined aeroplane to achieve maximum range is", o: ["as low as possible", "as high as possible", "at full-throttle height", "the height at which the indicated airspeed is highest"], a: 2},
  {t: "Book A5", n: 6, q: "A pilot assesses that he is undershooting the selected field while on final for a forced landing in nil wind at the best lift/drag ratio speed. The safest procedure to employ is", o: ["move the propeller pitch control to fully fine", "adopt a higher nose attitude", "increase the indicated airspeed", "maintain the present nose attitude and airspeed"], a: 3},
  {t: "Book A5", n: 21, q: "An aircraft is carrying out a glide descent during a forced landing in no wind. The pilot is maintaining the airspeed recommended for best lift/drag ratio and realises he is undershooting. The correct course of action would be", o: ["dive to increase the IAS then float in ground effect to the field", "raise the nose to a higher descent attitude to increase glide distance", "apply more flap to increase the lift/drag ratio", "maintain the current descent attitude to achieve maximum gliding distance"], a: 3},
  {t: "Book A3", n: 5, q: "Design features such as high aspect ratio, wash out and taper have the effect of increasing the aircraft's", o: ["maximum speed", "stalling speed", "maximum lift", "maximum lift/drag ratio"], a: 3},
  {t: "Book Progress", n: 1, q: "A primary reason for designing a wing with washout is to", o: ["reduce induced drag at cruising speed", "ensure that the wing tip will not stall before the wing root", "improve aileron effectiveness throughout the speed range"], a: 1},
  {t: "Book Progress", n: 2, q: "The dihedral angle on a high wing aircraft is usually less than that on a low wing design because the high wing design has", o: ["stronger lateral stability", "stronger longitudinal stability", "weaker lateral stability", "weaker longitudinal stability"], a: 0},
  {t: "Book Progress", n: 9, q: "The primary reason for designing a wing with anhedral is", o: ["to enhance lateral stability", "to reduce lateral stability", "to enhance longitudinal stability", "to reduce longitudinal stability"], a: 1},
  {t: "Book Progress", n: 4, q: "Spiral instability is a result of an interaction between", o: ["rolling and yawing", "rolling and pitching", "yawing and pitching", "low speed and high speed"], a: 0},
  {t: "Book Progress", n: 5, q: "Select the combination that would increase the tendency for an aircraft to spiral dive", o: ["strong lateral stability and weak directional stability", "weak lateral stability and strong longitudinal stability", "weak lateral stability and strong directional stability", "strong lateral stability and strong directional stability"], a: 2},
  {t: "Book Progress", n: 6, q: "Longitudinal dihedral enhances stability in pitch by providing an angle of incidence of the", o: ["tailplane which is greater than that of the mainplane", "tailplane which is less than that of the mainplane", "tailplane which is the same as that of the mainplane", "left wing which is the same as that of the right wing"], a: 1},
  {t: "Book A6", n: 9, q: "One effect of moving the centre of gravity of an aircraft further forward is that", o: ["the stalling angle will increase", "the stalling angle will decrease", "the longitudinal stability will increase", "the directional stability will decrease"], a: 2},
  {t: "Book A6", n: 17, q: "One effect of swept-back wings on aircraft stability is", o: ["longitudinal stability increases", "lateral stability increases", "directional stability decreases", "lateral stability decreases"], a: 1},
  {t: "Book A2", n: 4, q: "As the angle of attack of an aerofoil is increased from zero to the stalling angle at constant indicated air speed, the magnitude of the force of lift", o: ["increases then decreases", "decreases continuously", "decreases then increases", "increases continuously"], a: 3},
  {t: "Book A2", n: 5, q: "Any increase in the angle of attack beyond the stalling angle at constant indicated air speed will cause", o: ["less lift and more drag", "more lift and less drag", "more lift and more drag", "less lift and less drag"], a: 0},
  {t: "Book A2", n: 6, q: "As the angle of attack of an aerofoil is increased beyond the stalling angle at constant indicated air speed, the magnitude of the force of lift", o: ["increases then decreases", "decreases continuously", "decreases then increases", "increases continuously"], a: 1},
  {t: "Book A2", n: 10, q: "As the angle of attack is increased from zero to the stalling angle, the centre of pressure of most aerofoils", o: ["moves further forward", "moves further aft", "remains stationary", "moves forward, then aft"], a: 0},
  {t: "Book A2", n: 12, q: "If angle of attack is increased from zero to beyond the stalling angle at constant indicated air speed, the magnitude of the force of drag", o: ["increases then decreases", "decreases continuously", "decreases then increases", "increases continuously"], a: 3},
  {t: "Book A2", n: 13, q: "As the angle of attack of a cambered aerofoil is increased in flight towards the stalling angle, the effect on the total reaction is that", o: ["the point on the chord through which the total reaction acts moves aft", "the point on the chord through which the total reaction acts remains stationary", "the total reaction increases up to the best lift/drag ratio angle, then moves aft", "the magnitude of the total reaction continues to increase up to the stalling angle"], a: 3},
  {t: "Book A2", n: 14, q: "An aircraft in level flight is flying at angle of attack X. This represents", o: ["the maximum speed in level flight", "the minimum speed in level flight", "the speed for the best lift/drag ratio", "the speed for the best endurance"], a: 1, note: "The figure from the book for this question is not included here."},
  {t: "Book A2", n: 20, q: "As the angle of attack of an aerofoil is increased towards the stalling angle at constant IAS, the effect on the coefficients of lift and drag is", o: ["the coefficient of lift increases and the coefficient of drag increases", "the coefficient of lift decreases and the coefficient of drag decreases", "the coefficient of lift increases and the coefficient of drag decreases", "the coefficient of lift decreases and the coefficient of drag increases"], a: 0},

  {t: "Book A4", n: 1, q: "An aircraft of a certain weight is flown at 150 kt IAS at 1000 ft. If the same aircraft was flown at 150 kt IAS at 20000 ft, the angle of attack required to maintain level flight would be", o: ["greater because of the reduced density at 20000 ft", "less because of the reduced drag in the thinner air", "greater because the TAS would have to be higher", "the same"], a: 3},
  {t: "Book A6", n: 4, q: "Which of the following applies to an aircraft which stalls during a sudden pull out from a dive?", o: ["the stalling speed and stalling angle will both increase", "the stalling speed will increase while the stalling angle will remain the same", "the stalling speed will increase while the stalling angle will decrease", "the stalling speed will remain the same while the stalling angle will increase"], a: 1},
  {t: "Book A6", n: 6, q: "What effect will the formation of ice on the leading edges of the wings have on the stalling characteristics of the aircraft?", o: ["the stalling angle will be increased", "the stall will occur at a lower indicated air speed", "both the stalling angle and the stalling indicated air speed will be increased", "the stalling indicated air speed will increase and the stalling angle will decrease"], a: 3},
  {t: "Book A5", n: 27, q: "An aircraft entering ground effect on landing will experience", o: ["a nose up pitching moment and an increase in longitudinal stability", "a nose down pitching moment and an increase in longitudinal stability", "a nose up pitching moment and a decrease in longitudinal stability", "a nose down pitching moment and a decrease in longitudinal stability"], a: 1},
  {t: "Book A5", n: 28, q: "An aircraft leaving ground effect on take-off will experience", o: ["a nose up pitching moment and an increase in longitudinal stability", "a nose down pitching moment and an increase in longitudinal stability", "a nose up pitching moment and a decrease in longitudinal stability", "a nose down pitching moment and a decrease in longitudinal stability"], a: 2},

const EXPL = {
 "Test 1|1": "Stall speed rises with the square root of the load factor. A 60° bank gives a load factor of 2, and √2 ≈ 1.4, so 60 × 1.4 ≈ 85 kt.",
 "Test 1|2": "As angle of attack rises toward the stall, lift and drag both keep increasing. Drag grows faster than lift after about 4°.",
 "Test 1|3": "At low speed the air has more time to flow from the bottom to the top of the wing, so induced drag is worst at low speed. Induced drag falls continuously as speed rises.",
 "Test 1|4": "Lift equals weight in level flight, so the lift/drag ratio is greatest where drag is at its minimum. That is speed X on the curve.",
 "Test 1|5": "Pitch and yaw stability depend on the arm from the CG to the fin and rudder. Moving the CG forward lengthens that arm and adds keel surface behind the CG, so directional stability increases.",
 "Test 1|6": "At high power and low speed the propeller slipstream blows high-energy air over the rudder and elevators. The ailerons sit outside that flow, so the elevator and rudder are more effective.",
 "Test 1|7": "The ball shows a yaw imbalance, and rudder trim corrects it. The key's answer is that the rudder trim tab should be deflected to the right.",

ecause the rate of fuel flow does not change. A headwind does reduce range, because less distance is covered over the ground per litre of fuel.", "Book A4|4": "In a headwind, fly faster than best lift/drag ratio speed. In a tailwind, fly slower.", "Book A4|5": "Both should fly at the same angle of attack. The heavier aircraft needs more lift, so it must fly at a higher IAS.", "Book A4|7": "Speed S is the bottom of the drag curve, which is minimum drag. A heavier aircraft has a higher S, but you still fly at S.", "Book A4|8": "Maximum endurance requires minimum power. Minimum power is always at a slower speed than minimum drag, whatever the wind.", "Book A4|9": "The airframe is most efficient at any height as long as IAS equals best lift/drag ratio speed. The engine is most efficient at full throttle, so in theory you fly at the height where full throttle gives that IAS.", "Book A5|6": "In no wind you can do no better than fly at best lift/drag ratio speed, so keep the current nose attitude and airspeed.", "Book A5|21": "The best lift/drag ratio gives the best descent angle. If you are undershooting at that speed, all you can do is keep the current attitude and airspeed.", "Book A3|5": "These features reduce vortex formation and induced drag, by reducing the size of the wing tip or the angle of attack at the tip. For the same lift, less drag means a higher lift/drag ratio.", "Book Progress|1": "Washout mainly reduces induced drag at low speed, not at cruise. Its main purpose is to make the wing tip the last section to stall, so the root stalls first and the ailerons stay effective.", "Book Progress|2": "High wings get natural lateral stability from the pendulum effect, because the weight sits below the lift. They need little dihedral, and some have none.", "Book Progress|9": "Anhedral reduces lateral stability. It is often used on swept-wing designs, where sweepback gives too much lateral stability and too little roll manoeuvrability.", "Book Progress|4": "Weak lateral stability and strong directional stability let roll and yaw feed each other into a spiral. The yaw from directional stability drives the roll, and the roll keeps the spiral going.", "Book Progress|5": "Weak lateral stability cannot return the wings to level, and strong directional stability produces the yaw that keeps the roll going. A spiral dive results.", "Book Progress|6": "With a lower tailplane incidence, the tail gains lift faster than the wing as angle of attack rises. The nose then pitches down, which restores the trim.", "Book A6|9": "A larger keel surface and arm behind the centre of gravity give more longitudinal and directional stability. Moving the CG forward increases longitudinal stability.", "Book A6|17": "When a swept-back wing sideslips after a wing drop, the lower wing's effective span and chord increase. That gives strong lateral stability.", "Book A2|4": "Lift keeps increasing up to the stalling angle. It only falls after the stall is exceeded.", "Book A2|5": "Beyond the stalling angle, lift decreases while drag continues to increase.", "Book A2|6": "Beyond the stall, lift decreases continuously.", "Book A2|10": "At higher angles of attack the front of the wing contributes more of the total lift, so the centre of pressure moves forward.", "Book A2|12": "Drag keeps increasing as angle of attack increases, including beyond the stalling angle. The stall has no special effect on drag.", "Book A2|13": "As angle of attack increases, a greater proportion of the free airstream's energy is absorbed. The total reaction keeps growing up to the stalling angle.", "Book A2|14": "Angle X is the point of maximum lift coefficient. In level flight lift equals weight, so the highest lift coefficient means the lowest possible IAS: the minimum speed in level flight.", "Book A2|20": "Both the lift and drag coefficients rise as angle of attack increases. More lift and more drag are generated at the same airspeed.", "Book A2|21": "In level flight the value of lift is always equal to weight, whatever the angle of attack.", "Book A3|25": "The highest lift/drag ratio is achieved at minimum drag, which is the peak of the lift/drag curve at angle A.", "Book A4|1": "In level flight lift must equal weight. Lift depends on IAS and angle of attack, so with the same weight and IAS the angle of attack must be the same, even though TAS is higher.", "Book A6|4": "An aerofoil stalls at a certain angle, not at a certain speed. Inertia keeps the flight path unchanged, so the stall occurs at a higher IAS but at the same angle.", "Book A6|6": "Ice changes the aerofoil shape, so flow separates at a lower angle of attack. The stalling angle falls, so the stalling IAS must be higher.", "Book A5|27": "Ground effect has been a factor in many landing accidents. The reduced induced drag makes the aircraft reluctant to slow during the float, and the nose-down pitch and extra stability can make it touch down too fast and too early.", "Book A5|28": "Leaving ground effect gives a nose-up pitch and less longitudinal stability. Induced drag rises and IAS decays, so climbing before the aircraft is ready is very dangerous.", "Book A5|29": "Near the ground the air can't flow around the wing tips as easily, so the vortices and the induced drag are reduced.", "Book A6|1": "Leaving ground effect lets the wingtip vortices form again, so induced drag increases.", "Book A6|16": "The reduction in induced drag from ground effect prolongs the float.", "Book A4|2": "Vortex generators re-energise the boundary layer so the flow stays attached to the wing for longer. That delays the stall and improves control at low speed, with almost no effect on total drag."});

{"t": "Climb, Descent & Turning", "n": 1, "q": "If frost forms on the wings of an aircraft overnight and is not removed before flight.", "o": ["the acceleration during the take-off run will be less than normal.", "the stalling angle will be higher than normal.", "there will be less margin between the take-off safety speed and the stalling speed.", "there will be an increase in stalling speed and stalling angle"], "a": 2},

{"t": "Climb, Descent & Turning", "n": 3, "q": "During an approach what is the effect of a sudden decrease in headwind component on [AS and rate of descent ?", "o": ["IAS and rate of descent would both increase", "IAS and rate of descent would both decrease", "TAS would decrease and rate of descent would increase", "TAS would increase and rate of descent would decrease"], "a": 2},

{"t": "Stability & Control", "n": 12, "q": "An aeroplane leaving ground effect will experience", "o": ["an increase in lift", "an increase in induced drag", "an increase in indicated air speed", "an increase in rate of climb pe ELEC"], "a": 1},
{"t": "Stability & Control", "n": 14, "q": "Which of the following would cause a reduction in the indicated stalling speed of an aeroplane?", "o": ["an increase in altitude", "an increase in weight", "a rearward movement in the centre of gravity", "a forward movement in the centre of gravity 12.8"], "a": 2},
{"t": "Stability & Control", "n": 16, "q": "One result of ground effect is", "o": ["the take off run is longer than usual", "the float after round out is longer than usual", "the climb after lift off is improved", "the touch down occurs immediately after round out"], "a": 1},
{"t": "Stability & Control", "n": 17, "q": "One effect of swept-back wings on aircraft stability is", "o": ["longitudinal stability increases", "lateral stability increases", "directional stability decreases", "lateral stability decreases"], "a": 1},
{"t": "Stability & Control", "n": 18, "q": "Mass balances are fitted to aircraft control surfaces to", "o": ["make them easier to move at high airspeed", "prevent control surface flutter", "improve low speed handling", "reduce drag on the deflected control surface"], "a": 1},
{"t": "Stability & Control", "n": 19, "q": "Aileron drag is the tendency of the aircraft to yaw away from the direction of turn when large amounts of aileron are applied at low airspeed. This is caused by", "o": ["uneven lift produced when the ailerons are operated", "extra drag produced by the down going aileron", "extra drag produced by the up going aileron", "a higher angle of attack on the rising wing"], "a": 1},
{"t": "Stability & Control", "n": 20, "q": "To trim an aircraft for a higher nose attitude, the elevator trim tab must be deflected so as to provide a local lift force which acts -", "o": ["upwards to lift the elevator up", "upwards to push the elevator down", "downwards to lift the elevator up", "downwards to push the elevator down"], "a": 0},
{"t": "Stability & Control", "n": 21, "q": "A horn balance reduces the force necessary to deflect the rudder by -", "o": ["extending an area forward of the hinge in the opposite direction to the desired rudder deflection", "extending an area behind the hinge in the opposite direction to the desired rudder deflection", "extending an area forward of the hinge in the same direction to the desired rudder deflection", "extending an area behind the hinge in the same direction to the desired rudder deflection"], "a": 0},

const AERO_TOPICS = ["Aerodynamics Basics", "Aerofoils & Lift/Drag", "Aircraft Motion & Propellers", "Total Drag & Performance", "Climb, Descent & Turning", "Stability & Control", "Progress Test 10 & 11"];
QUESTIONS.push(...AERO_CH);

const LET = ["a","b","c","d","e"];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(id, on) { $(id).classList.toggle("hidden", !on); }

const TOPIC_LABELS = {range:"Range & endurance", wing:"Wing design", stab:"Stability", flow:"Flow & angle of attack", ground:"Ground effect & take-off/landing", vg:"Spoilers & vortex generators"};
const TAGS = {};
function tagQs(topic, list) { list.forEach(([t, n]) => { const k = t + "|" + n; (TAGS[k] = TAGS[k] || []).push(topic); }); }
tagQs("range", [["Test 1",4],["Test 1",14],["Test 1",15],["Test 1",18],["Test 2",14],["Test 2",18],["Test 2",19],["Test 2",20],["Test 2",33],["Test 3",2],["Test 3",3],["Test 3",7],["Test 3",8],["Test 3",14],["Test 3",15],["Test 3",20],["Test 3",21],["Test 3",22],["Test 3",29]]);
tagQs("wing", [["Test 2",28]]);
tagQs("stab", [["Test 1",5],["Test 2",5],["Test 3",10]]);
tagQs("flow", [["Test 1",2],["Test 1",31],["Test 1",32],["Test 2",1],["Test 2",2],["Test 2",3],["Test 2",4],["Test 2",31],["Test 2",32],["Test 3",16],["Test 3",24],["Test 3",28]]);
tagQs("ground", [["Test 1",25],["Test 2",8],["Test 2",25],["Test 3",1],["Test 3",6]]);

tagQs("range", [["Book A1", 3], ["Book A1", 4], ["Book A1", 7], ["Book A1", 8], ["Book A3", 4], ["Book A3", 8], ["Book A3", 11], ["Book A3", 12], ["Book A3", 14], ["Book A3", 21], ["Book A3", 22], ["Book A3", 23], ["Book A3", 24], ["Book A3", 30], ["Book A4", 3], ["Book A4", 4], ["Book A4", 5], ["Book A4", 7], ["Book A4", 8], ["Book A4", 9], ["Book A5", 6], ["Book A5", 21]]);
tagQs("wing", [["Book A3", 5], ["Book Progress", 1], ["Book Progress", 2], ["Book Progress", 9], ["Book A6", 17]]);
tagQs("stab", [["Book Progress", 2], ["Book Progress", 9], ["Book Progress", 4], ["Book Progress", 5], ["Book Progress", 6], ["Book A6", 9], ["Book A6", 17]]);
tagQs("flow", [["Book A2", 4], ["Book A2", 5], ["Book A2", 6], ["Book A2", 10], ["Book A2", 12], ["Book A2", 13], ["Book A2", 14], ["Book A2", 20], ["Book A2", 21], ["Book A3", 25], ["Book A4", 1], ["Book A6", 4], ["Book A6", 6]]);
tagQs("ground", [["Book A5", 27], ["Book A5", 28], ["Book A5", 29], ["Book A6", 1], ["Book A6", 16]]);
tagQs("vg", [["Book A4", 2]]);

let starred = new Set();
try { starred = new Set(JSON.parse(localStorage.getItem("aero_starred") || "[]")); } catch (e) {}
function saveStars() { try { localStorage.setItem("aero_starred", JSON.stringify([...starred])); } catch (e) {} }
const qkey = q => q.t + "|" + q.n;
function toggleStar() {
  const k = qkey(pool[idx]);
  starred.has(k) ? starred.delete(k) : starred.add(k);
  saveStars();
  updateStar();
}
function updateStar() {
  const b = $("starBtn");
  const on = starred.has(qkey(pool[idx]));
  b.textContent = on ? "★" : "☆";
  b.classList.toggle("on", on);
}

const MODES = {
  all:   {label:"All questions (shuffled)", list:() => QUESTIONS, shuffle:true},
  t1:    {label:"Final Test 1", list:() => QUESTIONS.filter(q => q.t === "Test 1")},
  t2:    {label:"Final Test 2", list:() => QUESTIONS.filter(q => q.t === "Test 2")},
  t3:    {label:"Final Test 3 (Q1-29)", list:() => QUESTIONS.filter(q => q.t === "Test 3")},
  graph: {label:"Graph / diagram questions", list:() => QUESTIONS.filter(q => q.diagram || q.img)},
  weak:  {label:"CASA identified weakpoints", list:() => QUESTIONS.filter(q => TAGS[qkey(q)])},
  book:  {label:"Book questions", list:() => QUESTIONS.filter(q => q.t.startsWith("Book"))},
  ch_basics: {label:"Aerodynamics Basics (chapter)", list:() => QUESTIONS.filter(q => q.t === "Aerodynamics Basics")},
  ch_aerofoil: {label:"Aerofoils & Lift/Drag (chapter)", list:() => QUESTIONS.filter(q => q.t === "Aerofoils & Lift/Drag")},
  ch_motion: {label:"Aircraft Motion & Propellers (chapter)", list:() => QUESTIONS.filter(q => q.t === "Aircraft Motion & Propellers")},
  ch_drag: {label:"Total Drag & Performance (chapter)", list:() => QUESTIONS.filter(q => q.t === "Total Drag & Performance")},
  ch_climb: {label:"Climb, Descent & Turning (chapter)", list:() => QUESTIONS.filter(q => q.t === "Climb, Descent & Turning")},
  ch_stability: {label:"Stability & Control (chapter)", list:() => QUESTIONS.filter(q => q.t === "Stability & Control")},
  ch_progress: {label:"Progress Test 10 & 11 (chapter)", list:() => QUESTIONS.filter(q => q.t === "Progress Test 10 & 11")},
  chapters: {label:"All chapter topics", list:() => QUESTIONS.filter(q => AERO_TOPICS.includes(q.t))},
  shuffled: {label:"ALL QUESTIONS SHUFFLED", list:() => [...QUESTIONS], shuffle:true},
  star:  {label:"Starred for later", list:() => QUESTIONS.filter(q => starred.has(qkey(q)))}
};
function populateMenu() {
  const sel = $("testSel");
  sel.innerHTML = "";
  Object.keys(MODES).forEach(k => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = `${MODES[k].label} (${MODES[k].list().length})`;
    sel.appendChild(o);
  });
}

function startQuiz(source) {
  let list, shuffleIt;
  if (source) { list = source; shuffleIt = $("shuffleChk").checked; }
  else {
    const m = MODES[$("testSel").value];
    list = m.list();
    shuffleIt = m.shuffle || $("shuffleChk").checked;
  }
  if (!list.length) { alert("No questions in this set yet. Star some questions or pick another set."); return; }
  pool = (shuffleIt ? shuffle([...list]) : [...list]).map(shuffleOpts);
  idx = 0; score = 0; wrongList = [];
  show("setup", false); show("results", false); show("quiz", true);
  renderQ();
}

function renderQ() {
  answered = false;
  selected = null;
  const q = pool[idx];
  updateStar();
  $("topic").textContent = (TAGS[qkey(q)] || []).map(t => TOPIC_LABELS[t]).join(" · ");
  $("counter").textContent = `${q.t} · Q${q.n} · ${idx + 1} of ${pool.length}`;
  $("scoreLive").textContent = `Score: ${score}`;
  $("bar").style.width = (idx / pool.length * 100) + "%";
  $("qtext").textContent = q.q;
  const note = $("qnote");
  const img = $("qimg");
  if (q.img) {
    img.src = q.img;
    show("qimg", true);
    show("qnote", false);
  } else {
    show("qimg", false);
    if (q.note || q.diagram) {
      note.textContent = q.note || "This question refers to a diagram on the original test sheet.";
      show("qnote", true);
    } else show("qnote", false);
  }

  const opts = $("opts");
  opts.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">[${LET[i]}]</span>${text}`;
    b.onclick = () => choose(i);
    opts.appendChild(b);
  });
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  setAction();
}

function choose(i) {
  if (answered) return;
  selected = i;
  ROOT.querySelectorAll(".opt").forEach((b, k) => b.classList.toggle("selected", k === i));
  setAction();
}

function submit() {
  if (answered || selected === null) return;
  answered = true;
  const i = selected;
  const q = pool[idx];
  const btns = ROOT.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add("correct");
  const fb = $("feedback");
  if (i === q.a) {
    score++;
    fb.className = "feedback good";
    fb.textContent = "Correct!";
  } else {
    btns[i].classList.add("wrong");
    wrongList.push({ ...q, chosen: i });
    fb.className = "feedback bad";
    fb.textContent = `Not quite. The correct answer is [${LET[q.a]}] ${q.o[q.a]}`;
  }
  $("scoreLive").textContent = `Score: ${score}`;
  const ex = document.createElement("div");
  ex.className = "expl";
  ex.innerHTML = "<strong>Explanation:</strong> " + (EXPL[q.t + "|" + q.n] || "");
  fb.appendChild(ex);
  setAction();
}

function nextQ() {
  if (idx < pool.length - 1) { idx++; renderQ(); }
  else showResults();
}

function showResults() {
  show("quiz", false); show("results", true);
  const pct = Math.round(score / pool.length * 100);
  $("finalScore").textContent = `${score} / ${pool.length} (${pct}%)`;
  $("finalMsg").textContent = pct >= 80 ? "Great work. Review the misses below." :
                              pct >= 50 ? "Solid start. Retry the missed questions to lock them in." :
                              "Keep going. Work through the misses, then retry them.";
  const ol = $("missedList");
  ol.innerHTML = "";
  if (!wrongList.length) {
    ol.innerHTML = "<li>No misses. Nice.</li>";
    $("retryBtn").disabled = true;
  } else {
    $("retryBtn").disabled = false;
    wrongList.forEach(q => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${q.t} Q${q.n}:</strong> ${q.q}<br>
        <span style="color:var(--bad)">Your answer: [${LET[q.chosen]}] ${q.o[q.chosen]}</span><br>
        <span style="color:var(--good)">Correct: [${LET[q.a]}] ${q.o[q.a]}</span><br>
        <span style="color:var(--muted)">${EXPL[q.t + "|" + q.n] || ""}</span>`;
      ol.appendChild(li);
    });
  }
}

$("startBtn").onclick = () => startQuiz();
function setAction() {
  const btn = $("actionBtn");
  if (answered) {
    btn.textContent = idx === pool.length - 1 ? "See results" : "Next";
    btn.disabled = false;
  } else {
    btn.textContent = "Submit";
    btn.disabled = selected === null;
  }
}
$("actionBtn").onclick = () => (answered ? nextQ() : submit());
$("quitBtn").onclick = () => { if (confirm("Quit this quiz and see your results so far?")) showResults(); };
$("retryBtn").onclick = () => startQuiz(wrongList.map(({chosen, ...q}) => q));
$("restartBtn").onclick = () => { show("results", false); show("quiz", false); show("setup", true); };
$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
};

document.addEventListener("keydown", e => {
  if (ROOT.classList.contains("hidden")) return;
  if ($("quiz").classList.contains("hidden")) return;
  if (!answered && /^[a-eA-E]$/.test(e.key)) choose(LET.indexOf(e.key.toLowerCase()));
  else if (e.key === "Enter") {
    if (!$("actionBtn").disabled) $("actionBtn").click();
  }
});
$("starBtn").onclick = toggleStar;
populateMenu();

  const cnt = document.getElementById("count-aero");
  if (cnt) cnt.textContent = QUESTIONS.length + " questions";
})();


</script>
